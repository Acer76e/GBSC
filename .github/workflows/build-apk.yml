name: Build Android APK

on:
  push:
    branches: [main, master, "claude/cloudflare-mobile-app-**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Scaffold platform folders
        run: |
          flutter create --project-name cloudflare_mobile --org com.acer76e --platforms=android --no-pub .
          # flutter_secure_storage 9.x ships kotlin-stdlib 1.9.x, but Flutter 3.24
          # scaffolds with Kotlin Gradle Plugin 1.7.10, causing compileReleaseKotlin
          # to fail with "Module was compiled with an incompatible version of Kotlin".
          sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")[^"]+/\11.9.24/' android/settings.gradle
          grep -n "kotlin.android" android/settings.gradle
          # Release manifests don't get the INTERNET permission by default —
          # only debug/profile manifests do. Without this, the release APK
          # cannot reach api.cloudflare.com (DNS lookup fails).
          sed -i '/^<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -n INTERNET android/app/src/main/AndroidManifest.xml
          # Override the Android display name. The Dart package stays
          # 'cloudflare_mobile' so existing app data (saved credentials)
          # carries over across updates.
          sed -i 's/android:label="cloudflare_mobile"/android:label="JUICE Command"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          # ─── Firebase / FCM wiring ────────────────────────────────────
          # Drop google-services.json into the android app dir.
          cp google-services.json android/app/google-services.json
          # Declare the Google Services Gradle plugin at the project level…
          sed -i '/id "org\.jetbrains\.kotlin\.android" version/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          # …and apply it in the app module so it processes google-services.json.
          sed -i '/id "dev\.flutter\.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          grep -n "google-services" android/settings.gradle android/app/build.gradle
          # firebase_messaging needs minSdk >= 21 (Flutter default), but be
          # explicit so a future Flutter default change doesn't break us.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle || true

      - name: Configure release signing
        # Sign every APK with the SAME persistent keystore (stored as a GitHub
        # secret) so Android allows in-place upgrades. Without this, each CI run
        # gets a fresh debug key → INSTALL_FAILED_UPDATE_INCOMPATIBLE and forces
        # the user to uninstall + reinstall every update.
        #
        # Gracefully no-ops if the KEYSTORE_BASE64 secret is missing — in that
        # case the build falls through to debug signing (existing behavior).
        env:
          KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:        ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:     ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:   ${{ secrets.STORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "⚠  KEYSTORE_BASE64 secret not set — APK will be debug-signed."
            echo "   Run generate-keystore.sh locally and add the 4 secrets to enable"
            echo "   in-place upgrades."
            exit 0
          fi
          # Decode the keystore to android/app/release.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # key.properties at the android/ root — Gradle reads it via rootProject.
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF
          # Append signing config to app/build.gradle. The block is guarded so
          # an absent key.properties (e.g. fork without secrets) falls back to
          # debug signing automatically.
          cat >> android/app/build.gradle <<'EOF'

          // ─── Release signing (appended by CI) ──────────────────────────
          def __ksProps = new Properties()
          def __ksFile  = rootProject.file('key.properties')
          if (__ksFile.exists()) {
              __ksFile.withInputStream { __ksProps.load(it) }
              android {
                  signingConfigs {
                      release {
                          keyAlias      __ksProps['keyAlias']
                          keyPassword   __ksProps['keyPassword']
                          storeFile     file(__ksProps['storeFile'])
                          storePassword __ksProps['storePassword']
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          EOF
          echo "✓ Release signing wired"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-mobile-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
