name: Build Android APK

on:
  push:
    branches: [main, master, "claude/cloudflare-mobile-app-**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Scaffold platform folders
        run: |
          flutter create --project-name cloudflare_mobile --org com.acer76e --platforms=android --no-pub .
          # flutter_secure_storage 9.x ships kotlin-stdlib 1.9.x, but Flutter 3.24
          # scaffolds with Kotlin Gradle Plugin 1.7.10, causing compileReleaseKotlin
          # to fail with "Module was compiled with an incompatible version of Kotlin".
          sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")[^"]+/\11.9.24/' android/settings.gradle
          grep -n "kotlin.android" android/settings.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-mobile-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
