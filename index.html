<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Quiz">
<title>Grade 6 Study Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --primary:#6366f1; --primary-2:#8b5cf6; --accent:#ec4899;
  --correct:#10b981; --correct-bg:#d1fae5; --correct-tx:#065f46;
  --incorrect:#ef4444; --incorrect-bg:#fee2e2; --incorrect-tx:#7f1d1d;
  --warn:#f59e0b; --warn-bg:#fef3c7;
  --subj:#3b82f6; --subj-bg:#dbeafe;
  --obj:#fb7185; --obj-bg:#ffe4e6;
  --text:#1f2937; --muted:#6b7280; --card:#ffffff; --line:#e5e7eb;
  --radius:18px; --shadow:0 10px 25px -5px rgb(0 0 0 / .12), 0 8px 10px -6px rgb(0 0 0 / .08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(135deg,#fef3c7,#ddd6fe,#fce7f3);
  background-size:200% 200%;
  animation:shift 25s ease infinite;
  color:var(--text);
  min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#app{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;gap:14px;}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:block;width:100%;padding:18px 20px;border-radius:14px;font-size:17px;font-weight:600;transition:transform .12s ease,background .2s,border-color .2s,box-shadow .2s;text-align:center;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 20px -4px rgba(99,102,241,.6);}
.btn-primary:hover{box-shadow:0 8px 24px -2px rgba(99,102,241,.7);}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--text);border:2px solid transparent;}
.btn-ghost:hover{border-color:var(--primary);}
.btn-small{padding:12px 16px;font-size:15px;}
.btn-warn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;box-shadow:0 6px 20px -4px rgba(239,68,68,.5);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px -4px rgba(16,185,129,.5);}
.btn-exam{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;box-shadow:0 6px 20px -4px rgba(220,38,38,.55);}
.btn-icon{display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-hint{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 10px -2px rgba(251,191,36,.5);}
.btn-hint:disabled{opacity:.55;cursor:default;}
h1{font-size:26px;line-height:1.2;}
h2{font-size:20px;line-height:1.35;}
h3{font-size:15px;line-height:1.3;}
.muted{color:var(--muted);font-size:14px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.hero{text-align:center;padding:24px 10px 10px;position:relative;}
.hero h1{font-size:30px;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.hero p{color:var(--muted);margin-bottom:6px;}
.avatar-btn{background:none;border:none;cursor:pointer;padding:0;margin-bottom:4px;display:inline-block;animation:wiggle 4s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.avatar-btn .avatar{font-size:84px;display:inline-block;transition:transform .2s;filter:drop-shadow(0 6px 12px rgba(99,102,241,.25));}
.avatar-btn:active .avatar{transform:scale(.85) rotate(-12deg);}
.avatar-tap{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;font-weight:700;margin-top:-4px;}
.avatar-mini{display:inline-block;font-size:22px;margin-right:6px;vertical-align:middle;}
.avatar-celebrate{animation:celebrate .9s cubic-bezier(.2,1.4,.4,1);display:inline-block;font-size:30px;}
@keyframes celebrate{0%{transform:scale(0) rotate(-30deg)}50%{transform:scale(1.4) rotate(15deg)}75%{transform:scale(1.1) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.stat{background:rgba(255,255,255,.75);border-radius:14px;padding:12px 6px;text-align:center;}
.stat .num{font-size:22px;font-weight:800;color:var(--primary);}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px;}

.topic-grid{display:grid;gap:10px;}
.topic{display:flex;align-items:center;gap:14px;background:#fff;padding:14px;border-radius:16px;border:2px solid transparent;transition:border-color .2s,transform .12s;cursor:pointer;text-align:left;width:100%;}
.topic:active{transform:scale(.98);}
.topic:hover{border-color:var(--primary);}
.topic .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.topic .info{flex:1;}
.topic .info .ttl{font-weight:700;font-size:16px;}
.topic .info .sub{font-size:13px;color:var(--muted);margin-top:2px;}
.topic .arrow{color:#9ca3af;font-size:22px;}
.topic.weak{border-color:var(--warn);}
.topic.weak .info .sub{color:var(--warn);font-weight:600;}
.topic.feature{background:linear-gradient(135deg,#dbeafe,#ffe4e6);border-color:var(--accent);}
.topic.feature .info .ttl{color:var(--accent);}
.topic .nbadge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;}

.progress{height:10px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease;border-radius:999px;}

.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;}
.badge{display:inline-block;background:rgba(99,102,241,.12);color:var(--primary);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.badge-exam{background:rgba(220,38,38,.15);color:#dc2626;}

.options{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.option{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);color:var(--text);padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;text-align:left;transition:border-color .15s,background .15s,transform .12s,box-shadow .2s;width:100%;position:relative;overflow:hidden;}
.option:not(:disabled):active{transform:scale(.97);}
.option:not(:disabled):hover{border-color:var(--primary);}
.option .letter{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:#f3f4f6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);animation:pulseG .55s ease;}
.option.correct .letter{background:var(--correct);color:#fff;}
.option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect-tx);}
.option.incorrect .letter{background:var(--incorrect);color:#fff;}
.option:disabled{cursor:default;}
@keyframes pulseG{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,.55)}50%{transform:scale(1.03);box-shadow:0 0 0 16px rgba(16,185,129,0)}100%{transform:scale(1)}}

.feedback{margin-top:14px;padding:14px;border-radius:14px;font-weight:600;text-align:center;animation:pop .35s ease;}
.feedback.correct{background:var(--correct-bg);color:var(--correct-tx);}
.feedback.incorrect{background:var(--incorrect-bg);color:var(--incorrect-tx);}
.feedback .hint{display:block;font-size:14px;font-weight:500;margin-top:6px;opacity:.85;line-height:1.45;}

.hint-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.18);border-left:4px solid var(--warn);font-size:14px;line-height:1.45;animation:pop .3s ease;}
.hint-box b{color:var(--warn);}
.hint-box .tag{font-size:11px;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px;}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.shake{animation:shake .4s ease;}

.streak{position:fixed;top:14px;right:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;animation:streakPop .45s ease;box-shadow:0 4px 14px rgba(239,68,68,.5);z-index:50;}
@keyframes streakPop{0%{transform:scale(0) rotate(-12deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1000;}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.score-big{text-align:center;padding:24px 16px 10px;}
.score-big .grade{font-size:88px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradeIn .8s cubic-bezier(.2,1.4,.4,1);}
.score-big .label{font-size:22px;font-weight:700;margin-top:8px;}
.score-big .pct{font-size:16px;color:var(--muted);margin-top:4px;}
.score-big .emoji{font-size:50px;margin-top:8px;display:block;animation:bounce 1.2s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gradeIn{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}

.stamp{display:inline-block;padding:18px 36px;border:5px double;border-radius:14px;font-weight:900;font-size:34px;letter-spacing:3px;text-transform:uppercase;transform:rotate(-8deg);animation:stamp .65s cubic-bezier(.2,1.5,.5,1);}
.stamp.pass{color:#059669;border-color:#059669;background:rgba(16,185,129,.08);}
.stamp.review{color:#dc2626;border-color:#dc2626;background:rgba(220,38,38,.08);}
@keyframes stamp{0%{transform:scale(4) rotate(-30deg);opacity:0}50%{transform:scale(.9) rotate(-12deg);opacity:1}80%{transform:scale(1.05) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}

.breakdown{margin-top:14px;}
.breakdown .row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:15px;}
.breakdown .row-b:last-child{border-bottom:none;}
.breakdown .name{font-weight:600;}
.breakdown .val{font-weight:700;color:var(--primary);}

.qtext{font-size:20px;font-weight:700;line-height:1.35;margin-top:6px;}
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn .35s cubic-bezier(.2,.8,.2,1);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text);align-self:flex-start;border:none;cursor:pointer;}
.back-btn:hover{background:rgba(255,255,255,.9);}

.topic-hero{text-align:center;padding:24px 14px;}
.topic-hero .big-icon{width:80px;height:80px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:44px;animation:popBig .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes popBig{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.topic-hero h1{margin-top:10px;}
.topic-hero p{color:var(--muted);margin-top:6px;}

.tip-list{display:flex;flex-direction:column;gap:10px;}
.tip{background:#fff;border-left:4px solid var(--primary);padding:14px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.tip h3{color:var(--primary);margin-bottom:6px;}
.tip p{font-size:14px;line-height:1.55;}

.flashcard{perspective:1200px;height:340px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;inset:0;border-radius:var(--radius);padding:24px;background:#fff;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,#fef3c7,#fce7f3);}
.flashcard .tap-hint{font-size:12px;color:var(--muted);margin-top:14px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.flashcard .term{font-size:22px;font-weight:700;line-height:1.3;}
.flashcard .answer{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.flashcard .answer-hint{font-size:15px;color:var(--text);opacity:.8;line-height:1.5;}
.fc-actions{display:flex;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600;}

.tut-section{margin-bottom:18px;}
.tut-section:last-child{margin-bottom:0;}
.tut-section h3{font-size:16px;color:var(--primary);margin-bottom:8px;}
.tut-section p{font-size:14px;line-height:1.55;margin-bottom:8px;}
.tut-section code{background:#f3f4f6;padding:2px 8px;border-radius:6px;font-size:13px;font-family:Menlo,Monaco,monospace;}
.contrast-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.contrast-box{padding:14px;border-radius:14px;text-align:center;}
.contrast-box.subj{background:var(--subj-bg);}
.contrast-box.obj{background:var(--obj-bg);}
.contrast-box .big-emoji{font-size:36px;margin-bottom:4px;}
.contrast-box h4{font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.contrast-box.subj h4{color:var(--subj);}
.contrast-box.obj h4{color:var(--obj);}
.contrast-box p{font-size:13px;color:var(--muted);margin-bottom:6px;}
.contrast-box code{display:block;background:rgba(255,255,255,.6);}
.pron-table{width:100%;border-collapse:collapse;}
.pron-table th{background:linear-gradient(90deg,var(--subj-bg),var(--obj-bg));padding:8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
.pron-table th:first-child{color:var(--subj);}
.pron-table th:last-child{color:var(--obj);}
.pron-table td{padding:8px;text-align:center;font-weight:600;border-top:1px solid #f3f4f6;font-size:15px;}
.mistake{margin-bottom:8px;padding:10px 12px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.mistake .wrong{color:var(--incorrect);font-size:14px;text-decoration:line-through;text-decoration-color:rgba(239,68,68,.5);margin-bottom:4px;}
.mistake .right{color:var(--correct-tx);font-size:14px;font-weight:600;}
.trick{padding:10px 12px;margin-bottom:8px;background:rgba(251,191,36,.13);border-left:3px solid var(--warn);border-radius:8px;font-size:14px;line-height:1.55;}
.trick b{color:var(--warn);}

.timer-row{display:flex;align-items:center;gap:12px;}
.timer-info{flex:1;min-width:0;}
.timer-ring{position:relative;width:48px;height:48px;flex-shrink:0;}
.timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block;}
.timer-ring .ring-bg{stroke:rgba(0,0,0,.09);fill:none;}
.timer-ring .ring-pg{transition:stroke-dashoffset .1s linear,stroke .25s;fill:none;}
.timer-ring .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--text);}
.timer-ring.warn .timer-num{animation:tickPulse .9s ease infinite;color:#ef4444;}
@keyframes tickPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.btn-timed{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;box-shadow:0 6px 20px -4px rgba(8,145,178,.55);}

.trend-chart{width:100%;height:auto;display:block;border-radius:10px;background:#fafafa;margin-top:6px;}
.trend-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.trend-stat{background:rgba(99,102,241,.08);padding:11px 12px;border-radius:12px;}
.trend-stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.trend-stat .v{font-size:18px;font-weight:800;color:var(--primary);margin-top:2px;line-height:1.1;}
.trend-stat.up{background:rgba(16,185,129,.12);}
.trend-stat.up .v{color:var(--correct);}
.trend-stat.down{background:rgba(239,68,68,.1);}
.trend-stat.down .v{color:var(--incorrect);}
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.hist{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border-radius:12px;border:1px solid #f3f4f6;font-size:13px;}
.hist .hd{font-size:22px;flex-shrink:0;}
.hist .info{flex:1;min-width:0;}
.hist .info .top{font-weight:700;font-size:14px;}
.hist .info .sub{color:var(--muted);font-size:11px;margin-top:2px;}
.hist .pct{font-weight:800;font-size:18px;flex-shrink:0;}
.hist .pct.high{color:var(--correct);}
.hist .pct.mid{color:var(--warn);}
.hist .pct.low{color:var(--incorrect);}
.mode-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;justify-content:center;}
.mode-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600;}
.mode-pill .dot{width:9px;height:9px;border-radius:50%;}

.celebrate-overlay{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.97),rgba(236,72,153,.97) 50%,rgba(99,102,241,.97));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;}
.celebrate-overlay.show{opacity:1;animation:bgPulse 3s ease-in-out infinite;}
.celebrate-overlay.fade-out{opacity:0;}
@keyframes bgPulse{0%,100%{background:radial-gradient(circle at 30% 40%,rgba(139,92,246,.97),rgba(236,72,153,.97) 50%,rgba(99,102,241,.97))}50%{background:radial-gradient(circle at 70% 60%,rgba(236,72,153,.97),rgba(251,191,36,.97) 50%,rgba(139,92,246,.97))}}
.celebrate-content{text-align:center;color:#fff;padding:30px;position:relative;z-index:2;animation:celeIn .75s cubic-bezier(.2,1.6,.4,1);max-width:90vw;}
@keyframes celeIn{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.12) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.celebrate-emoji{font-size:130px;display:block;animation:emoBounce 1.1s ease infinite;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));}
@keyframes emoBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.1)}}
.celebrate-streak{font-size:16px;font-weight:800;letter-spacing:3px;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,.4);}
.celebrate-title{font-size:54px;font-weight:900;letter-spacing:4px;margin:8px 0 6px;line-height:1;background:linear-gradient(135deg,#fff,#fef3c7,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleGlow 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.8)) drop-shadow(0 4px 14px rgba(0,0,0,.45))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,1)) drop-shadow(0 4px 14px rgba(0,0,0,.45))}}
.celebrate-sub{font-size:17px;margin:8px 0 26px;opacity:.96;text-shadow:0 2px 6px rgba(0,0,0,.35);font-weight:600;}

.speed-timer{position:fixed;top:8px;left:14px;right:14px;height:8px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.1);}

.daily-card{background:linear-gradient(135deg,#fef3c7,#fed7aa);border-radius:18px;padding:14px 16px;border:2px solid #fbbf24;margin-bottom:0;}

.boss-btn{background:linear-gradient(135deg,#7c2d12,#991b1b);color:#fff;box-shadow:0 6px 20px -4px rgba(124,45,18,.55);}
.tower-btn{background:linear-gradient(135deg,#0891b2,#1e40af);color:#fff;box-shadow:0 6px 20px -4px rgba(8,145,178,.55);}

.boss-arena{background:linear-gradient(135deg,#0f172a,#1e1b4b,#581c87);color:#fff;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.3);}
.boss-portrait{font-size:84px;display:inline-block;animation:bossIdle 2.5s ease-in-out infinite;margin-bottom:6px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));}
.boss-portrait.attacking{animation:bossAttack .5s ease;}
.boss-portrait.hurt{animation:bossHurt .45s ease;}

@keyframes bossAttack{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(10deg);filter:drop-shadow(0 0 20px #ef4444);}}
@keyframes bossHurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}50%{transform:translateX(12px);filter:hue-rotate(20deg);}75%{transform:translateX(-6px)}}
.boss-name{font-size:22px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.boss-hp-row{display:flex;align-items:center;gap:8px;margin-top:10px;}

.termle-key.correct{background:#10b981;color:#fff;}
.termle-key.present{background:#f59e0b;color:#fff;}
.termle-key.absent{background:#6b7280;color:#fff;}
.termle-key.wide{padding:14px 10px;font-size:11px;min-width:50px;}

.spin-wheel{position:relative;width:240px;height:240px;margin:18px auto;border-radius:50%;border:6px solid #fff;box-shadow:0 10px 28px rgba(0,0,0,.25);}
.spin-wheel-inner{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#6366f1 0deg 90deg,#dc2626 90deg 180deg,#10b981 180deg 270deg,#d97706 270deg 360deg);transition:transform 2.2s cubic-bezier(.18,.84,.3,1);}
.spin-pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:38px;z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));}
.spin-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.spin-segment{position:absolute;color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.4);}

.ttl-statement{display:flex;align-items:flex-start;gap:12px;background:#fff;border:3px solid var(--line);color:var(--text);padding:14px;border-radius:14px;font-size:15px;font-weight:600;text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;cursor:pointer;line-height:1.4;}

.ttl-statement .letter{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:#f3f4f6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:2px;}
.ttl-statement.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);}
.ttl-statement.correct .letter{background:var(--correct);color:#fff;}
.ttl-statement.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect-tx);}
.ttl-statement.incorrect .letter{background:var(--incorrect);color:#fff;}

  .stamp{font-size:26px;padding:14px 24px;}
}

function buildSocialQuiz(raw) {
  const out = {};
  for (const k in raw) {
    const r = raw[k];
    const n = r.terms.length;
    const questions = r.terms.map((t, i) => {
      const distractors = [];
      for (let off = 1; distractors.length < 3 && off < n; off++) {
        distractors.push(r.terms[(i + off) % n].term);
      }
      return {
        q: 'Which term means: "' + t.def + '"?',
        a: 0,
        opts: [t.term].concat(distractors),
        hint: t.term + " — " + t.def
      };
    });
    out[k] = { title: r.title, emoji: r.emoji, color: r.color, questions: questions };
  }
  return out;
}

function checkTrophiesAfterQuiz(ctx) {
  const earned = loadTrophies(); const newOnes = [];
  tryEarn(earned, newOnes, "first_quiz");
  if (ctx.pct === 100) tryEarn(earned, newOnes, "perfect");
  if (ctx.mode === "exam" && ctx.pct >= 90) tryEarn(earned, newOnes, "sharp_shooter");
  if (ctx.mode === "timed" && ctx.pct >= 80) tryEarn(earned, newOnes, "speed_demon");
  if (ctx.mode === "timed" && ctx.score === ctx.total) tryEarn(earned, newOnes, "lightning");
  if (ctx.mode === "subobj" && ctx.pct === 100) tryEarn(earned, newOnes, "sub_obj_pro");
  if (ctx.mode === "practice" && ctx.hintsUsed === 0) tryEarn(earned, newOnes, "no_hints");
  if (loadPlays() >= 10) tryEarn(earned, newOnes, "bookworm");
  if (loadPlays() >= 25) tryEarn(earned, newOnes, "scholar");
  if (loadCorrectTotal() >= 100) tryEarn(earned, newOnes, "centurion");
  const tried = new Set(loadHistory().map(h => h.mode));
  const allModes = ["practice","exam","timed","quick","trouble","subobj","category"];
  if (allModes.every(m => tried.has(m))) tryEarn(earned, newOnes, "all_modes");
  // Improving trend check
  const hist = loadHistory().slice().sort((a,b)=>a.date-b.date);
  if (hist.length >= 6) {
    const last3 = hist.slice(-3).map(h=>h.pct);
    const prior3 = hist.slice(-6,-3).map(h=>h.pct);
    const lAvg = last3.reduce((s,p)=>s+p,0)/3;
    const pAvg = prior3.reduce((s,p)=>s+p,0)/3;
    if (lAvg - pAvg >= 5) tryEarn(earned, newOnes, "improver");
  }
  saveTrophies(earned);
  return newOnes;
}

function topicAggregates() {
  const hist = loadHistory();
  const agg = {};
  for (const k of KEY_ORDER) agg[k] = { right: 0, total: 0, quizzes: 0 };
  for (const h of hist) {
    if (!h.categoryStats) continue;
    for (const k of KEY_ORDER) {
      const s = h.categoryStats[k];
      if (s && s.total > 0) {
        agg[k].right += s.right;
        agg[k].total += s.total;
        agg[k].quizzes++;
      }
    }
  }
  return agg;
}

function getTroubleTopics() {
  const stats = loadLastStats();
  if (!stats) return [];
  const trouble = [];
  for (const k of KEY_ORDER) {
    if (stats[k] && stats[k].total > 0 && (stats[k].right / stats[k].total) < 0.8) trouble.push(k);
  }
  return trouble;
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function shuffleOptions(q) {
  const idxs = q.opts.map((_, i) => i);
  const order = shuffle(idxs);
  return { ...q, opts: order.map(i => q.opts[i]), a: order.indexOf(q.a) };
}

function gatherQuestions(mode, key) {
  if (mode === "timed") {
    const all = [];
    for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).slice(0, TIMED_QS).map(shuffleOptions);
  }
  if (mode === "subobj") return shuffle(SUBOBJ.questions.map(q => ({ ...q, _cat: "pronouns", _sub: true }))).map(shuffleOptions);
  if (mode === "category") return shuffle(QUIZ[key].questions.map(q => ({ ...q, _cat: key }))).map(shuffleOptions);
  if (mode === "quick") {
    const all = [];
    for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).slice(0, 10).map(shuffleOptions);
  }
  if (mode === "trouble") {
    const trouble = getTroubleTopics();
    const all = [];
    for (const k of trouble) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).map(shuffleOptions);
  }
  const all = [];
  for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
  return shuffle(all).map(shuffleOptions);
}

function startQuiz(mode, key) {
  if (mode === "trouble" && getTroubleTopics().length === 0) {
    alert("No trouble topics yet!\n\nTake a full quiz first. Any topic you score under 80% on will show up here for extra practice.");
    return;
  }
  state.mode = mode;
  state.currentCategory = key || (mode === "subobj" ? "pronouns" : null);
  state.examMode = (mode === "exam");
  state.helpers = !state.examMode && mode !== "timed";
  state.questions = gatherQuestions(mode, key);
  state.index = 0; state.score = 0; state.streak = 0; state.bestStreak = 0;
  state.answered = false; state.selected = -1;
  state.hintShown = false; state.hintsUsed = 0;
  state.startTime = Date.now();
  state.categoryStats = {};
  for (const k of KEY_ORDER) state.categoryStats[k] = { right: 0, total: 0 };
  state.screen = "quiz";
  chimeStart();
  render();
}

function selectOption(i) {
  if (state.answered) return;
  if (state.mode !== "speed") clearTimer();
  const q = state.questions[state.index];
  state.selected = i;
  state.answered = true;
  state.categoryStats[q._cat].total++;
  if (i === q.a) {
    state.score++;
    state.streak++;
    state.categoryStats[q._cat].right++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    chimeCorrect();
    smallConfetti();
    if (state.streak > 0 && state.streak % 5 === 0) {
      setTimeout(() => showLevelUp(state.streak), 650);
      const newT = checkStreakTrophy(state.streak);
      if (newT.length) setTimeout(() => queueToasts(newT), 6800);
    }
  } else {
    state.streak = 0;
    toneWrong();
    const card = document.querySelector(".card.quiz");
    if (card) { card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 420); }
  }
  if (state.mode === "speed") {
    setTimeout(() => {
      if (state.mode !== "speed" || state.speedRemaining <= 0) return;
      state.index = (state.index + 1) % state.questions.length;
      state.answered = false; state.selected = -1;
      render();
    }, 350);
    return;
  }
  render();
}

function revealHint() {
  if (!state.helpers || state.answered) return;
  if (!state.hintShown) state.hintsUsed++;
  state.hintShown = true;
  render();
}

function nextQuestion() {
  clearTimer();
  if (state.index + 1 >= state.questions.length) { finishQuiz(); return; }
  state.index++;
  state.answered = false; state.selected = -1; state.hintShown = false;
  render();
}

function finishQuiz() {
  clearTimer();
  state.elapsedMs = Date.now() - state.startTime;
  bumpPlays();
  addCorrectTotal(state.score);
  const pct = Math.round((state.score / state.questions.length) * 100);
  saveHigh(pct);
  saveBestStreak(state.bestStreak);
  if (state.mode === "daily") {
    const newStreak = updateDailyStreak();
    const earned = loadTrophies(); const dailyNew = [];
    if (newStreak >= 3) tryEarn(earned, dailyNew, "daily_3");
    if (newStreak >= 7) tryEarn(earned, dailyNew, "daily_7");
    if (newStreak >= 30) tryEarn(earned, dailyNew, "daily_30");
    saveTrophies(earned);
    if (dailyNew.length) setTimeout(() => queueToasts(dailyNew), 800);
  }
  saveHistoryEntry({
    date: Date.now(), mode: state.mode,
    score: state.score, total: state.questions.length, pct,
    elapsedMs: state.elapsedMs, hintsUsed: state.hintsUsed,
    categoryStats: state.categoryStats
  });
  if (state.mode === "practice" || state.mode === "exam") saveLastStats(state.categoryStats);
  if (state.mode === "exam") saveBestExam(pct);
  state.screen = "results";
  const newT = checkTrophiesAfterQuiz({
    mode: state.mode, pct, score: state.score, total: state.questions.length, hintsUsed: state.hintsUsed
  });
  render();
  if (newT.length) setTimeout(() => queueToasts(newT), 700);
  if (pct >= 90) { bigConfetti(); chimeAchievement(); }
  else if (pct >= 80) { bigConfetti(); chimeLevelUp(); }
  else if (pct >= 70) miniConfetti();
  historyChanged();
}

function stringHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function lcg(seed) {
  let s = seed || 1;
  return function() { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function seededShuffle(arr, seed) {
  const rng = lcg(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  }
  const seed = stringHash(todayStr() + ":" + subjKey);
  return seededShuffle(all, seed).slice(0, 5).map(shuffleOptions);
}

function makeMatchPairs(subjKey, topicKey, count) {
  count = count || 6;
  if (subjKey === "social" && SOCIAL_RAW[topicKey]) {
    return shuffle(SOCIAL_RAW[topicKey].terms).slice(0, count).map(t => ({ a: t.term, b: t.def }));
  }
  const topic = SUBJECTS[subjKey].topics[topicKey];
  const pairs = topic.questions.map(q => {
    let label = q.q;
    const m = label.match(/["""]([^"""]+)["""]/);
    if (m) label = m[1];
    else label = label.replace(/^(Which|What is|What|How many|How|Who is|Who|Identify).*?(:|\?\??)\s*/i, "").replace(/\?$/, "");
    if (!label) label = q.q.replace(/\?$/, "");
    return { a: q.opts[q.a], b: label.length > 70 ? label.slice(0, 67) + "..." : label };
  });
  return shuffle(pairs).slice(0, count);
}

function startMatch(topicKey) {
  clearTimer();
  state.matchTopic = topicKey;
  const pairs = makeMatchPairs(state.subject, topicKey, 6);
  const cards = [];
  pairs.forEach((p, i) => {
    cards.push({ type:"a", pairId:i, text:p.a });
    cards.push({ type:"b", pairId:i, text:p.b });
  });
  state.matchCards = shuffle(cards);
  state.matchFlipped = [];
  state.matchMatched = new Set();
  state.matchMoves = 0;
  state.matchStart = Date.now();
  state.matchPairs = pairs.length;
  state.screen = "match";
  chimeStart();
  render();
}

function flipMatchCard(idx) {
  if (state.matchFlipped.length >= 2) return;
  if (state.matchFlipped.indexOf(idx) !== -1) return;
  const card = state.matchCards[idx];
  if (state.matchMatched.has(card.pairId)) return;
  state.matchFlipped.push(idx);
  tapTick();
  if (state.matchFlipped.length === 2) {
    render();
    setTimeout(checkMatchResult, 850);
  } else {
    render();
  }
}

function checkMatchResult() {
  const [a, b] = state.matchFlipped;
  const cA = state.matchCards[a]; const cB = state.matchCards[b];
  state.matchMoves++;
  if (cA.pairId === cB.pairId && cA.type !== cB.type) {
    state.matchMatched.add(cA.pairId);
    chimeCorrect();
    smallConfetti();
    if (state.matchMatched.size === state.matchPairs) {
      state.matchFlipped = [];
      setTimeout(finishMatch, 450);
      render();
      return;
    }
  } else {
    toneWrong();
  }
  state.matchFlipped = [];
  render();
}

function checkTermleGuess(guess, word) {
  const result = ["absent","absent","absent","absent","absent"];
  const wordChars = word.split("");
  const used = [false,false,false,false,false];
  for (let i = 0; i < 5; i++) {
    if (guess[i] === wordChars[i]) { result[i] = "correct"; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === "correct") continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === wordChars[j]) {
        result[i] = "present"; used[j] = true; break;
      }
    }
  }
  return result;
}
function getKeyState(letter) {
  let best = null;
  for (let i = 0; i < (state.termleGuesses||[]).length; i++) {
    for (let j = 0; j < 5; j++) {
      if (state.termleGuesses[i][j] === letter) {
        const s = state.termleStatuses[i][j];
        if (s === "correct") return "correct";
        if (s === "present") best = "present";
        else if (!best) best = "absent";
      }
    }
  }
  return best;
}

  if (state.spinSpinning) return;

  const targetIdx = Math.floor(Math.random() * subjects.length);
  const segDeg = 360 / subjects.length;
  // We want the pointer (top) to land in the middle of the target segment.
  // Pointer is at 0deg. After rotation, segment 0 starts at -rotation. We need the rotation to be -(targetIdx * segDeg) - segDeg/2 (mod 360), plus a few full spins.
  const finalDeg = 360 - (targetIdx * segDeg + segDeg / 2);
  const fullSpins = 5;
  const next = Math.floor(state.spinAngle / 360 + fullSpins) * 360 + finalDeg;
  state.spinAngle = next;
  render();
  setTimeout(() => {
    const subj = subjects[targetIdx];

    const topic = topics[Math.floor(Math.random() * topics.length)];

  }, 2300);

let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function tone(freq, dur, type, gain) {
  const ctx = getCtx(); if (!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = type || "sine"; o.frequency.value = freq;
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain || 0.15, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

function smallConfetti() { spawnConfetti(22); }
function spawnConfetti(n) {
  const c = document.getElementById("confetti");
  const colors = ["#6366f1","#ec4899","#f59e0b","#10b981","#06b6d4","#a855f7","#facc15"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.style.left = (Math.random() * 100) + "%";
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (1.5 + Math.random() * 1.8) + "s";
    s.style.animationDelay = (Math.random() * 0.3) + "s";
    s.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
    s.style.width = (6 + Math.random() * 8) + "px";
    s.style.height = (8 + Math.random() * 12) + "px";
    c.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

const PRAISE_CORRECT = ["Awesome! 🎉","Nailed it! ⭐","Brilliant! ✨","You got it! 🔥","Smart move! 🧠","Yes! 💯","On point! 🎯","Boom! 💥","Crushed it! 💪"];
const PRAISE_WRONG  = ["Not quite! 💭","Almost! 🤔","Tricky one! 📝","Remember this one! 💡","Keep going! 💪","So close! 🌟"];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function gradeFor(pct) {
  if (pct >= 95) return { grade:"A+", label:"Perfect!", emoji:"🏆" };
  if (pct >= 90) return { grade:"A",  label:"Excellent!", emoji:"🌟" };
  if (pct >= 80) return { grade:"B",  label:"Great job!", emoji:"🎉" };
  if (pct >= 70) return { grade:"C",  label:"Good effort!", emoji:"👍" };
  if (pct >= 60) return { grade:"D",  label:"Keep practicing!", emoji:"💪" };
  return { grade:"F", label:"Let's study more!", emoji:"📚" };
}
function letter(i) { return ["A","B","C","D","E"][i] || ""; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function fmtTime(ms) { const s = Math.floor(ms/1000); const m = Math.floor(s/60); const r = s%60; return m + "m " + (r<10?"0":"") + r + "s"; }

function clearFocus() { if (confirm("Clear all focus topics?")) { saveFocus(new Set()); settingsChanged(); render(); } }
function clearNote() { if (confirm("Clear the note?")) { saveNote(""); settingsChanged(); render(); } }

function loadSyncToken() { return lsGet("g6_syncToken", ""); }
function loadSyncGist() { return lsGet("g6_syncGist", ""); }
function loadSyncLast() { return parseInt(lsGet("g6_syncLastAt","0"),10); }
function loadSyncStatus() { return lsGet("g6_syncStatus","none"); }
function setSyncStatus(s) { lsSet("g6_syncStatus", s); }
function loadSettingsAt() { return parseInt(lsGet("g6_settingsAt","0"),10); }
function bumpSettingsAt() { lsSet("g6_settingsAt", String(Date.now())); }
function syncEnabled() { return !!loadSyncToken() && !!loadSyncGist(); }

function fmtAgo(ms) {
  const s = Math.floor(ms/1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " hr ago";
  return Math.floor(s/86400) + " day(s) ago";
}

function parseLS(k, fb) { try { const v = lsGet(k, null); return v === null ? fb : JSON.parse(v); } catch(e) { return fb; } }

function collectLocal() {
  return {

    subject: (state && state.subject) || "ela",
    history: loadHistory(), trophies: Array.from(loadTrophies()),
    high: loadHigh(), plays: loadPlays(), streak: loadBestStreak(),

    lastStats_ela: parseLS("g6_lastStats_ela", null),
    lastStats_social: parseLS("g6_lastStats_social", null),
    focus_ela: parseLS("g6_focus_ela", []),
    focus_social: parseLS("g6_focus_social", []),
    note: loadNote(), name: loadName(), avatar: loadAvatar(), pin: loadPin()
  };
}
function applyMerged(m) {
  lsSet("g6_history", JSON.stringify(m.history || []));
  lsSet("g6_trophies", JSON.stringify(m.trophies || []));
  lsSet("g6_high", String(m.high || 0));
  lsSet("g6_plays", String(m.plays || 0));
  lsSet("g6_streak", String(m.streak || 0));
  lsSet("g6_examBest", String(m.examBest || 0));
  lsSet("g6_correctTotal", String(m.correctTotal || 0));
  if (m.lastStats_ela) lsSet("g6_lastStats_ela", JSON.stringify(m.lastStats_ela));
  if (m.lastStats_social) lsSet("g6_lastStats_social", JSON.stringify(m.lastStats_social));
  if (m.focus_ela) lsSet("g6_focus_ela", JSON.stringify(m.focus_ela));
  if (m.focus_social) lsSet("g6_focus_social", JSON.stringify(m.focus_social));
  lsSet("g6_note", m.note || "");
  lsSet("g6_name", m.name || "Julia");
  lsSet("g6_avatar", m.avatar || "🦄");
  lsSet("g6_pin", m.pin || "1234");
  lsSet("g6_settingsAt", String(m.settingsAt || 0));
}
function mergeData(local, remote) {
  if (!remote) return local;
  const hm = new Map();
  for (const h of (local.history || [])) hm.set(h.date, h);
  for (const h of (remote.history || [])) hm.set(h.date, h);
  const history = Array.from(hm.values()).sort((a,b) => a.date - b.date).slice(-50);
  const trophies = Array.from(new Set([...(local.trophies||[]), ...(remote.trophies||[])]));
  const lTime = local.settingsAt || 0;
  const rTime = remote.settingsAt || 0;
  const newer = rTime > lTime ? remote : local;
  // Back-compat: older payloads may have flat lastStats/focus — fold them into ELA
  const fallbackStatsEla = local.lastStats_ela || (local.lastStats && !local.lastStats_social ? local.lastStats : null);
  const fallbackStatsElaR = remote.lastStats_ela || (remote.lastStats && !remote.lastStats_social ? remote.lastStats : null);
  const fallbackFocusEla = local.focus_ela || (Array.isArray(local.focus) ? local.focus : []);
  const fallbackFocusElaR = remote.focus_ela || (Array.isArray(remote.focus) ? remote.focus : []);
  return {
    version: 2,
    settingsAt: Math.max(lTime, rTime),
    history, trophies,
    high: Math.max(local.high||0, remote.high||0),
    plays: Math.max(local.plays||0, remote.plays||0),
    streak: Math.max(local.streak||0, remote.streak||0),
    examBest: Math.max(local.examBest||0, remote.examBest||0),
    correctTotal: Math.max(local.correctTotal||0, remote.correctTotal||0),
    lastStats_ela: (newer === remote ? fallbackStatsElaR : fallbackStatsEla) || fallbackStatsEla || fallbackStatsElaR,
    lastStats_social: newer.lastStats_social || local.lastStats_social || remote.lastStats_social || null,
    focus_ela: (newer === remote ? fallbackFocusElaR : fallbackFocusEla) || [],
    focus_social: newer.focus_social || local.focus_social || remote.focus_social || [],
    note: newer.note || "",
    name: newer.name || "Julia",
    avatar: newer.avatar || "🦄",
    pin: newer.pin || "1234"
  };
}

async function ghGet(path) {
  const token = loadSyncToken();
  const r = await fetch("https://api.github.com" + path, {
    headers: { Authorization: "token " + token, "Accept": "application/vnd.github+json" }
  });
  if (!r.ok) throw new Error(ghErrorMsg(r.status, r.statusText));
  return r.json();
}
async function ghPatch(path, body) {
  const token = loadSyncToken();
  const r = await fetch("https://api.github.com" + path, {
    method: "PATCH",
    headers: { Authorization: "token " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(ghErrorMsg(r.status, r.statusText));
  return r.json();
}
async function ghPost(path, body) {
  const token = loadSyncToken();
  const r = await fetch("https://api.github.com" + path, {
    method: "POST",
    headers: { Authorization: "token " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(ghErrorMsg(r.status, r.statusText));
  return r.json();
}

function ghErrorMsg(status, statusText) {
  const tok = loadSyncToken();
  const looksFineGrained = tok && tok.startsWith("github_pat_");
  if (status === 401) {
    if (looksFineGrained) return "Token rejected (401).\n\nYou used a fine-grained token (github_pat_...) — those don't support gists.\n\nMake a CLASSIC token instead at github.com/settings/tokens → 'Generate new token (classic)' → check only the 'gist' scope.";
    return "Token rejected (401).\n\nThe token is invalid or expired. Generate a new CLASSIC token at github.com/settings/tokens with the 'gist' scope checked.";
  }
  if (status === 403) {
    return "Permission denied (403).\n\nYour token doesn't have the 'gist' scope.\n\nFix: github.com/settings/tokens → click your token → check 'gist' → Update token.";
  }
  if (status === 404) {
    return "Not found (404).\n\nThe gist ID is wrong or the gist was deleted. Double-check the ID from gist.github.com.";
  }
  if (status === 422) return "GitHub rejected the request (422 — validation error). Try disconnecting and setting up sync again.";
  if (status >= 500) return "GitHub is having problems (" + status + "). Try again in a minute.";
  return "Sync failed: " + status + " " + statusText;
}

let syncBusy = false;
let syncIndicatorTimer = null;
function showSyncIndicator(state) {
  if (syncIndicatorTimer) { clearTimeout(syncIndicatorTimer); syncIndicatorTimer = null; }
  const old = document.querySelector(".sync-indicator");
  if (old) old.remove();
  if (!state) return;
  const el = document.createElement("div");
  el.className = "sync-indicator " + (state.type || "");
  el.innerHTML = state.html;
  document.body.appendChild(el);
  if (state.fade) {
    syncIndicatorTimer = setTimeout(() => { el.remove(); }, state.fade);
  }
}

async function syncNow(quiet) {
  if (!syncEnabled() || syncBusy) return;
  syncBusy = true;
  if (!quiet) showSyncIndicator({ type:"", html:"☁️ Syncing…" });
  try {
    const j = await ghGet("/gists/" + loadSyncGist());
    const file = j.files && j.files["progress.json"];
    let remote = null;
    if (file && file.content) { try { remote = JSON.parse(file.content); } catch(e) {} }
    const local = collectLocal();
    const merged = mergeData(local, remote);
    applyMerged(merged);
    await ghPatch("/gists/" + loadSyncGist(), {
      files: { "progress.json": { content: JSON.stringify(merged, null, 2) } }
    });
    lsSet("g6_syncLastAt", String(Date.now()));
    setSyncStatus("ok");
    showSyncIndicator({ type:"ok", html:"✓ Synced", fade: 1800 });
    render();
  } catch (e) {
    setSyncStatus("err:" + (e.message || "unknown"));
    showSyncIndicator({ type:"err", html:"⚠️ Sync failed", fade: 2500 });
    if (!quiet) alert("Sync failed: " + e.message);
  } finally {
    syncBusy = false;
  }
}

async function promptSyncSetup() {
  const intro = "☁️ Cloud Sync Setup\n\n" +
    "This syncs Julia's progress between phones using a private GitHub gist.\n\n" +
    "Step 1: Make a token at github.com/settings/tokens:\n" +
    "  • Tap 'Generate new token (classic)'\n" +
    "  • Name: Study App Sync\n" +
    "  • Expiration: 1 year (or longer)\n" +
    "  • Check ONLY: gist\n" +
    "  • Generate and copy the token (starts with ghp_)\n\n" +
    "Tap OK to continue.";
  if (!confirm(intro)) return;
  const token = (prompt("Paste your CLASSIC GitHub token (starts with ghp_):") || "").trim();
  if (!token) return;
  if (token.startsWith("github_pat_")) {
    alert("⚠️ That's a fine-grained token — it won't work for gists.\n\nMake a CLASSIC token at:\ngithub.com/settings/tokens\n→ 'Generate new token (classic)'\n→ check only the 'gist' scope");
    return;
  }
  if (!token.startsWith("ghp_")) {
    if (!confirm("That token doesn't start with 'ghp_'. It might not be a classic token.\n\nContinue anyway?")) return;
  }
  const useExisting = confirm("First device? Tap OK to create a NEW sync gist automatically.\n\nSecond device? Tap Cancel to enter your existing gist ID.");
  if (useExisting) {
    try {
      showSyncIndicator({ type:"", html:"☁️ Creating gist…" });
      const id = await createSyncGist(token);
      lsSet("g6_syncGist", id);
      await syncNow(true);
      prompt("✅ Sync set up!\n\nCopy this gist ID and use it on Julia's other phone (along with the same token, or a new gist-scoped token):", id);
    } catch (e) {
      alert("❌ Could not create gist: " + e.message + "\n\nCheck the token has 'gist' scope.");
      lsSet("g6_syncToken", "");
    }
  } else {
    const gist = (prompt("Paste your Gist ID (the long alphanumeric in the gist URL):") || "").trim();
    if (!gist) return;
    lsSet("g6_syncToken", token);
    lsSet("g6_syncGist", gist);
    try {
      await syncNow(true);
      alert("✅ Connected! Progress from the other device has been pulled in.");
    } catch (e) {
      alert("❌ Could not connect: " + e.message);
      lsSet("g6_syncToken", "");
      lsSet("g6_syncGist", "");
    }
  }
  render();
}
function disconnectSync() {
  if (!confirm("Disconnect cloud sync?\n\nProgress stays on this device. You can reconnect later.")) return;
  ["g6_syncToken","g6_syncGist","g6_syncLastAt","g6_syncStatus","g6_settingsAt"].forEach(k => localStorage.removeItem(k));
  render();
}

  const pct = Math.round((state.score / total) * 100);
  const g = gradeFor(pct);
  const did = Object.keys(state.categoryStats).filter(k => state.categoryStats[k].total > 0);
  const replayArgs = state.currentCategory && state.mode !== "subobj"
    ? "'category','" + state.currentCategory + "'"
    : "'" + state.mode + "'";
  const examBest = loadBestExam();
  const avatar = loadAvatar(); const name = loadName();
  const stampHTML = state.examMode ? `
    <div style="text-align:center;margin:10px 0 18px;">
      <div class="stamp ${pct >= 70 ? "pass" : "review"}">${pct >= 70 ? "Passed" : "Review"}</div>
    </div>` : "";
  return `
    ${stampHTML}
    <div class="card score-big">
      <span class="avatar-celebrate" style="font-size:60px;">${avatar}</span>
      <div class="grade">${g.grade}</div>
      <div class="label">${g.label} ${esc(name)}!</div>
      <div class="pct">${state.score} / ${total} correct &nbsp;•&nbsp; ${pct}%</div>
      <span class="emoji">${g.emoji}</span>
    </div>
    ${did.length > 1 ? `
      <div class="card">
        <h2>📊 By Topic</h2>
        <div class="breakdown">
          ${did.map(k => {
            const s = state.categoryStats[k]; const p = Math.round((s.right / s.total) * 100);
            return `<div class="row-b">
              <span class="name">${QUIZ[k].emoji} ${esc(QUIZ[k].title)}</span>
              <span class="val">${s.right}/${s.total} (${p}%)</span>
            </div>`;
          }).join("")}
        </div>
      </div>` : ""}
    <div class="card" style="text-align:center;padding:18px;">
      <p class="muted">🔥 Best streak: <b style="color:#ef4444;">${state.bestStreak}</b> &nbsp;·&nbsp; ⏱️ Time: <b>${fmtTime(state.elapsedMs)}</b>${state.helpers ? `&nbsp;·&nbsp; 💡 Hints: <b>${state.hintsUsed}</b>` : ""}</p>
      ${state.examMode ? `<p class="muted" style="margin-top:6px;">Best exam score: <b style="color:var(--primary);">${examBest}%</b></p>` : ""}
    </div>
    <div class="row">
      <button class="btn btn-primary" onclick="startQuiz(${replayArgs})">🔄 Play Again</button>
      <button class="btn btn-ghost" onclick="goHome()">🏠 Home</button>
    </div>
    ${getTroubleTopics().length > 0 && state.mode !== "trouble" ? `<button class="btn btn-warn" onclick="startQuiz('trouble')">🎯 Practice Trouble Topics</button>` : ""}
  `;
}

function modeInfo(m) {
  const map = {
    practice:{ emoji:"🟢", name:"Practice", color:"#6366f1" },
    exam:    { emoji:"🔴", name:"Final Exam", color:"#dc2626" },
    timed:   { emoji:"⏱️", name:"Timed", color:"#0891b2" },
    quick:   { emoji:"⚡", name:"Quick Quiz", color:"#f59e0b" },
    trouble: { emoji:"🎯", name:"Trouble Topics", color:"#fbbf24" },
    category:{ emoji:"📂", name:"Topic Quiz", color:"#60a5fa" },
    subobj:  { emoji:"🎯", name:"S vs O", color:"#fb7185" },
    daily:   { emoji:"🔥", name:"Daily Challenge", color:"#f59e0b" },
    speed:   { emoji:"💨", name:"Speed Round", color:"#0891b2" }
  };
  return map[m] || { emoji:"❓", name:String(m), color:"#9ca3af" };
}

function renderTrendChart(hist) {
  const W = 320, H = 180, PL = 36, PR = 14, PT = 18, PB = 16;
  const innerW = W - PL - PR, innerH = H - PT - PB;
  const n = hist.length;
  if (n === 0) return '<p class="muted">No data yet.</p>';
  const x = i => n === 1 ? PL + innerW/2 : PL + (i/(n-1)) * innerW;
  const y = pct => PT + (1 - pct/100) * innerH;
  const pts = hist.map((h,i) => [x(i), y(h.pct)]);
  const path = pts.map(([px,py],i) => (i===0?"M":"L") + px.toFixed(1) + " " + py.toFixed(1)).join(" ");
  const areaPath = n>1 ? path + " L " + x(n-1).toFixed(1) + " " + (PT+innerH).toFixed(1) + " L " + PL + " " + (PT+innerH).toFixed(1) + " Z" : "";
  const grid = [0,25,50,75,100].map(lvl => {
    const gy = y(lvl);
    return `<line x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}" stroke="#e5e7eb" stroke-width="1" ${(lvl===0||lvl===100)?"":'stroke-dasharray="2 3"'}/>
            <text x="${PL-4}" y="${gy+3}" text-anchor="end" font-size="9" fill="#9ca3af">${lvl}%</text>`;
  }).join("");
  const t80 = y(80);
  const thresh = `<line x1="${PL}" y1="${t80}" x2="${W-PR}" y2="${t80}" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
                  <text x="${W-PR-2}" y="${t80-3}" text-anchor="end" font-size="9" fill="#10b981" font-weight="700">80% goal</text>`;
  const dots = pts.map((p,i) => {
    const mi = modeInfo(hist[i].mode);
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${mi.color}" stroke="white" stroke-width="2"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="trend-chart" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
        <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}${thresh}
    ${n>1 ? `<path d="${areaPath}" fill="url(#areaGrad)"/>` : ""}
    ${n>1 ? `<path d="${path}" stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${dots}
  </svg>`;
}

function historyRow(h) {
  const mi = modeInfo(h.mode);
  const d = new Date(h.date);
  const dateStr = d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const c = h.pct >= 80 ? "high" : h.pct >= 60 ? "mid" : "low";
  return `<div class="hist">
    <span class="hd">${mi.emoji}</span>
    <div class="info">
      <div class="top">${mi.name}</div>
      <div class="sub">${dateStr} · ${h.score}/${h.total} · ${fmtTime(h.elapsedMs)}</div>
    </div>
    <span class="pct ${c}">${h.pct}%</span>
  </div>`;
}

function viewHistory() {
  const hist = loadHistory();
  const name = loadName();
  if (hist.length === 0) {
    return `
      <button class="back-btn" onclick="goHome()">← Back</button>
      <div class="card topic-hero">
        <div class="big-icon" style="background:#dbeafe;">📊</div>
        <h1>No Progress Yet!</h1>
        <p>Take a quiz and your history will appear here.</p>
      </div>
      <button class="btn btn-primary" onclick="goHome()">🏠 Home</button>
    `;
  }
  const sorted = hist.slice().sort((a,b) => a.date - b.date);
  const pcts = sorted.map(h => h.pct);
  const avg = Math.round(pcts.reduce((s,p) => s+p, 0) / pcts.length);
  const best = Math.max.apply(null, pcts);
  const last5 = pcts.slice(-5);
  const prior5 = pcts.slice(-10, -5);
  let trendArrow = "→ Steady", trendClass = "";
  if (last5.length >= 3 && prior5.length >= 3) {
    const lAvg = last5.reduce((s,p)=>s+p,0)/last5.length;
    const pAvg = prior5.reduce((s,p)=>s+p,0)/prior5.length;
    if (lAvg - pAvg > 5) { trendArrow = "↑ Improving"; trendClass = "up"; }
    else if (lAvg - pAvg < -5) { trendArrow = "↓ Slipping"; trendClass = "down"; }
  } else if (sorted.length >= 2) {
    const diff = sorted[sorted.length-1].pct - sorted[sorted.length-2].pct;
    if (diff > 5) { trendArrow = "↑ Up"; trendClass = "up"; }
    else if (diff < -5) { trendArrow = "↓ Down"; trendClass = "down"; }
  }
  const modes = ["practice","exam","timed","quick","trouble","subobj"];
  const legend = modes.map(m => {
    const mi = modeInfo(m);
    return `<span class="mode-pill"><span class="dot" style="background:${mi.color};"></span>${mi.name}</span>`;
  }).join("");
  return `
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="card topic-hero">
      <div class="big-icon" style="background:#dbeafe;">📊</div>
      <h1>${esc(name)}'s Progress</h1>
      <p>${hist.length} quiz${hist.length===1?"":"zes"} taken so far</p>
    </div>
    <div class="card">
      <h2>📈 Score Trend</h2>
      <p class="muted" style="font-size:13px;margin:4px 0 6px;">Each dot is one quiz. Color = mode.</p>
      ${renderTrendChart(sorted)}
      <div class="mode-legend">${legend}</div>
    </div>
    <div class="trend-stats">
      <div class="trend-stat"><div class="l">Average</div><div class="v">${avg}%</div></div>
      <div class="trend-stat"><div class="l">Best Score</div><div class="v">${best}%</div></div>
      <div class="trend-stat ${trendClass}"><div class="l">Recent Trend</div><div class="v">${trendArrow}</div></div>
      <div class="trend-stat"><div class="l">Quizzes Taken</div><div class="v">${hist.length}</div></div>
    </div>
    <div class="card">
      <h2>📋 Recent Quizzes</h2>
      <div class="history-list">
        ${sorted.slice().reverse().slice(0,15).map(historyRow).join("")}
      </div>
    </div>
    <button class="btn btn-ghost btn-small" onclick="clearHistory()">🗑️ Clear History</button>
    <button class="btn btn-primary" onclick="goHome()">🏠 Home</button>
  `;
}

function viewPicker() {
  const name = loadName(); const avatar = loadAvatar();
  const hist = loadHistory();
  return `
    <div class="card hero">
      <button class="settings-icon" onclick="promptAdmin()" title="Parent dashboard" aria-label="Parent dashboard">⚙️</button>
      <button class="avatar-btn" onclick="nextAvatar()" aria-label="Change avatar">
        <span class="avatar">${avatar}</span>
      </button>
      <span class="avatar-tap">tap to change</span>
      <h1>Hi ${esc(name)}! 👋</h1>
      <p>What do you want to study today?</p>
    </div>
    ${SUBJECT_ORDER.map(s => {
      const sub = SUBJECTS[s];
      const subjHist = hist.filter(h => (h.subject || "ela") === s);
      const cnt = subjHist.length;
      const avg = cnt ? Math.round(subjHist.reduce((sum,h)=>sum+h.pct,0)/cnt) : 0;
      const topicCount = sub.keyOrder.length;
      const qCount = sub.keyOrder.reduce((n,k)=>n+sub.topics[k].questions.length,0);
      return `<button class="subject-card" onclick="enterSubject('${s}')">
        <div class="subject-icon" style="background:${sub.color}22;">${sub.emoji}</div>
        <div class="subject-info">
          <div class="subject-title" style="color:${sub.color};">${esc(sub.title)}</div>
          <div class="subject-desc">${esc(sub.description)}</div>
          <div class="subject-stats">${topicCount} topics · ${qCount} questions${cnt ? ` · avg ${avg}%` : ""}</div>
        </div>
        <div class="subject-arrow">›</div>
      </button>`;
    }).join("")}
    <p class="muted" style="text-align:center;padding:8px;">📱 Tip: add this to her home screen via the browser menu → "Install app".</p>
  `;
}
function enterSubject(s) { setSubject(s); state.screen = "home"; chimePop(); render(); }
function goPicker() { clearTimer(); state.screen = "picker"; render(); }

function render() {
  const app = document.getElementById("app");
  let view;
  switch (state.screen) {
    case "picker": view = viewPicker(); break;
    case "topic": view = viewTopic(); break;
    case "subobj-tutorial": view = viewSubObj(); break;
    case "tips": view = viewTips(); break;
    case "flashcards": view = viewFlashcards(); break;
    case "flashcards-done": view = viewFlashcardsDone(); break;
    case "quiz": view = viewQuiz(); break;
    case "results": view = viewResults(); break;
    case "history": view = viewHistory(); break;
    case "trophies": view = viewTrophies(); break;
    case "admin": view = viewAdmin(); break;
    case "match-picker": view = viewMatchPicker(); break;
    case "match": view = viewMatch(); break;
    case "match-done": view = viewMatchDone(); break;
    case "speed-done": view = viewSpeedDone(); break;
    case "boss-picker": view = viewBossPicker(); break;
    case "boss": view = viewBoss(); break;
    case "boss-done": view = viewBossDone(); break;
    case "tower": view = viewTower(); break;
    case "tower-done": view = viewTowerDone(); break;
    case "termle": view = viewTermle(); break;
    case "ttl": view = viewTTL(); break;
    case "spin": view = viewSpin(); break;
    default: view = viewHome();
  }
  app.innerHTML = view;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  if (state.screen === "quiz" && state.mode === "timed" && !state.answered) {
    setTimeout(startTimer, 40);
  }
}
