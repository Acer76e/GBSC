<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Quiz">
<title>Grade 6 Study Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --primary:#6366f1; --primary-2:#8b5cf6; --accent:#ec4899;
  --correct:#10b981; --correct-bg:#d1fae5; --correct-tx:#065f46;
  --incorrect:#ef4444; --incorrect-bg:#fee2e2; --incorrect-tx:#7f1d1d;
  --warn:#f59e0b; --warn-bg:#fef3c7;
  --subj:#3b82f6; --subj-bg:#dbeafe;
  --obj:#fb7185; --obj-bg:#ffe4e6;
  --text:#1f2937; --muted:#6b7280; --card:#ffffff; --line:#e5e7eb;
  --radius:18px; --shadow:0 10px 25px -5px rgb(0 0 0 / .12), 0 8px 10px -6px rgb(0 0 0 / .08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(135deg,#fef3c7,#ddd6fe,#fce7f3);
  background-size:200% 200%;
  animation:shift 25s ease infinite;
  color:var(--text);
  min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#app{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;gap:14px;}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:block;width:100%;padding:18px 20px;border-radius:14px;font-size:17px;font-weight:600;transition:transform .12s ease,background .2s,border-color .2s,box-shadow .2s;text-align:center;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 20px -4px rgba(99,102,241,.6);}
.btn-primary:hover{box-shadow:0 8px 24px -2px rgba(99,102,241,.7);}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--text);border:2px solid transparent;}
.btn-ghost:hover{border-color:var(--primary);}
.btn-small{padding:12px 16px;font-size:15px;}
.btn-warn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;box-shadow:0 6px 20px -4px rgba(239,68,68,.5);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px -4px rgba(16,185,129,.5);}
.btn-exam{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;box-shadow:0 6px 20px -4px rgba(220,38,38,.55);}
.btn-icon{display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-hint{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 10px -2px rgba(251,191,36,.5);}
.btn-hint:disabled{opacity:.55;cursor:default;}
h1{font-size:26px;line-height:1.2;}
h2{font-size:20px;line-height:1.35;}
h3{font-size:15px;line-height:1.3;}
.muted{color:var(--muted);font-size:14px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.hero{text-align:center;padding:24px 10px 10px;position:relative;}
.hero h1{font-size:30px;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.hero p{color:var(--muted);margin-bottom:6px;}
.avatar-btn{background:none;border:none;cursor:pointer;padding:0;margin-bottom:4px;display:inline-block;animation:wiggle 4s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.avatar-btn .avatar{font-size:84px;display:inline-block;transition:transform .2s;filter:drop-shadow(0 6px 12px rgba(99,102,241,.25));}
.avatar-btn:active .avatar{transform:scale(.85) rotate(-12deg);}
.avatar-tap{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;font-weight:700;margin-top:-4px;}
.avatar-mini{display:inline-block;font-size:22px;margin-right:6px;vertical-align:middle;}
.avatar-celebrate{animation:celebrate .9s cubic-bezier(.2,1.4,.4,1);display:inline-block;font-size:30px;}
@keyframes celebrate{0%{transform:scale(0) rotate(-30deg)}50%{transform:scale(1.4) rotate(15deg)}75%{transform:scale(1.1) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.stat{background:rgba(255,255,255,.75);border-radius:14px;padding:12px 6px;text-align:center;}
.stat .num{font-size:22px;font-weight:800;color:var(--primary);}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px;}

.topic-grid{display:grid;gap:10px;}
.topic{display:flex;align-items:center;gap:14px;background:#fff;padding:14px;border-radius:16px;border:2px solid transparent;transition:border-color .2s,transform .12s;cursor:pointer;text-align:left;width:100%;}
.topic:active{transform:scale(.98);}
.topic:hover{border-color:var(--primary);}
.topic .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.topic .info{flex:1;}
.topic .info .ttl{font-weight:700;font-size:16px;}
.topic .info .sub{font-size:13px;color:var(--muted);margin-top:2px;}
.topic .arrow{color:#9ca3af;font-size:22px;}
.topic.weak{border-color:var(--warn);}
.topic.weak .info .sub{color:var(--warn);font-weight:600;}
.topic.feature{background:linear-gradient(135deg,#dbeafe,#ffe4e6);border-color:var(--accent);}
.topic.feature .info .ttl{color:var(--accent);}
.topic .nbadge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;}

.progress{height:10px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease;border-radius:999px;}

.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;}
.badge{display:inline-block;background:rgba(99,102,241,.12);color:var(--primary);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.badge-exam{background:rgba(220,38,38,.15);color:#dc2626;}

.options{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.option{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);color:var(--text);padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;text-align:left;transition:border-color .15s,background .15s,transform .12s,box-shadow .2s;width:100%;position:relative;overflow:hidden;}
.option:not(:disabled):active{transform:scale(.97);}
.option:not(:disabled):hover{border-color:var(--primary);}
.option .letter{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:#f3f4f6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);animation:pulseG .55s ease;}
.option.correct .letter{background:var(--correct);color:#fff;}
.option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect-tx);}
.option.incorrect .letter{background:var(--incorrect);color:#fff;}
.option:disabled{cursor:default;}
@keyframes pulseG{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,.55)}50%{transform:scale(1.03);box-shadow:0 0 0 16px rgba(16,185,129,0)}100%{transform:scale(1)}}

.feedback{margin-top:14px;padding:14px;border-radius:14px;font-weight:600;text-align:center;animation:pop .35s ease;}
.feedback.correct{background:var(--correct-bg);color:var(--correct-tx);}
.feedback.incorrect{background:var(--incorrect-bg);color:var(--incorrect-tx);}
.feedback .hint{display:block;font-size:14px;font-weight:500;margin-top:6px;opacity:.85;line-height:1.45;}

.hint-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.18);border-left:4px solid var(--warn);font-size:14px;line-height:1.45;animation:pop .3s ease;}
.hint-box b{color:var(--warn);}
.hint-box .tag{font-size:11px;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px;}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.shake{animation:shake .4s ease;}

.streak{position:fixed;top:14px;right:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;animation:streakPop .45s ease;box-shadow:0 4px 14px rgba(239,68,68,.5);z-index:50;}
@keyframes streakPop{0%{transform:scale(0) rotate(-12deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1000;}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.score-big{text-align:center;padding:24px 16px 10px;}
.score-big .grade{font-size:88px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradeIn .8s cubic-bezier(.2,1.4,.4,1);}
.score-big .label{font-size:22px;font-weight:700;margin-top:8px;}
.score-big .pct{font-size:16px;color:var(--muted);margin-top:4px;}
.score-big .emoji{font-size:50px;margin-top:8px;display:block;animation:bounce 1.2s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gradeIn{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}

.stamp{display:inline-block;padding:18px 36px;border:5px double;border-radius:14px;font-weight:900;font-size:34px;letter-spacing:3px;text-transform:uppercase;transform:rotate(-8deg);animation:stamp .65s cubic-bezier(.2,1.5,.5,1);}
.stamp.pass{color:#059669;border-color:#059669;background:rgba(16,185,129,.08);}
.stamp.review{color:#dc2626;border-color:#dc2626;background:rgba(220,38,38,.08);}
@keyframes stamp{0%{transform:scale(4) rotate(-30deg);opacity:0}50%{transform:scale(.9) rotate(-12deg);opacity:1}80%{transform:scale(1.05) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}

.breakdown{margin-top:14px;}
.breakdown .row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:15px;}
.breakdown .row-b:last-child{border-bottom:none;}
.breakdown .name{font-weight:600;}
.breakdown .val{font-weight:700;color:var(--primary);}

.qtext{font-size:20px;font-weight:700;line-height:1.35;margin-top:6px;}
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn .35s cubic-bezier(.2,.8,.2,1);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text);align-self:flex-start;border:none;cursor:pointer;}
.back-btn:hover{background:rgba(255,255,255,.9);}

.topic-hero{text-align:center;padding:24px 14px;}
.topic-hero .big-icon{width:80px;height:80px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:44px;animation:popBig .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes popBig{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.topic-hero h1{margin-top:10px;}
.topic-hero p{color:var(--muted);margin-top:6px;}

.tip-list{display:flex;flex-direction:column;gap:10px;}
.tip{background:#fff;border-left:4px solid var(--primary);padding:14px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.tip h3{color:var(--primary);margin-bottom:6px;}
.tip p{font-size:14px;line-height:1.55;}

.flashcard{perspective:1200px;height:340px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;inset:0;border-radius:var(--radius);padding:24px;background:#fff;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,#fef3c7,#fce7f3);}
.flashcard .tap-hint{font-size:12px;color:var(--muted);margin-top:14px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.flashcard .term{font-size:22px;font-weight:700;line-height:1.3;}
.flashcard .answer{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.flashcard .answer-hint{font-size:15px;color:var(--text);opacity:.8;line-height:1.5;}
.fc-actions{display:flex;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600;}

.tut-section{margin-bottom:18px;}
.tut-section:last-child{margin-bottom:0;}
.tut-section h3{font-size:16px;color:var(--primary);margin-bottom:8px;}
.tut-section p{font-size:14px;line-height:1.55;margin-bottom:8px;}
.tut-section code{background:#f3f4f6;padding:2px 8px;border-radius:6px;font-size:13px;font-family:Menlo,Monaco,monospace;}
.contrast-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.contrast-box{padding:14px;border-radius:14px;text-align:center;}
.contrast-box.subj{background:var(--subj-bg);}
.contrast-box.obj{background:var(--obj-bg);}
.contrast-box .big-emoji{font-size:36px;margin-bottom:4px;}
.contrast-box h4{font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.contrast-box.subj h4{color:var(--subj);}
.contrast-box.obj h4{color:var(--obj);}
.contrast-box p{font-size:13px;color:var(--muted);margin-bottom:6px;}
.contrast-box code{display:block;background:rgba(255,255,255,.6);}
.pron-table{width:100%;border-collapse:collapse;}
.pron-table th{background:linear-gradient(90deg,var(--subj-bg),var(--obj-bg));padding:8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
.pron-table th:first-child{color:var(--subj);}
.pron-table th:last-child{color:var(--obj);}
.pron-table td{padding:8px;text-align:center;font-weight:600;border-top:1px solid #f3f4f6;font-size:15px;}
.mistake{margin-bottom:8px;padding:10px 12px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.mistake .wrong{color:var(--incorrect);font-size:14px;text-decoration:line-through;text-decoration-color:rgba(239,68,68,.5);margin-bottom:4px;}
.mistake .right{color:var(--correct-tx);font-size:14px;font-weight:600;}
.trick{padding:10px 12px;margin-bottom:8px;background:rgba(251,191,36,.13);border-left:3px solid var(--warn);border-radius:8px;font-size:14px;line-height:1.55;}
.trick b{color:var(--warn);}

.timer-row{display:flex;align-items:center;gap:12px;}
.timer-info{flex:1;min-width:0;}
.timer-ring{position:relative;width:48px;height:48px;flex-shrink:0;}
.timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block;}
.timer-ring .ring-bg{stroke:rgba(0,0,0,.09);fill:none;}
.timer-ring .ring-pg{transition:stroke-dashoffset .1s linear,stroke .25s;fill:none;}
.timer-ring .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--text);}
.timer-ring.warn .timer-num{animation:tickPulse .9s ease infinite;color:#ef4444;}
@keyframes tickPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.btn-timed{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;box-shadow:0 6px 20px -4px rgba(8,145,178,.55);}

.trend-chart{width:100%;height:auto;display:block;border-radius:10px;background:#fafafa;margin-top:6px;}
.trend-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.trend-stat{background:rgba(99,102,241,.08);padding:11px 12px;border-radius:12px;}
.trend-stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.trend-stat .v{font-size:18px;font-weight:800;color:var(--primary);margin-top:2px;line-height:1.1;}
.trend-stat.up{background:rgba(16,185,129,.12);}
.trend-stat.up .v{color:var(--correct);}
.trend-stat.down{background:rgba(239,68,68,.1);}
.trend-stat.down .v{color:var(--incorrect);}
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.hist{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border-radius:12px;border:1px solid #f3f4f6;font-size:13px;}
.hist .hd{font-size:22px;flex-shrink:0;}
.hist .info{flex:1;min-width:0;}
.hist .info .top{font-weight:700;font-size:14px;}
.hist .info .sub{color:var(--muted);font-size:11px;margin-top:2px;}
.hist .pct{font-weight:800;font-size:18px;flex-shrink:0;}
.hist .pct.high{color:var(--correct);}
.hist .pct.mid{color:var(--warn);}
.hist .pct.low{color:var(--incorrect);}
.mode-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;justify-content:center;}
.mode-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600;}
.mode-pill .dot{width:9px;height:9px;border-radius:50%;}

.celebrate-overlay{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.97),rgba(236,72,153,.97) 50%,rgba(99,102,241,.97));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;}
.celebrate-overlay.show{opacity:1;animation:bgPulse 3s ease-in-out infinite;}
.celebrate-overlay.fade-out{opacity:0;}
@keyframes bgPulse{0%,100%{background:radial-gradient(circle at 30% 40%,rgba(139,92,246,.97),rgba(236,72,153,.97) 50%,rgba(99,102,241,.97))}50%{background:radial-gradient(circle at 70% 60%,rgba(236,72,153,.97),rgba(251,191,36,.97) 50%,rgba(139,92,246,.97))}}
.celebrate-content{text-align:center;color:#fff;padding:30px;position:relative;z-index:2;animation:celeIn .75s cubic-bezier(.2,1.6,.4,1);max-width:90vw;}
@keyframes celeIn{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.12) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.celebrate-emoji{font-size:130px;display:block;animation:emoBounce 1.1s ease infinite;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));}
@keyframes emoBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.1)}}
.celebrate-streak{font-size:16px;font-weight:800;letter-spacing:3px;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,.4);}
.celebrate-title{font-size:54px;font-weight:900;letter-spacing:4px;margin:8px 0 6px;line-height:1;background:linear-gradient(135deg,#fff,#fef3c7,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleGlow 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.8)) drop-shadow(0 4px 14px rgba(0,0,0,.45))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,1)) drop-shadow(0 4px 14px rgba(0,0,0,.45))}}
.celebrate-sub{font-size:17px;margin:8px 0 26px;opacity:.96;text-shadow:0 2px 6px rgba(0,0,0,.35);font-weight:600;}
.celebrate-btn{max-width:260px;margin:0 auto;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:800;letter-spacing:1px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.celebrate-rays{position:absolute;inset:-30%;background:repeating-conic-gradient(rgba(255,255,255,.08) 0deg 14deg,transparent 14deg 28deg);animation:raySpin 20s linear infinite;z-index:1;pointer-events:none;}
@keyframes raySpin{to{transform:rotate(360deg)}}

.trophy-toast{position:fixed;top:14px;left:14px;right:14px;max-width:360px;margin:0 auto;z-index:1500;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 12px 30px rgba(245,158,11,.55);display:flex;align-items:center;gap:14px;transform:translateY(-120px);opacity:0;transition:transform .4s cubic-bezier(.2,1.4,.4,1),opacity .35s;}
.trophy-toast.show{transform:translateY(0);opacity:1;}
.trophy-toast .toast-emoji{font-size:36px;flex-shrink:0;animation:emoBounce 1s ease infinite;}
.trophy-toast .toast-title{font-size:11px;font-weight:800;opacity:.95;text-transform:uppercase;letter-spacing:.6px;}
.trophy-toast .toast-name{font-size:17px;font-weight:900;line-height:1.15;}

.trophy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.trophy{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);border:2px solid transparent;transition:transform .12s,box-shadow .2s;}
.trophy.earned{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b;box-shadow:0 4px 14px rgba(245,158,11,.25);}
.trophy.locked{opacity:.45;filter:grayscale(.85);}
.trophy .emo{font-size:42px;display:block;}
.trophy .nm{font-size:13px;font-weight:800;margin-top:4px;line-height:1.2;}
.trophy .ds{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.trophy.earned .nm{color:#92400e;}
.trophy.earned .ds{color:#78350f;opacity:.85;}
.trophy-progress{background:rgba(245,158,11,.12);border-radius:12px;padding:10px 14px;margin-bottom:6px;text-align:center;font-weight:700;color:#92400e;font-size:14px;}

.settings-icon{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.06);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;transition:background .2s,transform .35s;z-index:5;}
.settings-icon:active{transform:rotate(60deg);}
.settings-icon:hover{background:rgba(0,0,0,.12);}

.music-toggle{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.06);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;transition:background .2s,transform .2s;z-index:5;}
.music-toggle:active{transform:scale(.85);}
.music-toggle:hover{background:rgba(0,0,0,.12);}

.welcome-banner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;cursor:pointer;
  background:linear-gradient(120deg,#009246 0%,#009246 32%,#f1f2f1 33%,#f1f2f1 66%,#ce2b37 67%,#ce2b37 100%);
  padding:0;border-radius:18px;box-shadow:0 8px 26px rgba(0,0,0,.18);overflow:hidden;position:relative;
  animation:wbPop .5s cubic-bezier(.2,1.3,.4,1);}
@keyframes wbPop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.welcome-banner::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.82);}
.welcome-banner > *{position:relative;z-index:1;}
.welcome-banner .wb-flag{font-size:44px;padding:16px 4px 16px 18px;animation:wbWave 2.5s ease-in-out infinite;}
@keyframes wbWave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.welcome-banner .wb-text{flex:1;padding:14px 4px;}
.welcome-banner .wb-title{font-weight:800;font-size:17px;color:#0b3d2e;}
.welcome-banner .wb-sub{font-size:13px;color:#374151;margin-top:3px;line-height:1.35;}
.welcome-banner .wb-arrow{font-size:28px;color:#ce2b37;padding-right:16px;}
.italy-card{border-color:#009246 !important;box-shadow:0 6px 20px rgba(0,146,70,.22);}
.new-tag{display:inline-block;background:#ce2b37;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:4px;letter-spacing:.5px;animation:newPulse 1.4s ease-in-out infinite;}
@keyframes newPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.mom-card{background:linear-gradient(135deg,#fef3c7,#fed7aa);border-radius:18px;padding:16px;border:2px dashed #fbbf24;}
.mom-card h3{color:#92400e;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:800;}
.mom-note{font-size:15px;line-height:1.5;color:#78350f;font-weight:600;font-style:italic;}
.focus-topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.focus-pill{background:#fff;border:2px solid #f59e0b;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#92400e;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:transform .1s;}
.focus-pill:active{transform:scale(.95);}
.topic.focus-topic{border-color:#f59e0b;background:linear-gradient(90deg,rgba(254,243,199,.4),#fff);}
.topic.focus-topic .info .ttl::after{content:" 📌";font-size:14px;}

.topic-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:14px;}
.topic-row:last-child{border-bottom:none;}
.topic-row .nm{font-weight:600;}
.topic-row .pct{font-weight:800;}
.topic-row .pct.bad{color:var(--incorrect);}
.topic-row .pct.mid{color:var(--warn);}
.topic-row .pct.good{color:var(--correct);}
.focus-checks{display:flex;flex-direction:column;gap:8px;}
.focus-check{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#f9fafb;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:border-color .2s,background .2s;}
.focus-check.on{border-color:#f59e0b;background:#fef3c7;}
.focus-check input{width:20px;height:20px;cursor:pointer;flex-shrink:0;accent-color:#f59e0b;}
.focus-check .ic{font-size:24px;}
.focus-check .nm{font-weight:700;flex:1;}
.focus-check .pct-mini{font-size:12px;color:var(--muted);font-weight:600;}
.btn-danger{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;box-shadow:0 6px 20px -4px rgba(220,38,38,.5);}
.btn-warn-outline{background:#fff;border:2px solid var(--warn);color:#92400e;}

.sync-status{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:10px;}
.sync-status.ok{background:rgba(16,185,129,.12);color:#065f46;}
.sync-status.warn{background:rgba(245,158,11,.12);color:#92400e;}
.sync-status.err{background:rgba(239,68,68,.12);color:#7f1d1d;}
.sync-status.busy{background:rgba(99,102,241,.12);color:#3730a3;}
.sync-status .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse-dot 1.2s ease infinite;}
@keyframes pulse-dot{0%,100%{opacity:.4}50%{opacity:1}}
.sync-indicator{position:fixed;bottom:14px;right:14px;background:rgba(99,102,241,.95);color:#fff;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;box-shadow:0 4px 14px rgba(99,102,241,.4);z-index:40;animation:fadeIn .3s;display:flex;align-items:center;gap:6px;}
.sync-indicator.ok{background:rgba(16,185,129,.95);box-shadow:0 4px 14px rgba(16,185,129,.4);}
.sync-indicator.err{background:rgba(239,68,68,.95);box-shadow:0 4px 14px rgba(239,68,68,.4);}

.subject-card{display:flex;align-items:center;gap:16px;background:#fff;padding:18px;border-radius:18px;border:3px solid transparent;transition:transform .12s,border-color .2s,box-shadow .2s;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);}
.subject-card:active{transform:scale(.98);}
.subject-card:hover{border-color:var(--primary);}
.subject-card .subject-icon{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;}
.subject-card .subject-info{flex:1;min-width:0;}
.subject-card .subject-title{font-weight:800;font-size:18px;}
.subject-card .subject-desc{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35;}
.subject-card .subject-stats{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;}
.subject-card .subject-arrow{color:#9ca3af;font-size:26px;flex-shrink:0;}
.subject-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;border:none;margin:0 auto;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .1s,background .2s;}
.subject-pill:active{transform:scale(.95);}
.subject-pill:hover{background:#fff;}
.subject-pill-wrap{display:flex;justify-content:center;}

.games-card{padding:18px;}
.games-card h2{margin-bottom:8px;}
.daily-btn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;box-shadow:0 6px 20px -4px rgba(245,158,11,.5);}
.daily-btn.done{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 6px 20px -4px rgba(16,185,129,.45);}
.daily-streak{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;margin-left:4px;}
.match-btn{background:linear-gradient(135deg,#ec4899,#db2777);color:#fff;box-shadow:0 6px 20px -4px rgba(236,72,153,.5);}
.speed-btn{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;box-shadow:0 6px 20px -4px rgba(8,145,178,.5);}

.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
.match-card{aspect-ratio:1/1.15;perspective:700px;cursor:pointer;}
.match-card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);}
.match-card.flipped .match-card-inner,.match-card.matched .match-card-inner{transform:rotateY(180deg);}
.match-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;line-height:1.2;overflow:hidden;}
.match-front{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:34px;font-weight:800;}
.match-back{background:#fff;border:2px solid var(--line);transform:rotateY(180deg);color:var(--text);font-weight:700;font-size:11px;padding:8px;}
.match-card.matched .match-back{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);}
.match-card.matched{animation:matchPulse .5s ease;}
@keyframes matchPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.match-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.match-stats .ms{background:rgba(255,255,255,.7);border-radius:12px;padding:10px;text-align:center;}
.match-stats .ms .v{font-size:20px;font-weight:800;color:var(--primary);}
.match-stats .ms .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}

.speed-timer{position:fixed;top:8px;left:14px;right:14px;height:8px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.speed-timer-fill{height:100%;background:linear-gradient(90deg,#10b981 0%,#f59e0b 50%,#ef4444 100%);transition:width .1s linear;border-radius:999px;}
.speed-score-chip{position:fixed;top:22px;right:14px;background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;padding:6px 14px;border-radius:999px;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(8,145,178,.45);z-index:40;animation:pop .3s;}

.daily-card{background:linear-gradient(135deg,#fef3c7,#fed7aa);border-radius:18px;padding:14px 16px;border:2px solid #fbbf24;margin-bottom:0;}
.daily-card .row-top{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.daily-card .row-top h3{flex:1;font-size:15px;color:#92400e;font-weight:800;}
.daily-card .row-top .streak-chip{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;}
.daily-card .day-cal{display:flex;gap:4px;justify-content:center;margin:8px 0;}
.daily-card .day-cal .cell{width:18px;height:24px;border-radius:6px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:14px;color:#9ca3af;}
.daily-card .day-cal .cell.lit{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;}
.daily-card .day-cal .cell.today{outline:2px solid #92400e;}

.boss-btn{background:linear-gradient(135deg,#7c2d12,#991b1b);color:#fff;box-shadow:0 6px 20px -4px rgba(124,45,18,.55);}
.tower-btn{background:linear-gradient(135deg,#0891b2,#1e40af);color:#fff;box-shadow:0 6px 20px -4px rgba(8,145,178,.55);}

.boss-arena{background:linear-gradient(135deg,#0f172a,#1e1b4b,#581c87);color:#fff;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.3);}
.boss-portrait{font-size:84px;display:inline-block;animation:bossIdle 2.5s ease-in-out infinite;margin-bottom:6px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));}
.boss-portrait.attacking{animation:bossAttack .5s ease;}
.boss-portrait.hurt{animation:bossHurt .45s ease;}
@keyframes bossIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossAttack{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(10deg);filter:drop-shadow(0 0 20px #ef4444);}}
@keyframes bossHurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}50%{transform:translateX(12px);filter:hue-rotate(20deg);}75%{transform:translateX(-6px)}}
.boss-name{font-size:22px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.boss-hp-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.boss-hp-row .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.85;flex-shrink:0;}
.boss-hp-bar{flex:1;height:14px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#ef4444);transition:width .45s cubic-bezier(.2,1,.2,1);border-radius:999px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.3);}
.boss-hp-num{font-size:12px;font-weight:800;color:#fff;flex-shrink:0;min-width:32px;text-align:right;}
.player-hearts{display:flex;justify-content:center;gap:6px;font-size:22px;margin-top:8px;}

.tower-container{background:linear-gradient(180deg,#0c4a6e 0%,#1e40af 50%,#581c87 100%);border-radius:18px;padding:14px;position:relative;overflow:hidden;height:240px;color:#fff;}
.tower-floor-label{position:absolute;top:14px;left:14px;font-size:14px;font-weight:800;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:999px;}
.tower-lives{position:absolute;top:14px;right:14px;font-size:16px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:999px;}
.tower-track{position:absolute;left:50%;transform:translateX(-50%);top:50px;bottom:14px;width:50px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;}
.tower-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#fbbf24,#f59e0b,#ef4444);transition:height .55s cubic-bezier(.2,1,.2,1);border-radius:999px;}
.tower-avatar{position:absolute;left:50%;transform:translateX(-50%);transition:bottom .55s cubic-bezier(.2,1,.2,1);font-size:34px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));z-index:2;}
.tower-summit{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:18px;opacity:.7;}

.termle-btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px -4px rgba(16,185,129,.5);}
.ttl-btn{background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;box-shadow:0 6px 20px -4px rgba(168,85,247,.5);}
.spin-btn{background:linear-gradient(135deg,#f59e0b,#ec4899,#6366f1);background-size:200% 200%;color:#fff;box-shadow:0 6px 20px -4px rgba(236,72,153,.5);animation:spinBtnShift 4s ease infinite;}
@keyframes spinBtnShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.termle-grid{display:flex;flex-direction:column;gap:5px;align-items:center;margin:14px 0;}
.termle-row{display:grid;grid-template-columns:repeat(5,48px);gap:5px;}
.termle-tile{width:48px;height:48px;background:#fff;border:2px solid #d1d5db;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-transform:uppercase;color:var(--text);}
.termle-tile.filled{border-color:#6b7280;animation:popTile .15s ease;}
.termle-tile.correct{background:#10b981;color:#fff;border-color:#10b981;animation:flipTile .6s ease;}
.termle-tile.present{background:#f59e0b;color:#fff;border-color:#f59e0b;animation:flipTile .6s ease;}
.termle-tile.absent{background:#6b7280;color:#fff;border-color:#6b7280;animation:flipTile .6s ease;}
@keyframes flipTile{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes popTile{0%{transform:scale(.9)}100%{transform:scale(1)}}
.termle-keyboard{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.termle-key-row{display:flex;gap:4px;justify-content:center;}
.termle-key{background:#d1d5db;color:#1f2937;padding:14px 6px;border-radius:6px;font-weight:700;font-size:14px;min-width:28px;border:none;cursor:pointer;text-transform:uppercase;transition:transform .1s,background .2s;}
.termle-key:active{transform:scale(.92);}
.termle-key.correct{background:#10b981;color:#fff;}
.termle-key.present{background:#f59e0b;color:#fff;}
.termle-key.absent{background:#6b7280;color:#fff;}
.termle-key.wide{padding:14px 10px;font-size:11px;min-width:50px;}

.spin-wheel{position:relative;width:240px;height:240px;margin:18px auto;border-radius:50%;border:6px solid #fff;box-shadow:0 10px 28px rgba(0,0,0,.25);}
.spin-wheel-inner{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#6366f1 0deg 90deg,#dc2626 90deg 180deg,#10b981 180deg 270deg,#d97706 270deg 360deg);transition:transform 2.2s cubic-bezier(.18,.84,.3,1);}
.spin-pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:38px;z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));}
.spin-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.spin-segment{position:absolute;color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.4);}

.ttl-statement{display:flex;align-items:flex-start;gap:12px;background:#fff;border:3px solid var(--line);color:var(--text);padding:14px;border-radius:14px;font-size:15px;font-weight:600;text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;cursor:pointer;line-height:1.4;}
.ttl-statement:not(:disabled):hover{border-color:var(--primary);}
.ttl-statement:not(:disabled):active{transform:scale(.98);}
.ttl-statement .letter{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:#f3f4f6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:2px;}
.ttl-statement.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);}
.ttl-statement.correct .letter{background:var(--correct);color:#fff;}
.ttl-statement.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect-tx);}
.ttl-statement.incorrect .letter{background:var(--incorrect);color:#fff;}

@media (max-width:380px){
  .celebrate-emoji{font-size:100px;}
  .celebrate-title{font-size:40px;letter-spacing:2px;}
  .celebrate-sub{font-size:15px;}
  .trophy .emo{font-size:36px;}
  h1{font-size:22px}
  .qtext{font-size:18px}
  .option{font-size:15px;padding:12px 14px}
  .hero .emoji{font-size:60px}
  .hero h1{font-size:26px}
  .flashcard{height:300px}
  .flashcard .term{font-size:18px}
  .flashcard .answer{font-size:24px}

function buildSocialQuiz(raw) {
  const out = {};
  for (const k in raw) {
    const r = raw[k];
    const n = r.terms.length;
    const questions = r.terms.map((t, i) => {
      const distractors = [];
      for (let off = 1; distractors.length < 3 && off < n; off++) {
        distractors.push(r.terms[(i + off) % n].term);
      }
      return {
        q: 'Which term means: "' + t.def + '"?',
        a: 0,
        opts: [t.term].concat(distractors),
        hint: t.term + " — " + t.def
      };
    });
    out[k] = { title: r.title, emoji: r.emoji, color: r.color, questions: questions };
  }

    { h:"Prepositions show relationship", p:"Often position or time: <b>in, on, under, over, above, below, before, after, between, through, with, without</b>. \"The cat sat <b>on</b> the mat.\"" },
    { h:"Same word, different jobs", p:"Some words act as multiple parts of speech! <b>Run</b> can be a noun (a run) or a verb (to run). <b>Fast</b> can be an adjective (fast car) or an adverb (drove fast). Look at HOW it's used in the sentence." }
  ],
  nouns: [
    { h:"Common vs Proper", p:"<b>Common</b> = general name (dog, city, book). <b>Proper</b> = specific name (Rex, Chicago, Legend). Proper nouns are ALWAYS capitalized." },
    { h:"Making plurals", p:"Most nouns: <b>add -s</b> (books). Ending in s/x/z/ch/sh: <b>add -es</b> (boxes, dishes). Ending in consonant + y: <b>change y to i, add -es</b> (baby → babies). <b>Irregular</b> plurals: child → children, mouse → mice, foot → feet." },
    { h:"Possessive rules", p:"<b>Singular</b>: add <b>'s</b> (Julia's book). <b>Plural ending in s</b>: add just <b>'</b> (the dogs' bones). <b>Plural NOT ending in s</b>: add <b>'s</b> (the children's toys)." },
    { h:"Abstract vs Concrete", p:"<b>Concrete</b> = you can sense it (dog, chair, music). <b>Abstract</b> = ideas and feelings (love, freedom, courage, honesty). Both are nouns!" },
    { h:"Collective nouns", p:"One word for a group: <b>team, family, herd, class, band, jury</b>. Sometimes tricky with verb agreement — is a family \"is\" or \"are\"? (Usually \"is\" in American English.)" }
  ],
  verbs: [
    { h:"Action vs Linking", p:"<b>Action verbs</b> show doing (run, jump, think, know). <b>Linking verbs</b> connect the subject to more info — forms of \"to be\" (is, am, are, was, were) plus seem, become, look, feel, appear." },
    { h:"Common irregular past tenses", p:"<b>Run → ran</b> · <b>Eat → ate</b> · <b>Go → went</b> · <b>Come → came</b> · <b>See → saw</b> · <b>Give → gave</b> · <b>Take → took</b> · <b>Write → wrote</b>. You just memorize these!" },
    { h:"Subject-verb agreement", p:"Singular subject → singular verb (usually ends in -s in present tense): <b>She walks</b>. Plural subject → plural verb: <b>They walk</b>. Tricky: <b>Everyone IS</b> (everyone is singular!)." },
    { h:"The 3 simple tenses", p:"<b>Past</b>: I ran (already happened). <b>Present</b>: I run (happening now / general). <b>Future</b>: I will run (going to happen). Add helping verbs for perfect and progressive tenses." },
    { h:"Helping verbs", p:"<b>Have/has/had</b>, <b>will</b>, <b>can/could</b>, <b>may/might</b>, <b>should/would</b>, <b>do/does/did</b>, forms of <b>be</b>. Pair with a main verb: \"She <b>has been</b> studying.\"" }
  ],
  adj_adv: [
    { h:"Adjectives describe NOUNS", p:"They tell what kind, how many, or which one. \"The <b>tall</b> boy,\" \"<b>three</b> books,\" \"<b>that</b> car.\"" },
    { h:"Adverbs modify V/Adj/Adv", p:"Adverbs describe <b>verbs, adjectives, or other adverbs</b>. They answer <b>how, when, where, why</b>, or <b>how much</b>. \"She sang <b>loudly</b>\" · \"<b>Very</b> tall\" · \"She sang <b>quite</b> loudly.\"" },
    { h:"Comparative vs Superlative", p:"<b>Comparative</b> (2 things): add <b>-er</b> or use <b>more</b> (bigger, more careful). <b>Superlative</b> (3+ things): add <b>-est</b> or use <b>most</b> (biggest, most careful)." },
    { h:"Irregular comparisons", p:"<b>Good → better → best</b> · <b>Bad → worse → worst</b> · <b>Far → farther → farthest</b> · <b>Little → less → least</b> · <b>Much/many → more → most</b>. Memorize these!" },
    { h:"Common mistake", p:"❌ \"He ran quick.\" — needs an adverb. ✅ \"He ran <b>quickly</b>.\" But: \"He is quick\" ✅ (linking verb + adjective is fine)." }
  ],
  punctuation: [
    { h:"End marks 🛑", p:"<b>Period (.)</b> ends a statement. <b>Question mark (?)</b> ends a question. <b>Exclamation point (!)</b> ends an exclamation. Every sentence gets exactly ONE." },
    { h:"Comma uses", p:"<b>Separate list items</b>: apples, bananas, and grapes. <b>After intro word/phrase</b>: Yes, I will. Well, that's odd. <b>Between adjectives</b>: a bright, sunny day. <b>Before FANBOYS</b> in compound sentence: I ran, and she walked." },
    { h:"Semicolon vs Colon", p:"<b>Semicolon (;)</b> joins two closely related complete sentences: \"I was tired; I went to bed.\" <b>Colon (:)</b> introduces a list or quote: \"I need three things: bread, milk, eggs.\"" },
    { h:"Apostrophes 📝", p:"<b>Contractions</b>: don't (do not), can't (cannot), it's (it is). <b>Possession</b>: Julia's book, the dogs' bones. <b>NEVER</b> use apostrophes for regular plurals (\"apple's\" is WRONG for more than one apple)." },
    { h:"Quotation marks", p:"Around <b>direct quotes</b>: She said, \"Hello.\" Punctuation goes <b>INSIDE</b> the quotation marks in American English: \"Come here,\" he said." }

  capitalization: [
    { h:"Always capitalize", p:"1. <b>First word of every sentence</b><br>2. The pronoun <b>I</b> (always!)<br>3. <b>Proper nouns</b> (names of specific people, places, things)<br>4. <b>Days of the week</b> (Monday, Tuesday…)<br>5. <b>Months</b> (January…)<br>6. <b>Holidays</b> (Thanksgiving)" },
    { h:"Don't capitalize", p:"<b>Seasons</b> (summer, winter) — surprisingly! <b>Common nouns</b> (dog, book, city). <b>Compass directions</b> as directions (\"drive south\") — but DO capitalize when a region (\"the South\")." },
    { h:"Titles and names", p:"Capitalize titles used <b>with</b> a name: <b>Doctor Smith</b>, <b>President Lincoln</b>. Don't when used alone: \"the doctor said…\" Capitalize <b>Mom/Dad</b> when used as a name: \"Where's Mom?\" but \"My mom is here.\"" },
    { h:"Titles of works", p:"Capitalize the <b>first, last, and all major words</b> in titles (books, movies, songs). Don't capitalize small words like <b>a, an, the, and, but, or, of, in</b> unless they're first or last. \"<b>The Boy Who Walks in the Light</b>.\"" }
  ],
  sentences: [
    { h:"Subject + Predicate", p:"Every complete sentence has both. <b>Subject</b> = who/what the sentence is about. <b>Predicate</b> = what the subject does or is. Missing either? It's a fragment." },
    { h:"Simple, Compound, Complex", p:"<b>Simple</b> = 1 complete thought (\"The dog ran.\"). <b>Compound</b> = 2 complete thoughts joined by FANBOYS (\"The dog ran, and the cat slept.\"). <b>Complex</b> = 1 complete + 1 dependent (\"When the dog ran, the cat woke up.\")." },
    { h:"FANBOYS", p:"The 7 coordinating conjunctions: <b>F</b>or, <b>A</b>nd, <b>N</b>or, <b>B</b>ut, <b>O</b>r, <b>Y</b>et, <b>S</b>o. Use one (with a comma before it) to join two independent clauses." },
    { h:"Fragment vs Run-on", p:"<b>Fragment</b> = incomplete thought (\"Running through the park.\"). Fix by adding subject or verb. <b>Run-on</b> = too many joined without proper punctuation (\"I ran to school I was late.\"). Fix with a period, semicolon, or FANBOYS conjunction." },
    { h:"Independent vs Dependent", p:"<b>Independent</b> clause: complete thought, stands alone. <b>Dependent</b> clause: starts with a subordinating conjunction (because, when, if, although, since), can't stand alone." }
  ],
  confused: [
    { h:"It's vs Its", p:"<b>It's</b> = <b>it is</b> or <b>it has</b> (ALWAYS with apostrophe as a contraction). <b>Its</b> = possessive (like his/hers, NO apostrophe). Trick: if you can substitute \"it is,\" use <b>it's</b>." },
    { h:"There / Their / They're", p:"<b>There</b> = a place (over there). Contains \"HERE.\" <b>Their</b> = possessive (their house). \"HEIR\" hidden inside — an heir owns. <b>They're</b> = they are (contraction)." },
    { h:"Your vs You're", p:"<b>Your</b> = possessive (your book). <b>You're</b> = you are. Trick: can you swap in \"you are\"? Then use <b>you're</b>." },
    { h:"Affect vs Effect", p:"<b>Affect</b> = usually a VERB (to influence). Trick: <b>A</b>ffect is an <b>A</b>ction. <b>Effect</b> = usually a NOUN (the result). Trick: an <b>E</b>ffect is the <b>E</b>nd result." },
    { h:"Then vs Than", p:"<b>Then</b> = TIME (first this, then that). <b>Than</b> = comparison (bigger than). Trick: comp<b>a</b>rison = th<b>a</b>n." },
    { h:"Fewer vs Less", p:"<b>Fewer</b> = countable (fewer apples, fewer people). <b>Less</b> = uncountable / measured (less water, less time, less money)." }
  ]
};

      { q: "In the full list from atoms up to organisms, which level comes between ATOMS and CELLS?", a: 0, opts: ["Molecules","Tissues","Organs","Organ systems"], hint: "Atoms → molecules → cells → tissues → organs → organ systems → organisms. Atoms join to make molecules." },
      { q: "An amoeba is a one-celled organism. Which levels of organization does it NOT have?", a: 0, opts: ["Tissues, organs, and organ systems","Cells","Molecules and atoms","A cell membrane"], hint: "A unicellular organism is just one cell. It needs many cells to have tissues and organs." },
      { q: "Which scientist concluded that all PLANTS are made of cells?", a: 0, opts: ["Matthias Schleiden","Theodor Schwann","Rudolf Virchow","Robert Hooke"], hint: "Schleiden studied plants (1838). Schwann did the same for animals a year later." },
      { q: "Which scientist concluded that all ANIMALS are made of cells?", a: 0, opts: ["Theodor Schwann","Matthias Schleiden","Rudolf Virchow","Anton van Leeuwenhoek"], hint: "Schwann studied animals (1839). Memory trick: a swan is an animal, Schwann = animals." },
      { q: "Which scientist said that all cells come from pre-existing cells?", a: 0, opts: ["Rudolf Virchow","Robert Hooke","Matthias Schleiden","Theodor Schwann"], hint: "Virchow (1855) completed the cell theory: cells only come from other cells, not from nonliving things." },
      { q: "Why couldn't anyone discover cells before the 1600s?", a: 0, opts: ["Microscopes had not been invented yet","Cells did not exist before then","Scientists were not allowed to study life","Cells were too big to notice"], hint: "Most cells are too small to see with your eyes alone. Better tools led to new discoveries." },
      { q: "Which shows the correct ORDER of discoveries that built the cell theory?", a: 0, opts: ["Hooke, then Schleiden and Schwann, then Virchow","Virchow, then Hooke, then Schleiden and Schwann","Schleiden and Schwann, then Virchow, then Hooke","Hooke, then Virchow, then Schleiden and Schwann"], hint: "Hooke named cells (1665). Schleiden and Schwann (1838 to 1839) said plants and animals are made of cells. Virchow (1855) said cells come from cells." }

      { q: "On a hot July day in Florida, you start to sweat. How does sweating help homeostasis?", a: 0, opts: ["Sweat evaporates and cools your body down","Sweat adds extra water to your blood","Sweat warms up your skin","Sweat makes your heart beat slower"], hint: "When sweat evaporates, it carries heat away from your skin, keeping your body near 37°C (98.6°F)." },
      { q: "When you are very cold, you start to shiver. Why?", a: 0, opts: ["Your muscles move quickly to make heat","Your body is letting heat escape","Your skin is soaking up heat from the air","Your blood stops moving to save energy"], hint: "Shivering is fast muscle movement. Moving muscles release heat that warms you up." },
      { q: "Someone sprays air freshener in one corner of a room. Soon you can smell it across the room. Which process is this?", a: 0, opts: ["Diffusion","Osmosis","Active transport","Photosynthesis"], hint: "Particles spread from where they are crowded to where they are less crowded. That's diffusion, and it needs no energy." },
      { q: "A dried raisin is placed in a glass of fresh water overnight. In the morning it is plump and swollen. Why?", a: 0, opts: ["Water moved into the raisin by osmosis","Sugar moved into the raisin from the water","The raisin used energy to pump water in","Air bubbles got trapped inside the raisin"], hint: "Osmosis is the diffusion of WATER across a membrane. Water moved toward the side with less water (inside the raisin)." },
      { q: "Root cells take in minerals that are already MORE concentrated inside the root than in the soil. How do they do it?", a: 0, opts: ["Active transport, which uses the cell's energy","Diffusion, which uses no energy","Osmosis, which moves only water","Passive transport, which uses no energy"], hint: "Moving materials from low to high concentration is 'uphill', so the cell must spend energy." },
      { q: "Which life process do ALL cells carry out to stay alive?", a: 0, opts: ["Getting energy and removing wastes","Making food from sunlight","Building a stiff cell wall","Swimming with a flagellum"], hint: "All cells need energy and must get rid of wastes. Trap: only some cells (like plant cells) do photosynthesis." },
      { q: "After running a lap, you breathe faster and your heart beats faster. Why?", a: 0, opts: ["To bring more oxygen to cells and remove carbon dioxide","To cool down your lungs","To make your blood thicker","To help your muscles use less energy"], hint: "Working muscles need more oxygen to release energy from food. Your body speeds up to keep things balanced." },
      { q: "You feel very thirsty after playing outside all afternoon. What is thirst?", a: 0, opts: ["Your body's signal to replace lost water","A sign that your cells have too much water","A result of eating too much sugar","A signal that you need more oxygen"], hint: "Thirst is a homeostasis signal. You lost water by sweating, so your body tells you to drink." },

      { q: "Which list shows the SIX kingdoms?", a: 0, opts: ["Archaebacteria, Eubacteria, Protists, Fungi, Plants, Animals","Viruses, Bacteria, Protists, Fungi, Plants, Animals","Bacteria, Archaea, Eukarya, Plants, Animals, Fungi","Protists, Fungi, Plants, Animals, Insects, Viruses"], hint: "Viruses are NOT in any kingdom because they are not cells. Insects are part of the animal kingdom." },

      { q: "The scientific name for humans is Homo sapiens. What does the FIRST word, Homo, tell you?", a: 0, opts: ["The genus","The species","The kingdom","The family"], hint: "Binomial = two names: Genus + species. The genus is always written first and capitalized." },
      { q: "Which shows the American alligator's scientific name written correctly?", a: 0, opts: ["Alligator mississippiensis","alligator Mississippiensis","Alligator Mississippiensis","alligator mississippiensis"], hint: "Capitalize the genus, lowercase the species, and write it in italics (or underline it by hand)." },

      { q: "Use this key. 1a: Has fur, go to 2. 1b: No fur, go to 3. 2a: Long flat tail = beaver. 2b: Ringed tail = raccoon. 3a: Has a shell = gopher tortoise. 3b: No shell = green anole. An animal has NO fur and NO shell. What is it?", a: 0, opts: ["Green anole","Gopher tortoise","Raccoon","Beaver"], hint: "A dichotomous key gives two choices at each step. No fur → step 3. No shell → green anole." },
