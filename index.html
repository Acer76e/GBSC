<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Quiz">
<title>Grade 6 Study Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --primary:#6366f1; --primary-2:#8b5cf6; --accent:#ec4899;
  --correct:#10b981; --correct-bg:#d1fae5; --correct-tx:#065f46;
  --incorrect:#ef4444; --incorrect-bg:#fee2e2; --incorrect-tx:#7f1d1d;
  --warn:#f59e0b; --warn-bg:#fef3c7;
  --text:#1f2937; --muted:#6b7280; --card:#ffffff; --line:#e5e7eb;
  --radius:18px; --shadow:0 10px 25px -5px rgb(0 0 0 / .12), 0 8px 10px -6px rgb(0 0 0 / .08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(135deg,#fef3c7,#ddd6fe,#fce7f3);
  background-size:200% 200%;
  animation:shift 25s ease infinite;
  color:var(--text);
  min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#app{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;gap:14px;}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:block;width:100%;padding:18px 20px;border-radius:14px;font-size:17px;font-weight:600;transition:transform .1s ease,background .2s,border-color .2s,box-shadow .2s;text-align:center;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 20px -4px rgba(99,102,241,.6);}
.btn-primary:hover{box-shadow:0 8px 24px -2px rgba(99,102,241,.7);}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--text);border:2px solid transparent;}
.btn-ghost:hover{border-color:var(--primary);}
.btn-small{padding:12px 16px;font-size:15px;}
.btn-warn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;box-shadow:0 6px 20px -4px rgba(239,68,68,.5);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px -4px rgba(16,185,129,.5);}
.btn-icon{display:flex;align-items:center;justify-content:center;gap:10px;}
h1{font-size:26px;line-height:1.2;}
h2{font-size:20px;line-height:1.35;}
h3{font-size:15px;line-height:1.3;}
.muted{color:var(--muted);font-size:14px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.hero{text-align:center;padding:30px 10px 10px;}
.hero .emoji{font-size:70px;margin-bottom:8px;display:block;}
.hero h1{font-size:30px;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.hero p{color:var(--muted);margin-bottom:6px;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.stat{background:rgba(255,255,255,.75);border-radius:14px;padding:12px 6px;text-align:center;}
.stat .num{font-size:22px;font-weight:800;color:var(--primary);}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px;}

.topic-grid{display:grid;gap:10px;}
.topic{display:flex;align-items:center;gap:14px;background:#fff;padding:14px;border-radius:16px;border:2px solid transparent;transition:border-color .2s,transform .1s;cursor:pointer;text-align:left;width:100%;}
.topic:active{transform:scale(.98);}
.topic:hover{border-color:var(--primary);}
.topic .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.topic .info{flex:1;}
.topic .info .ttl{font-weight:700;font-size:16px;}
.topic .info .sub{font-size:13px;color:var(--muted);margin-top:2px;}
.topic .arrow{color:#9ca3af;font-size:22px;}
.topic.weak{border-color:var(--warn);}
.topic.weak .info .sub{color:var(--warn);font-weight:600;}

.progress{height:10px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s ease;border-radius:999px;}

.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;}
.badge{display:inline-block;background:rgba(99,102,241,.12);color:var(--primary);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

.options{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.option{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);color:var(--text);padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;text-align:left;transition:border-color .15s,background .15s,transform .1s;width:100%;}
.option:not(:disabled):active{transform:scale(.98);}
.option:not(:disabled):hover{border-color:var(--primary);}
.option .letter{flex-shrink:0;width:34px;height:34px;border-radius:10px;background:#f3f4f6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct-tx);}
.option.correct .letter{background:var(--correct);color:#fff;}
.option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect-tx);}
.option.incorrect .letter{background:var(--incorrect);color:#fff;}
.option:disabled{cursor:default;}

.feedback{margin-top:14px;padding:14px;border-radius:14px;font-weight:600;text-align:center;animation:pop .3s ease;}
.feedback.correct{background:var(--correct-bg);color:var(--correct-tx);}
.feedback.incorrect{background:var(--incorrect-bg);color:var(--incorrect-tx);}
.feedback .hint{display:block;font-size:14px;font-weight:500;margin-top:6px;opacity:.85;}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s ease;}

.streak{position:fixed;top:14px;right:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;animation:pop .3s;box-shadow:0 4px 14px rgba(239,68,68,.5);z-index:50;}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1000;}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.score-big{text-align:center;padding:24px 16px 10px;}
.score-big .grade{font-size:88px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.score-big .label{font-size:22px;font-weight:700;margin-top:8px;}
.score-big .pct{font-size:16px;color:var(--muted);margin-top:4px;}
.score-big .emoji{font-size:50px;margin-top:8px;display:block;animation:bounce 1.2s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.breakdown{margin-top:14px;}
.breakdown .row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:15px;}
.breakdown .row-b:last-child{border-bottom:none;}
.breakdown .name{font-weight:600;}
.breakdown .val{font-weight:700;color:var(--primary);}

.qtext{font-size:20px;font-weight:700;line-height:1.35;margin-top:6px;}
.fade-in{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text);align-self:flex-start;border:none;cursor:pointer;}
.back-btn:hover{background:rgba(255,255,255,.9);}

/* Topic detail */
.topic-hero{text-align:center;padding:24px 14px;}
.topic-hero .big-icon{width:80px;height:80px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:44px;}
.topic-hero h1{margin-top:10px;}
.topic-hero p{color:var(--muted);margin-top:6px;}

/* Tips */
.tip-list{display:flex;flex-direction:column;gap:10px;}
.tip{background:#fff;border-left:4px solid var(--primary);padding:14px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.tip h3{color:var(--primary);margin-bottom:6px;}
.tip p{font-size:14px;line-height:1.55;}

/* Flashcards */
.flashcard{perspective:1200px;height:340px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-face{position:absolute;inset:0;border-radius:var(--radius);padding:24px;background:#fff;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,#fef3c7,#fce7f3);}
.flashcard .tap-hint{font-size:12px;color:var(--muted);margin-top:14px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.flashcard .term{font-size:22px;font-weight:700;line-height:1.3;}
.flashcard .answer{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.flashcard .answer-hint{font-size:15px;color:var(--text);opacity:.8;line-height:1.5;}
.fc-actions{display:flex;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600;}

@media (max-width:380px){
  h1{font-size:22px}
  .qtext{font-size:18px}
  .option{font-size:15px;padding:12px 14px}
  .hero .emoji{font-size:60px}
  .hero h1{font-size:26px}
  .flashcard{height:300px}
  .flashcard .term{font-size:18px}
  .flashcard .answer{font-size:24px}
}
</style>
</head>
<body>

  },
  pronouns: {

    emoji: "🔤",

      { q:"What kind of pronoun is \"Them\"?", a:1, opts:["Subject","Object","Possessive","Intensive"], hint:"It receives the action: \"I saw ___.\"" },
      { q:"What kind of pronoun is \"Ourselves\"?", a:3, opts:["Subject","Object","Possessive","Intensive"], hint:"Used for emphasis: \"We ___ built it.\"" },

      { q:"What kind of pronoun is \"Myself\"?", a:3, opts:["Subject","Object","Possessive","Intensive"], hint:"\"I ___ saw it happen.\" (emphasis)" },

    { h:"The Body-Move trick 💪", p:"<b>Subject</b> → point forward (I DO!). <b>Object</b> → cup hands like catching. <b>Possessive</b> → closed fist (MINE!). <b>Intensive</b> → thumb to chest (myself!)." },
    { h:"Intensive secret test ⭐", p:"Remove the -self word. If the sentence still makes sense, it's INTENSIVE.<br>\"I myself baked the cake\" → \"I baked the cake\" ✓ = Intensive." },
    { h:"Subject vs Object", p:"Subject DOES the action: \"<b>SHE</b> runs.\" Object RECEIVES it: \"I helped <b>HER</b>.\" Whisper it — your ear knows which sounds right." },
    { h:"Possessive = ownership", p:"Mine, yours, hers, his, ours, theirs — they answer \"<b>whose?</b>\" \"The blue bag is <b>hers</b>.\"" },
    { h:"-self/-selves words", p:"<b>Always</b> intensive (or reflexive): myself, yourself, herself, himself, itself, ourselves, yourselves, themselves." }
  ],
  story: [
    { h:"Draw the Mountain ⛰️", p:"Left-to-right: <b>Exposition</b> (foot) → <b>Rising Action</b> (climb) → <b>Climax</b> (peak) → <b>Falling Action</b> (descent) → <b>Resolution</b> (home)." },
    { h:"Use a movie you love", p:"Pick a favorite movie. Where's the climax? The exposition is the slow intro setup. Once you spot it in movies, you've got it." },
    { h:"Climb / Peak / Fall", p:"Rising goes UP, Climax is the TOP, Falling goes DOWN, Resolution is THE END. Easy as a hike." }
  ],
  writing: [
    { h:"TAG = Teachers Always Grade", p:"<b>T</b>itle, <b>A</b>uthor, <b>G</b>enre — what you introduce at the start of an essay. Picture a luggage tag with 3 lines." },
    { h:"Body paragraph = Tell, Show, Prove", p:"<b>Tell</b> (topic sentence intro) → <b>Show</b> (evidence) → <b>Prove</b> (justification/explanation)." },
    { h:"Transitions: flip vs forward", p:"🔀 <b>Contrast</b> (flip the direction): However, On the other hand, Conversely, In contrast.<br>➡️ <b>Sequence</b> (move forward): First, Initially, Next, Then, Finally." },
    { h:"CRAAP test for sources", p:"<b>C</b>urrent · <b>R</b>eliable · <b>A</b>uthority · <b>A</b>ccurate · <b>P</b>urpose. Yes — that's really what it's called!" }
  ]
};

const KEY_ORDER = ["vocab","literary","pronouns","story","writing"];

const state = {
  screen: "home",
  questions: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  answered: false,
  selected: -1,
  categoryStats: {},
  currentCategory: null,
  mode: "full",
  fcPile: [],
  fcCurrent: null,
  fcFlipped: false,
  fcDone: 0,
  fcTotal: 0
};

function lsGet(k, fallback) {
  try { const v = localStorage.getItem(k); return v == null ? fallback : v; } catch(e) { return fallback; }
}
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function loadHigh() { return parseInt(lsGet("g6_high","0"),10); }
function saveHigh(v) { if (v > loadHigh()) lsSet("g6_high", String(v)); }
function loadPlays() { return parseInt(lsGet("g6_plays","0"),10); }
function bumpPlays() { lsSet("g6_plays", String(loadPlays()+1)); }
function loadBestStreak() { return parseInt(lsGet("g6_streak","0"),10); }
function saveBestStreak(v) { if (v > loadBestStreak()) lsSet("g6_streak", String(v)); }
function saveLastStats(s) { lsSet("g6_lastStats", JSON.stringify(s)); }
function loadLastStats() {
  try { return JSON.parse(lsGet("g6_lastStats","null")); } catch(e) { return null; }
}

function getTroubleTopics() {
  const stats = loadLastStats();
  if (!stats) return [];
  const trouble = [];
  for (const k of KEY_ORDER) {
    if (stats[k] && stats[k].total > 0 && (stats[k].right / stats[k].total) < 0.8) {
      trouble.push(k);
    }
  }
  return trouble;
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleOptions(q) {
  const idxs = q.opts.map((_, i) => i);
  const order = shuffle(idxs);
  return {
    ...q,
    opts: order.map(i => q.opts[i]),
    a: order.indexOf(q.a)
  };
}

function gatherQuestions(mode, key) {
  if (mode === "category") {
    return shuffle(QUIZ[key].questions.map(q => ({ ...q, _cat: key }))).map(shuffleOptions);
  }
  if (mode === "quick") {
    const all = [];
    for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).slice(0, 10).map(shuffleOptions);
  }
  if (mode === "trouble") {
    const trouble = getTroubleTopics();
    const all = [];
    for (const k of trouble) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).map(shuffleOptions);
  }
  const all = [];
  for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
  return shuffle(all).map(shuffleOptions);
}

function startQuiz(mode, key) {
  if (mode === "trouble") {
    const t = getTroubleTopics();
    if (t.length === 0) {
      alert("No trouble topics yet!\n\nTake a full quiz first. Any topic you score under 80% on will show up here for extra practice.");
      return;
    }
  }
  state.mode = mode;
  state.currentCategory = key || null;
  state.questions = gatherQuestions(mode, key);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.answered = false;
  state.selected = -1;
  state.categoryStats = {};
  for (const k of KEY_ORDER) state.categoryStats[k] = { right: 0, total: 0 };
  state.screen = "quiz";
  render();
}

function selectOption(i) {
  if (state.answered) return;
  const q = state.questions[state.index];
  state.selected = i;
  state.answered = true;
  state.categoryStats[q._cat].total++;
  if (i === q.a) {
    state.score++;
    state.streak++;
    state.categoryStats[q._cat].right++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    beep(true);
    if (state.streak === 5 || state.streak === 10) miniConfetti();
  } else {
    state.streak = 0;
    beep(false);
    const card = document.querySelector(".card.quiz");
    if (card) { card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400); }
  }
  render();
}

function nextQuestion() {
  if (state.index + 1 >= state.questions.length) { finishQuiz(); return; }
  state.index++;
  state.answered = false;
  state.selected = -1;
  render();
}

function finishQuiz() {
  bumpPlays();
  const pct = Math.round((state.score / state.questions.length) * 100);
  saveHigh(pct);
  saveBestStreak(state.bestStreak);
  if (state.mode === "full") saveLastStats(state.categoryStats);
  state.screen = "results";
  render();
  if (pct >= 80) bigConfetti();
}

function goHome() { state.screen = "home"; state.currentCategory = null; render(); }
function showTopic(k) { state.currentCategory = k; state.screen = "topic"; render(); }
function showTips(k) { state.currentCategory = k; state.screen = "tips"; render(); }

function startFlashcards(k) {
  state.currentCategory = k;
  const cards = shuffle(QUIZ[k].questions.slice());
  state.fcPile = cards;
  state.fcCurrent = state.fcPile.shift() || null;
  state.fcFlipped = false;
  state.fcDone = 0;
  state.fcTotal = QUIZ[k].questions.length;
  state.screen = "flashcards";
  render();
}

function flipCard() { state.fcFlipped = !state.fcFlipped; render(); }

function fcAction(gotIt) {
  if (!state.fcCurrent) return;
  if (!gotIt) {
    state.fcPile.push(state.fcCurrent);
  } else {
    state.fcDone++;
  }
  if (state.fcPile.length === 0) {
    state.fcCurrent = null;
    state.screen = "flashcards-done";
    miniConfetti();
  } else {
    state.fcCurrent = state.fcPile.shift();
    state.fcFlipped = false;
  }
  render();
}

let audioCtx = null;
function beep(ok) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = "sine";
    if (ok) {
      o.frequency.setValueAtTime(660, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
    } else {
      o.frequency.setValueAtTime(220, audioCtx.currentTime);
    }
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    o.start();
    o.stop(audioCtx.currentTime + 0.25);
  } catch(e) {}
}

function bigConfetti() { spawnConfetti(120); }
function miniConfetti() { spawnConfetti(40); }
function spawnConfetti(n) {
  const c = document.getElementById("confetti");
  const colors = ["#6366f1","#ec4899","#f59e0b","#10b981","#06b6d4","#a855f7"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.style.left = (Math.random() * 100) + "%";
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    s.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
    s.style.width = (6 + Math.random() * 8) + "px";
    s.style.height = (8 + Math.random() * 12) + "px";
    c.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

const PRAISE_CORRECT = ["Awesome! 🎉","Nailed it! ⭐","Brilliant! ✨","You got it! 🔥","Smart move! 🧠","Yes! 💯","On point! 🎯"];
const PRAISE_WRONG  = ["Not quite! 💭","Almost! 🤔","Tricky one! 📝","Remember this one! 💡","Keep going! 💪"];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function gradeFor(pct) {
  if (pct >= 95) return { grade:"A+", label:"Perfect!", emoji:"🏆" };
  if (pct >= 90) return { grade:"A",  label:"Excellent!", emoji:"🌟" };
  if (pct >= 80) return { grade:"B",  label:"Great job!", emoji:"🎉" };
  if (pct >= 70) return { grade:"C",  label:"Good effort!", emoji:"👍" };
  if (pct >= 60) return { grade:"D",  label:"Keep practicing!", emoji:"💪" };
  return { grade:"F", label:"Let's study more!", emoji:"📚" };
}

function letter(i) { return ["A","B","C","D","E"][i] || ""; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function viewHome() {
  const high = loadHigh();
  const plays = loadPlays();
  const bestStreak = loadBestStreak();
  const trouble = getTroubleTopics();
  const lastStats = loadLastStats();
  const totalQ = KEY_ORDER.reduce((n,k)=>n+QUIZ[k].questions.length,0);
  return `
    <div class="card hero">
      <span class="emoji">🎓</span>
      <h1>Grade 6 Study Quiz</h1>
      <p>Fun practice for your final exam!</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">${high}%</div><div class="lbl">High Score</div></div>
      <div class="stat"><div class="num">${plays}</div><div class="lbl">Quizzes</div></div>
      <div class="stat"><div class="num">${bestStreak}🔥</div><div class="lbl">Best Streak</div></div>
    </div>
    <button class="btn btn-primary btn-icon" onclick="startQuiz('full')">🚀 Start Full Quiz <span style="opacity:.85;font-weight:500;">(${totalQ} questions)</span></button>
    <button class="btn btn-ghost btn-icon" onclick="startQuiz('quick')">⚡ Quick Quiz (10 random)</button>
    ${trouble.length > 0
      ? `<button class="btn btn-warn btn-icon" onclick="startQuiz('trouble')">🎯 Trouble Topics <span style="opacity:.9;font-weight:500;">(${trouble.length} topic${trouble.length>1?"s":""} to review)</span></button>`
      : (lastStats ? `<button class="btn btn-success btn-icon" disabled style="opacity:.85;">✅ No trouble topics — nice work!</button>` : "")}
    <div class="card" style="padding:18px;">
      <h2 style="margin-bottom:10px;">📂 Study by Topic</h2>
      <p class="muted" style="margin-bottom:12px;">Tap a topic to take a quiz, flip flashcards, or see memory tricks.</p>
      <div class="topic-grid">
        ${KEY_ORDER.map(k => {
          const weak = lastStats && lastStats[k] && lastStats[k].total > 0 && (lastStats[k].right / lastStats[k].total) < 0.8;
          const score = lastStats && lastStats[k] && lastStats[k].total > 0
            ? ` · last: ${lastStats[k].right}/${lastStats[k].total}` : "";
          return `
          <button class="topic ${weak?"weak":""}" onclick="showTopic('${k}')">
            <div class="icon" style="background:${QUIZ[k].color}33;">${QUIZ[k].emoji}</div>
            <div class="info">
              <div class="ttl">${esc(QUIZ[k].title)}</div>
              <div class="sub">${QUIZ[k].questions.length} questions${score}${weak?" · needs practice":""}</div>
            </div>
            <div class="arrow">›</div>
          </button>`;
        }).join("")}
      </div>
    </div>
    <p class="muted" style="text-align:center;padding:8px;">📱 Tip: add this to her home screen via the browser menu → "Install app".</p>
  `;
}

function viewTopic() {
  const k = state.currentCategory;
  const cat = QUIZ[k];
  const ls = loadLastStats();
  const lastBit = ls && ls[k] && ls[k].total > 0
    ? `Last quiz: <b>${ls[k].right}/${ls[k].total}</b> (${Math.round(ls[k].right/ls[k].total*100)}%)`
    : `${cat.questions.length} questions to practice`;
  return `
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="card topic-hero fade-in">
      <div class="big-icon" style="background:${cat.color}33;">${cat.emoji}</div>
      <h1>${esc(cat.title)}</h1>
      <p>${lastBit}</p>
    </div>
    <button class="btn btn-primary btn-icon" onclick="startQuiz('category','${k}')">📝 Take Quiz</button>
    <button class="btn btn-ghost btn-icon" onclick="startFlashcards('${k}')">🃏 Flashcards</button>
    <button class="btn btn-ghost btn-icon" onclick="showTips('${k}')">💡 Memory Tricks</button>
  `;
}

function viewTips() {
  const k = state.currentCategory;
  const cat = QUIZ[k];
  const tips = TIPS[k] || [];
  return `
    <button class="back-btn" onclick="showTopic('${k}')">← Back to ${esc(cat.title)}</button>
    <div class="card fade-in">
      <h2>💡 ${esc(cat.title)} — Memory Tricks</h2>
      <p class="muted" style="margin:6px 0 14px;">Read these tricks, then try the quiz to lock them in!</p>
      <div class="tip-list">
        ${tips.map(t => `<div class="tip"><h3>${t.h}</h3><p>${t.p}</p></div>`).join("")}
      </div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz('category','${k}')">📝 Practice This Topic Now</button>
    <button class="btn btn-ghost" onclick="startFlashcards('${k}')">🃏 Flashcards Instead</button>
  `;
}

function viewFlashcards() {
  const k = state.currentCategory;
  const cat = QUIZ[k];
  const card = state.fcCurrent;
  const remaining = state.fcPile.length + (card ? 1 : 0);
  return `
    <button class="back-btn" onclick="showTopic('${k}')">← Back</button>
    <div class="fc-progress">${cat.emoji} ${esc(cat.title)} · ${remaining} card${remaining===1?"":"s"} left · ${state.fcDone} mastered</div>
    <div class="flashcard ${state.fcFlipped?"flipped":""}" onclick="flipCard()">
      <div class="flashcard-inner">
        <div class="flashcard-face">
          <div class="term">${esc(card.q)}</div>
          <div class="tap-hint">tap to reveal answer</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="answer">${esc(card.opts[card.a])}</div>
          <div class="answer-hint">${card.hint}</div>
          <div class="tap-hint">tap to flip back</div>
        </div>
      </div>
    </div>
    ${state.fcFlipped ? `
      <div class="fc-actions">
        <button class="btn btn-ghost btn-icon" onclick="fcAction(false)">🔁 Review Again</button>
        <button class="btn btn-success btn-icon" onclick="fcAction(true)">✅ Got It!</button>
      </div>
    ` : `<p class="muted" style="text-align:center;">Think of the answer first, then tap the card to check.</p>`}
  `;
}

function viewFlashcardsDone() {
  const k = state.currentCategory;
  const cat = QUIZ[k];
  return `
    <div class="card score-big">
      <div class="grade" style="font-size:64px;">🎉</div>
      <div class="label">All ${state.fcTotal} cards mastered!</div>
      <div class="pct">${esc(cat.title)}</div>
      <span class="emoji">🃏</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz('category','${k}')">📝 Take the Quiz Now</button>
    <button class="btn btn-ghost" onclick="startFlashcards('${k}')">🔁 Do Flashcards Again</button>
    <button class="btn btn-ghost" onclick="goHome()">🏠 Home</button>
  `;
}

function viewQuiz() {
  const q = state.questions[state.index];
  const total = state.questions.length;
  const cur = state.index + 1;
  const pct = ((cur - 1) / total) * 100;
  const cat = QUIZ[q._cat];
  const streakChip = state.streak >= 3 ? `<div class="streak">🔥 ${state.streak} streak!</div>` : "";
  const modeLabel = state.mode === "trouble" ? "🎯 Trouble Topics" : state.mode === "quick" ? "⚡ Quick Quiz" : state.mode === "category" ? "📂 " + cat.title : "🚀 Full Quiz";

  let feedback = "";
  if (state.answered) {
    const correct = state.selected === q.a;
    feedback = `
      <div class="feedback ${correct ? "correct" : "incorrect"}">
        ${correct ? pick(PRAISE_CORRECT) : pick(PRAISE_WRONG)}
        <span class="hint">${correct ? esc(q.hint) : "Answer: <b>" + esc(q.opts[q.a]) + "</b> — " + esc(q.hint)}</span>
      </div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="nextQuestion()">${cur === total ? "See Results 🎯" : "Next Question →"}</button>
    `;
  }

  return `
    ${streakChip}
    <div class="card" style="padding:14px 18px;">
      <div class="qhead">
        <span>${modeLabel} · Q ${cur}/${total}</span>
        <span>Score: ${state.score}</span>
      </div>
      <div class="progress" style="margin-top:8px;"><div style="width:${pct}%;"></div></div>
    </div>
    <div class="card quiz fade-in">
      <span class="badge" style="background:${cat.color}22;color:#000a;">${cat.emoji} ${esc(cat.title)}</span>
      <div class="qtext" style="margin-top:10px;">${esc(q.q)}</div>
      <div class="options">
        ${q.opts.map((opt, i) => {
          let cls = "option";
          if (state.answered) {
            if (i === q.a) cls += " correct";
            else if (i === state.selected) cls += " incorrect";
          }
          return `<button class="${cls}" ${state.answered ? "disabled" : ""} onclick="selectOption(${i})">
            <span class="letter">${letter(i)}</span>
            <span>${esc(opt)}</span>
          </button>`;
        }).join("")}
      </div>
      ${feedback}
    </div>
    <button class="btn btn-ghost btn-small" onclick="goHome()">← Quit to Home</button>
  `;
}

function viewResults() {
  const total = state.questions.length;
  const pct = Math.round((state.score / total) * 100);
  const g = gradeFor(pct);
  const did = Object.keys(state.categoryStats).filter(k => state.categoryStats[k].total > 0);
  const replayArgs = state.currentCategory ? "'category','" + state.currentCategory + "'" : "'" + state.mode + "'";
  return `
    <div class="card score-big">
      <div class="grade">${g.grade}</div>
      <div class="label">${g.label}</div>
      <div class="pct">${state.score} / ${total} correct &nbsp;•&nbsp; ${pct}%</div>
      <span class="emoji">${g.emoji}</span>
    </div>
    ${did.length > 1 ? `
      <div class="card">
        <h2>📊 By Topic</h2>
        <div class="breakdown">
          ${did.map(k => {
            const s = state.categoryStats[k];
            const p = Math.round((s.right / s.total) * 100);
            return `<div class="row-b">
              <span class="name">${QUIZ[k].emoji} ${esc(QUIZ[k].title)}</span>
              <span class="val">${s.right}/${s.total} (${p}%)</span>
            </div>`;
          }).join("")}
        </div>
      </div>` : ""}
    <div class="card" style="text-align:center;padding:18px;">
      <p class="muted">Best streak this quiz: <b style="color:#ef4444;">🔥 ${state.bestStreak}</b></p>
    </div>
    <div class="row">
      <button class="btn btn-primary" onclick="startQuiz(${replayArgs})">🔄 Play Again</button>
      <button class="btn btn-ghost" onclick="goHome()">🏠 Home</button>
    </div>
    ${getTroubleTopics().length > 0 && state.mode !== "trouble" ? `<button class="btn btn-warn" onclick="startQuiz('trouble')">🎯 Practice Trouble Topics</button>` : ""}
  `;
}

function render() {
  const app = document.getElementById("app");
  let view;
  switch (state.screen) {
    case "topic": view = viewTopic(); break;
    case "tips": view = viewTips(); break;
    case "flashcards": view = viewFlashcards(); break;
    case "flashcards-done": view = viewFlashcardsDone(); break;
    case "quiz": view = viewQuiz(); break;
    case "results": view = viewResults(); break;
    default: view = viewHome();
  }
  app.innerHTML = view;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

window.selectOption = selectOption;
window.nextQuestion = nextQuestion;
window.startQuiz = startQuiz;
window.goHome = goHome;
window.showTopic = showTopic;
window.showTips = showTips;
window.startFlashcards = startFlashcards;
window.flipCard = flipCard;
window.fcAction = fcAction;

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

</html>
