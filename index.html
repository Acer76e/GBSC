      { q: "What would happen in a mangrove forest if all of the decomposers disappeared?", a: 0, opts: ["Dead material would pile up and nutrients would not recycle","Producers would make more food than ever before","Energy would flow faster to the top predators","Nothing, since decomposers are not part of food webs"], hint: "Decomposers recycle nutrients. Without them, dead leaves and animals would pile up and plants would run short of nutrients." },
      { q: "In a food web, both snakes and hawks eat mice. If a disease kills most of the snakes, what will MOST LIKELY happen first?", a: 0, opts: ["The mouse population will increase","The hawk population will drop right away","The mouse population will drop","The grass population will increase"], hint: "Fewer snakes means fewer mice are eaten, so mice increase. Later, more mice could mean more food for hawks and less grass." },
      { q: "Where does almost all of the energy in a Florida coral reef food web come from in the first place?", a: 0, opts: ["Sunlight","Ocean water","Top predators","Decomposers"], hint: "Sunlight is captured by producers like algae (including the algae living inside corals). That energy then flows to every consumer." },
      { q: "Mangrove leaves fall into the water. Bacteria and fungi break them into tiny bits that shrimp eat, and fish eat the shrimp. Which organisms are the decomposers?", a: 0, opts: ["The bacteria and fungi","The shrimp","The fish","The mangrove trees"], hint: "Decomposers break down dead matter. The mangroves are producers, the shrimp and fish are consumers." }
    ]
  },
  relationships: {
    title: "Relationships & Limiting Factors", emoji: "🐍", color: "#ea580c",
    questions: [
      { q: "What is MUTUALISM?", a: 0, opts: ["A relationship in which both organisms benefit","A relationship in which one is helped and one is harmed","A relationship in which one is helped and one is unaffected","A relationship in which both organisms are harmed"], hint: "Mutualism = win-win. Commensalism = win and no effect. Parasitism = win and lose." },
      { q: "What is a LIMITING FACTOR?", a: 0, opts: ["Something in the environment that keeps a population from growing larger","A trait that makes an animal run more slowly","The largest animal at the top of a food web","A fence that keeps people out of a park"], hint: "Limiting factors include food, water, space, shelter, nesting sites, disease, and predators. They limit how big a population can get." },
      { q: "On a Florida reef, cleaner shrimp eat parasites off a grouper. The shrimp get food, and the grouper gets cleaned. What relationship is this?", a: 0, opts: ["Mutualism","Commensalism","Parasitism","Competition"], hint: "Both the shrimp and the grouper benefit, so it is mutualism. Trap: the shrimp is not a parasite, because it helps the fish." },
      { q: "A remora fish rides along with a shark and eats its leftover scraps. The shark is not helped or harmed. What relationship is this?", a: 0, opts: ["Commensalism","Mutualism","Parasitism","Predation"], hint: "One organism benefits and the other is not affected: that is commensalism." },
      { q: "A tick feeds on the blood of a white-tailed deer, and the deer can get sick. What relationship is this?", a: 0, opts: ["Parasitism","Commensalism","Mutualism","Competition"], hint: "A parasite lives on or in a host and harms it, usually without killing it right away. A predator kills and eats its prey." },
      { q: "Invasive Burmese pythons and native alligators in the Everglades both eat raccoons and marsh rabbits. What relationship do the pythons and alligators have over this food?", a: 0, opts: ["Competition","Mutualism","Commensalism","Parasitism"], hint: "When two species need the same limited resource, like the same prey, they compete. Pythons take food that native predators need." },
      { q: "Lionfish are an invasive species on Florida reefs. Why has their population grown so quickly?", a: 0, opts: ["They have few natural predators here to limit them","They decided to move here to find more food","They are native and have always lived here","Native fish help lionfish by feeding them"], hint: "Invasive species often have no natural predators, diseases, or competitors in a new place, so nothing limits their growth. Trap: animals do not 'decide' to become invasive." },
      { q: "A graph shows that when the number of bobcats goes up, the number of rabbits goes down a little later. What is the BEST explanation?", a: 0, opts: ["More bobcats eat more rabbits, so rabbits decrease","Rabbits and bobcats compete for the same grass","Bobcats and rabbits help each other to survive","Rabbits stop reproducing whenever they see bobcats"], hint: "This is a predator and prey pattern. More predators eat more prey, so prey drops. Then predators run low on food and drop too." },
      { q: "A deer population on an island grows quickly, then levels off at about 300 deer for many years. What does 300 most likely represent?", a: 0, opts: ["The carrying capacity of the island","The number of deer born each year","The point where deer stop needing food","The number of predators on the island"], hint: "Carrying capacity is the largest population an environment can support with its food, water, and space. The graph flattens out there." },
      { q: "Florida sea turtles must lay their eggs on sandy beaches. Many beaches are now covered by buildings and seawalls. Which limiting factor is MOST affected?", a: 0, opts: ["Nesting sites","Water","Disease","Sunlight"], hint: "Turtles need open sand to dig nests. Fewer beaches means fewer places to nest, which limits the turtle population." }
    ]
  },
  evolution: {
    title: "Fossils & Natural Selection", emoji: "🦴", color: "#a16207",
    questions: [
      { q: "What is a FOSSIL?", a: 0, opts: ["The preserved remains or traces of an organism from long ago","A living animal that has stayed the same for a long time","A rock that formed when lava cooled quickly","A shiny mineral found only in deserts"], hint: "Fossils include bones, shells, footprints, and imprints. They are usually found in sedimentary rock." },
      { q: "In science, what is an ADAPTATION?", a: 0, opts: ["An inherited trait that helps an organism survive and reproduce","A change an animal makes because it wants to survive","A skill an animal learns during its own lifetime","Any trait at all that an organism is born with"], hint: "Adaptations are INHERITED traits that help, like a sea turtle's flippers. Trap: organisms do not change on purpose because they need to." },
      { q: "Green beetles and brown beetles live on brown tree bark. Birds spot and eat the green beetles more easily. After many generations, what will MOST LIKELY happen?", a: 0, opts: ["Most of the beetles will be brown","Green beetles will turn brown to hide","Each beetle will choose a new color","All of the beetles will become green"], hint: "Brown beetles survive and reproduce more, passing on brown genes. No beetle changes its own color. The population changes over generations." },
      { q: "Which list shows the steps of natural selection in the correct order?", a: 0, opts: ["Variation exists, some survive and reproduce more, their traits are passed on","Animals decide to change, then they pass on their new traits","One animal changes its body, then it becomes a new species","Traits are passed on, variation stops, then every animal survives"], hint: "Natural selection needs VARIATION first. Then the environment 'selects' who survives and reproduces. Their helpful traits become more common." },
      { q: "One rabbit cannot evolve during its lifetime. What DOES change over many generations?", a: 0, opts: ["How common certain traits are in the population","The rabbit's own DNA as it gets older","How hard each rabbit tries to survive","The number of genes inside each rabbit"], hint: "Populations evolve, not individuals. Over generations, helpful traits become more common in the group. Trap: an individual does not evolve." },
      { q: "A weightlifter builds very large muscles. Will his children be born with large muscles because of his workouts?", a: 0, opts: ["No, traits gained during life are not passed in DNA","Yes, all changes to the body are passed on","Yes, but only if he works out for many years","No, because children never resemble their parents"], hint: "Acquired traits, like muscles from exercise or a scar, do not change the DNA in sex cells, so they are not inherited." },
      { q: "Fossils of fish-like animals are found in older rock layers. Fossils of similar animals with legs are found in younger layers above them. What does this evidence support?", a: 0, opts: ["Living things have changed over long periods of time","All organisms appeared on Earth at the same time","Fossils in deeper layers are always the youngest","Fish chose to grow legs so they could walk"], hint: "The fossil record shows life forms changing from older to younger layers. This is consistent with the theory that species change over time." },
      { q: "Fossil shells and shark teeth are found in rock all over inland Florida. What does this tell scientists?", a: 0, opts: ["Ocean water once covered much of Florida","Sharks once lived on dry land in Florida","Birds carried the shells inland to eat them","Fossils slowly move through the ground"], hint: "Marine fossils on land are evidence that the environment changed. Much of Florida was under shallow sea long ago." },
      { q: "Why is a species with very LITTLE genetic variation at greater risk of extinction when its environment changes?", a: 0, opts: ["Few individuals may have traits that help in the new conditions","It can only change its traits once every year","Species with less variation need much more food","Variation has nothing to do with survival"], hint: "Variation is like having many tools. If conditions change, some individuals may have a trait that works. Without variation, the whole species may fail to adapt." },
      { q: "Which event could cause MANY species to go extinct at about the same time?", a: 0, opts: ["A huge asteroid impact that changes Earth's climate","One animal being caught by a predator","A rainstorm that lasts for one afternoon","A few trees being cut down in one park"], hint: "Mass extinctions happen when the environment changes quickly over a large area, faster than many species can adapt." }
    ]
  },
  investigations: {
    title: "Scientific Investigations", emoji: "🔬", color: "#0891b2",
    questions: [
      { q: "What is EMPIRICAL EVIDENCE?", a: 0, opts: ["Information gathered by observing and measuring","A guess made before doing any research","An idea that most people agree with","A belief that cannot be tested"], hint: "Empirical evidence comes from observations and measurements. Scientific explanations are built on lots of it. Trap: popular opinion is not evidence." },
      { q: "In science, what does REPLICATION mean?", a: 0, opts: ["Other scientists repeat a study to see if they get similar results","One scientist runs more trials in the same experiment","A scientist copies another scientist's conclusion","A scientist changes two variables at the same time"], hint: "Replication = OTHER people redo the study. Repetition = the SAME scientist runs more trials. Both make results more trustworthy." },
      { q: "Dr. Rivera tests a new plant food on 5 groups of plants, and then she repeats the whole test herself 3 more times. What is she doing?", a: 0, opts: ["Repetition","Replication","Peer review","Making an inference"], hint: "The same investigator doing more trials is REPETITION. It would be replication if a different team did the study." },
      { q: "At the beach, Julia sees wet sand and puddles. She says, \"It must have rained earlier.\" Which statement is an INFERENCE?", a: 0, opts: ["It must have rained earlier","The sand is wet","There are puddles on the beach","Julia is standing on the beach"], hint: "An observation is what you sense directly (wet sand). An inference is an explanation based on observations. A wave or sprinkler could also wet the sand." },
      { q: "Before a study is published in a science journal, other experts check its methods and data. Why is this done?", a: 0, opts: ["To catch mistakes and check that conclusions fit the evidence","To make sure the results agree with what people believe","To stop other scientists from repeating the study","To decide which scientist is the most famous"], hint: "This is PEER REVIEW. Science gets stronger through debate and checking by other experts." },
      { q: "Two scientists study the same fossil but give different explanations for it. What is the MOST likely reason?", a: 0, opts: ["They interpret the evidence using different background knowledge","One of them must be lying about the fossil","Science only allows one answer at all times","Different explanations mean the fossil is fake"], hint: "Scientists can read the same evidence differently based on their training and experience. More evidence and debate help settle it." },
      { q: "A geologist wants to know how the Grand Canyon formed, but she cannot run a controlled experiment on it. How can she gather evidence?", a: 0, opts: ["Observe the rock layers and compare them to processes happening today","Guess, because there is no way to study the past","Change one variable in the canyon and watch for years","Ask people who live near the canyon what they think"], hint: "Not all science uses experiments. Geologists, astronomers, and field biologists often use observations, comparisons, and models." },
      { q: "A computer model predicts the path of a hurricane heading toward Florida. Which is a LIMITATION of this model?", a: 0, opts: ["It simplifies nature, so the real storm may not follow it exactly","It lets scientists study a storm without being in danger","It helps families prepare before the storm arrives","It can be updated when new weather data comes in"], hint: "Models help us study things that are too big, small, fast, or dangerous. Their limitation is that they leave out details, so they are never perfect." },
      { q: "Which is an example of a scientific THEORY along with evidence that supports it?", a: 0, opts: ["Plate tectonics, supported by matching fossils and rocks on different continents","Newton's law of gravity, which describes how objects pull on each other","A hunch that it will rain tomorrow because your knee hurts","A guess about which team will win the big game"], hint: "A theory EXPLAINS why something happens and is backed by lots of evidence. A law DESCRIBES what happens. Neither one turns into the other." },
      { q: "Alfred Wegener's idea of continental drift was rejected at first. Decades later, evidence from the seafloor led to the theory of plate tectonics. What does this show?", a: 0, opts: ["Scientific knowledge can change when new evidence is found","Scientists never change their minds about ideas","Old ideas are always wrong and should be ignored","An idea becomes true once enough people vote for it"], hint: "Science is open to change. Wegener had good evidence but no way to explain the movement. New evidence later supported and improved his idea." }
    ]
  },
  rock_cycle: {
    title: "Rock Cycle", emoji: "🪨", color: "#78716c",
    questions: [
      { q: "How does IGNEOUS rock form?", a: 0, opts: ["Melted rock (magma or lava) cools and hardens","Layers of sediment are pressed together","Heat and pressure change a rock without melting it","Rainwater dissolves shells and leaves holes"], hint: "Igneous means 'from fire'. It forms when melted rock cools. Granite and basalt are igneous rocks." },
      { q: "How does METAMORPHIC rock form?", a: 0, opts: ["Heat and pressure change an existing rock without melting it","Melted rock cools quickly on Earth's surface","Sand and mud settle and get cemented together","Water evaporates and leaves crystals behind"], hint: "Metamorphic means 'changed form'. The rock gets squeezed and heated deep underground but does NOT melt. If it melted, it would become magma." },
      { q: "Most of Florida sits on thick layers of limestone made from the shells and skeletons of ancient sea creatures. What type of rock is limestone?", a: 0, opts: ["Sedimentary","Igneous","Metamorphic","Magma"], hint: "Sedimentary rock forms from bits of other rocks or remains of living things that pile up in layers and get cemented. That is where most fossils are found." },
      { q: "Limestone deep underground is squeezed and heated during mountain building and becomes marble. What type of rock is marble?", a: 0, opts: ["Metamorphic","Sedimentary","Igneous","Lava"], hint: "A rock changed by heat and pressure without melting is metamorphic. Limestone becomes marble, and shale becomes slate." },
      { q: "Granite has large crystals you can see. Obsidian is glassy with no visible crystals. What does this tell you?", a: 0, opts: ["Granite cooled slowly underground; obsidian cooled fast at the surface","Granite cooled fast at the surface; obsidian cooled slowly underground","Both rocks formed from layers of pressed sand","Both rocks were changed by heat without melting"], hint: "Slow cooling gives crystals time to grow big. Fast cooling (like lava hitting air or water) makes tiny or no crystals." },
      { q: "Which processes break ANY type of rock into sediment and move it to a new place?", a: 0, opts: ["Weathering and erosion","Melting and cooling","Heat and pressure","Compaction and cementation"], hint: "Weathering breaks rock down and erosion carries it away. Compaction and cementation do the opposite: they turn sediment back into rock." },
      { q: "Can an igneous rock become a metamorphic rock without first becoming sedimentary rock?", a: 0, opts: ["Yes, heat and pressure can change it directly","No, rocks must go igneous, then sedimentary, then metamorphic","No, igneous rocks can never change once they form","No, only sedimentary rocks can become metamorphic"], hint: "The rock cycle is not a one-way loop. Any rock type can become any other type, depending on what happens to it." },
      { q: "Sand on an ancient beach is buried under more sand for millions of years. The grains are pressed together and glued by minerals. What rock forms?", a: 0, opts: ["Sandstone, a sedimentary rock","Granite, an igneous rock","Marble, a metamorphic rock","Basalt, an igneous rock"], hint: "Pressing (compaction) plus mineral glue (cementation) turns sediment into sedimentary rock. Sand becomes sandstone." },
      { q: "What provides the energy for rock cycle processes deep UNDER Earth's surface, like melting and metamorphism?", a: 0, opts: ["Heat from Earth's interior","The pull of the Moon's gravity","Wind blowing across the land","Rain soaking into the ground"], hint: "Earth's internal heat drives melting, metamorphism, and plate movement. The Sun drives surface processes like weathering, through weather and the water cycle." },
      { q: "A rock melts deep underground, cools into new rock, is pushed up to the surface, and then is weathered into tiny pieces. What is the correct order?", a: 0, opts: ["Magma, igneous rock, sediment","Sediment, metamorphic rock, magma","Igneous rock, magma, metamorphic rock","Metamorphic rock, sediment, magma"], hint: "Melting makes magma. Cooled magma is igneous rock. Weathering breaks it into sediment. Follow the steps one at a time." }
    ]
  },
  plates: {
    title: "Earth's Layers & Plates", emoji: "🌋", color: "#dc2626",
    questions: [
      { q: "Which list shows Earth's layers in order from the OUTSIDE to the center?", a: 0, opts: ["Crust, mantle, outer core, inner core","Inner core, outer core, mantle, crust","Mantle, crust, inner core, outer core","Crust, outer core, mantle, inner core"], hint: "Think of a peach: thin skin (crust), thick fruit (mantle), and a pit (core). The core has a liquid outer part and a solid inner part." },
      { q: "What is a TECTONIC PLATE?", a: 0, opts: ["A large moving piece of Earth's lithosphere","A layer of melted metal at Earth's center","A deep crack that forms after an earthquake","A thick cloud of ash from a volcano"], hint: "The lithosphere (crust plus the stiff top of the mantle) is broken into giant plates that slowly move on the softer mantle below." },
      { q: "The inner core is even hotter than the outer core, but the inner core is SOLID. Why?", a: 0, opts: ["The huge pressure at the center keeps it solid","It is made of ice instead of metal","It is actually cooler than the outer core","Rock from the crust sinks down and fills it"], hint: "The inner core is mostly iron and nickel. The weight of the whole planet presses on it so hard that the metal cannot melt." },
      { q: "What is the main cause of the slow movement of tectonic plates?", a: 0, opts: ["Convection currents in the hot mantle","Ocean waves pushing on the continents","The Moon's gravity pulling on the crust","Strong winds blowing across the land"], hint: "Heat from deep inside Earth makes mantle rock slowly rise, cool, and sink in a loop. These convection currents help move the plates." },
      { q: "At the Mid-Atlantic Ridge, two plates move APART and magma rises up to make new seafloor. What type of boundary is this?", a: 0, opts: ["Divergent","Convergent","Transform","Subduction"], hint: "Divergent = plates diverge (move apart). Convergent = plates come together. Transform = plates slide past each other." },
      { q: "Along the San Andreas Fault in California, two plates slide PAST each other. What happens often there?", a: 0, opts: ["Earthquakes","New ocean floor forms","Volcanic islands form","Deep ocean trenches form"], hint: "At a transform boundary, plates grind past each other, get stuck, and suddenly slip. That sudden slip is an earthquake." },
      { q: "The Himalayas are the tallest mountains on Earth. They formed where two continental plates ___.", a: 0, opts: ["Pushed together (converged)","Pulled apart (diverged)","Slid past each other","Stopped moving completely"], hint: "When two continental plates collide, neither sinks easily, so the crust crumples and folds upward into huge mountains." },
      { q: "An ocean plate collides with a continental plate and sinks beneath it. What is often found along this kind of boundary?", a: 0, opts: ["A deep trench and a chain of volcanoes","A mid-ocean ridge making new seafloor","No activity, since plates cannot sink","A flat plain with no earthquakes"], hint: "Dense ocean plate sinks (subduction), forming a trench. It melts as it goes down, and the magma rises to make volcanoes, like the Andes." },
      { q: "Why does Florida have very few earthquakes and no active volcanoes?", a: 0, opts: ["Florida is far from the edges of tectonic plates","Florida sits right on a divergent boundary","Florida's limestone soaks up all earthquakes","Florida's crust is not part of any plate"], hint: "Most earthquakes and volcanoes happen at plate boundaries. Florida is in the middle of the North American Plate." },
      { q: "Which is an example of a SLOW change caused by plate movement?", a: 0, opts: ["Mountains rising a few millimeters each year","A volcano erupting in a single day","An earthquake shaking the ground for a minute","A landslide sliding down a hill in seconds"], hint: "Plate movement causes slow changes (mountain building, ocean basins widening) and rapid changes (earthquakes, eruptions)." }
    ]
  },
  geologic_time: {
    title: "Geologic Time & Dating", emoji: "⏳", color: "#9333ea",
    questions: [
      { q: "What does the LAW OF SUPERPOSITION say?", a: 0, opts: ["In undisturbed rock layers, the oldest layers are at the bottom","In undisturbed rock layers, the youngest layers are at the bottom","Rock layers always form in the same order everywhere","Heavier fossils always sink to the lowest layers"], hint: "Layers stack up like laundry in a basket: the first one in is at the bottom. So deeper layers are older, as long as they have not been flipped." },
      { q: "About how old do scientists estimate Earth is?", a: 0, opts: ["About 4.6 billion years","About 4.6 million years","About 460,000 years","About 46 billion years"], hint: "Radiometric dating of rocks and meteorites gives an age of about 4.6 BILLION years. A billion is a thousand millions." },
      { q: "What is the difference between RELATIVE dating and ABSOLUTE dating?", a: 0, opts: ["Relative gives an order (older or younger); absolute gives an age in years","Relative gives an exact age in years; absolute only gives an order","Relative uses radioactive elements; absolute uses rock layers","They are two names for the exact same method"], hint: "Relative dating = 'this layer is older than that one'. Absolute (radiometric) dating = 'this rock is about 70 million years old'." },
      { q: "What makes a fossil a good INDEX FOSSIL?", a: 0, opts: ["The organism lived for a short time but was spread over a wide area","The organism lived for a very long time in one small area","It is the largest fossil found in the rock layer","It comes from an animal that is still alive today"], hint: "A short time span narrows down the age, and a wide range lets you match layers in faraway places." },
      { q: "A cliff shows rock layers A (top), B (middle), and C (bottom). The layers have not been flipped or disturbed. Which layer is the OLDEST?", a: 0, opts: ["Layer C","Layer A","Layer B","All the same age"], hint: "Bottom layer = oldest, by the law of superposition. Layer C formed first, then B, then A on top." },
      { q: "A crack filled with igneous rock cuts straight up through layers A, B, and C. What can you say about the igneous rock?", a: 0, opts: ["It is younger than all the layers it cuts across","It is older than all the layers it cuts across","It is the same age as the middle layer","Its age cannot be compared to the layers"], hint: "The layers had to be there FIRST before magma could cut through them. Something that cuts across layers is younger than they are." },
      { q: "How does radiometric (absolute) dating find a rock's age?", a: 0, opts: ["Radioactive elements in the rock decay at a steady, known rate","Scientists count the rock layers above the rock","Scientists compare the rock's size to other rocks","Older rocks are always darker in color"], hint: "Radioactive elements break down like a clock ticking at a known speed. Measuring how much has changed tells how long ago the rock formed." },
      { q: "The same index fossil is found in a rock layer in Florida and in a rock layer in Texas. What can scientists conclude?", a: 0, opts: ["The two layers are about the same age","The two layers are made of the same type of rock","The animal walked from Florida to Texas","The Texas layer must be much older"], hint: "An index fossil lived during one short time, so layers that contain it formed at about the same time, even far apart." },
      { q: "A forest in Orlando is cut down and paved over to build a large parking lot. What is one likely effect?", a: 0, opts: ["More rainwater runs off instead of soaking into the ground","More rainwater soaks down into the ground than before","The area gains more trees to absorb carbon dioxide","The soil underneath holds more water than before"], hint: "Pavement blocks water from soaking in. Runoff increases, which can cause flooding and carry pollution into lakes and rivers." },
      { q: "People dug canals that drained water from the Everglades to make room for farms and cities. What has been a result?", a: 0, opts: ["Wetland habitat shrank and less fresh water flowed south","The Everglades grew larger and wetter","Florida Bay received more fresh water than before","Wading bird populations grew much larger"], hint: "Changing water flow is a human impact on Earth. Draining wetlands removed habitat and reduced the fresh water reaching the southern Everglades and Florida Bay." }
    ]
  },
  waves: {
    title: "Waves & Light", emoji: "🌈", color: "#2563eb",
    questions: [
      { q: "What is the ELECTROMAGNETIC SPECTRUM?", a: 0, opts: ["The full range of light waves, from radio waves to gamma rays","Only the colors you can see in a rainbow","The sounds that whales and dolphins use","The curved path of a ball that is thrown"], hint: "Visible light is just a tiny part of the spectrum. It also includes radio, microwaves, infrared, ultraviolet, X-rays, and gamma rays." },
      { q: "What happens when light REFRACTS?", a: 0, opts: ["It bends as it passes from one material into another","It bounces off a smooth, shiny surface","It is soaked up and turned into heat","It stops moving completely"], hint: "Refract = bend. Reflect = bounce. Absorb = soak up. Light bends because it changes speed in a new material." },
      { q: "Which list orders these waves from LONGEST wavelength to SHORTEST?", a: 0, opts: ["Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma","Gamma, X-ray, ultraviolet, visible, infrared, microwave, radio","Visible, radio, X-ray, gamma, infrared, ultraviolet, microwave","Radio, visible, microwave, infrared, X-ray, ultraviolet, gamma"], hint: "Memory trick: Raging Martians Invaded Venus Using X-ray Guns. Radio waves are longest; gamma rays are shortest." },
      { q: "Ultraviolet (UV) rays from the Sun can cause sunburn, but visible light does not. Why?", a: 0, opts: ["UV has a shorter wavelength and more energy","UV has a longer wavelength and less energy","UV travels much more slowly than visible light","UV is a type of sound wave, not light"], hint: "Shorter wavelength = higher frequency = more energy. That is why UV, X-rays, and gamma rays can damage cells." },
      { q: "White sunlight passes through a prism and spreads out into a rainbow of colors. What does this show?", a: 0, opts: ["White light is made of many colors mixed together","The prism adds color to clear light","Light is a type of sound wave","Only red light comes from the Sun"], hint: "Each color refracts a slightly different amount, so the prism separates them. Trap: the prism does not create the colors; they were already in the white light." },
      { q: "Why does a black T-shirt get hotter in the Florida sun than a white T-shirt?", a: 0, opts: ["Black absorbs more light; white reflects more","Black reflects more light; white absorbs more","Black fabric makes its own heat energy","White fabric lets cold flow in from the air"], hint: "Dark colors absorb most light, turning it into thermal energy. Light colors reflect most light. Trap: cold does not flow; only heat moves." },
      { q: "A straw in a glass of water looks bent or broken right at the water's surface. Why?", a: 0, opts: ["Light refracts as it moves between water and air","The water actually bends the straw","Light reflects off the bottom of the glass","The water absorbs all light from the straw"], hint: "Light changes speed and bends when it passes from water to air, so the straw seems to be in a different place than it really is." },
      { q: "Julia puts her ear on a long metal railing while a friend taps the far end. She hears the tap through the metal before she hears it through the air. Why?", a: 0, opts: ["Sound travels faster through solids than through air","Sound travels fastest through air","The air blocks sound from moving at all","Light from the tap reaches her ear first"], hint: "Particles in solids are packed tightly, so sound passes through them fastest. Sound is slowest in gases like air. Trap: sound is NOT fastest in air." },
      { q: "During a storm, you see lightning and then hear thunder 6 seconds later. Why does this happen?", a: 0, opts: ["Light travels much faster than sound","Sound travels much faster than light","Thunder happens long after lightning ends","Light needs air to travel but sound does not"], hint: "Light and thunder happen at the same moment, but light is almost a million times faster than sound in air, so you see the flash first." },
      { q: "Which statement about light waves and sound waves is TRUE?", a: 0, opts: ["Light can travel through empty space, but sound cannot","Sound can travel through empty space, but light cannot","Both need air to travel from place to place","Both travel at the same speed in every material"], hint: "Sound needs matter to vibrate, so it cannot cross empty space. Light can, which is how sunlight reaches us. Both change speed in different materials." }

      { q: "Evaluate √64 + ∛27.", a: 0, opts: ["11","41","17","35"], hint: "Step 1: √64: what times itself is 64? 8 × 8 = 64, so 8. Step 2: ∛27: 3 × 3 × 3 = 27, so 3. Step 3: 8 + 3 = 11. Trap: 41 comes from halving 64 (32) and dividing 27 by 3 (9). Roots are not halving or dividing by 3." },
      { q: "√50 is between which two whole numbers?", a: 0, opts: ["7 and 8","25 and 26","6 and 7","49 and 50"], hint: "Find the perfect squares on each side of 50: 7² = 49 and 8² = 64. Since 50 is between 49 and 64, √50 is between 7 and 8 (very close to 7). Trap: √50 ≈ 25 halves the number. Check: 25 × 25 = 625, way too big." },
      { q: "Which number is IRRATIONAL?", a: 0, opts: ["√20","√25","0.3 repeating","−4/3"], hint: "A rational number can be written as a fraction of integers. Repeating decimals like 0.333... = 1/3 count as rational, and √25 = 5. But 20 is not a perfect square, so √20 is a decimal that never ends and never repeats. That is irrational. Trap: thinking repeating decimals are irrational. Only NON-repeating, never-ending decimals are." },
      { q: "What is the best estimate of √30 to the nearest tenth?", a: 0, opts: ["5.5","15","5.1","6.5"], hint: "Step 1: perfect squares nearby: 5² = 25 and 6² = 36, so √30 is between 5 and 6. Step 2: 30 is about halfway from 25 to 36, so try 5.5: 5.5 × 5.5 = 30.25. Very close! Trap: 15 is half of 30, and 5.1 only adds a tiny bit even though 30 is far from 25." },
      { q: "Which list is in order from LEAST to GREATEST?", a: 0, opts: ["√8, 3, π, √10","3, √8, π, √10","√8, 3, √10, π","π, 3, √10, √8"], hint: "Turn each into a decimal. √8 ≈ 2.83 (between 2 and 3), 3 = 3, π ≈ 3.14, √10 ≈ 3.16. So √8, 3, π, √10. Trap: π and √10 are VERY close. √10 is a little more than 3.16 because 3.16 × 3.16 ≈ 9.99, so √10 beats π (3.14)." },
      { q: "Solve x² = 81.", a: 0, opts: ["x = 9 or x = −9","x = 9 only","x = 40.5","x = 6,561"], hint: "Ask: what numbers times themselves make 81? 9 × 9 = 81 AND (−9) × (−9) = 81. So x = 9 or x = −9. Trap: forgetting the negative answer. A negative times a negative is positive, so both work. 40.5 is half of 81, not a root." },
      { q: "Solve x³ = −64.", a: 0, opts: ["x = −4","x = 4","x = 4 or x = −4","x = −8"], hint: "Ask: what number used 3 times makes −64? (−4) × (−4) × (−4) = 16 × (−4) = −64. So x = −4. Trap: 4³ is +64, not −64, so 4 does not work. Unlike squares, a cube root has only ONE real answer, and it keeps the sign. −8 is a square root idea (8 × 8 = 64), not a cube root." },
      { q: "A square beach towel has an area of 20 square feet. What is the best estimate for the length of each side?", a: 0, opts: ["About 4.5 feet","About 10 feet","About 400 feet","About 5.5 feet"], hint: "Area of a square = side × side, so side = √20. Step 1: 4² = 16 and 5² = 25, so √20 is between 4 and 5. Step 2: try 4.5: 4.5 × 4.5 = 20.25. That's the best fit. Trap: 10 halves the area, and 400 squares it instead of taking the root. 5.5 × 5.5 = 30.25, too big." }
    ]
  },
  multi_step: {
    title: "Multi-Step Equations", emoji: "🔧", color: "#f59e0b",
    questions: [
      { q: "In 5x + 2 = 3x + 10, x is on BOTH sides. What is a good first step?", a: 0, opts: ["Subtract 3x from both sides","Add 5x and 3x together","Divide only the left side by 5","Subtract 10 from only the left side"], hint: "Goal: get all the x's on ONE side. Subtract the smaller x-term (3x) from both sides: 5x − 3x + 2 = 10, so 2x + 2 = 10. Trap: 5x and 3x are on opposite sides of the equal sign, so you can't just add them. And whatever you do to one side, you must do to the other." },
      { q: "You solve an equation and end up with 4 = 4 (true, and no x left). How many solutions are there?", a: 0, opts: ["Infinitely many solutions","No solution","Exactly one solution, x = 4","Exactly one solution, x = 0"], hint: "If the x's disappear and what's left is ALWAYS true (like 4 = 4), then every number works: infinitely many solutions. If what's left is FALSE (like 8 = 5), there is no solution. Trap: the 4 in 4 = 4 is not the value of x." },
      { q: "Solve 3(x + 4) = 27.", a: 0, opts: ["x = 5","x = 7 2/3","x = 13","x = 9"], hint: "Step 1: distribute the 3 to BOTH terms: 3x + 12 = 27. Step 2: subtract 12: 3x = 15. Step 3: divide by 3: x = 5. Check: 3(5 + 4) = 3 × 9 = 27. Trap: 7 2/3 comes from 3x + 4, multiplying only the x and forgetting the 4." },
      { q: "Solve 5x + 2 = 3x + 10.", a: 0, opts: ["x = 4","x = 1.5","x = 6","x = 8"], hint: "Step 1: subtract 3x from both sides: 2x + 2 = 10. Step 2: subtract 2: 2x = 8. Step 3: divide by 2: x = 4. Check: 5(4) + 2 = 22 and 3(4) + 10 = 22. Trap: 1.5 comes from ADDING 3x to both sides (8x = 12), and 8 forgets the last divide." },
      { q: "Solve 2(x − 3) = −4x + 12.", a: 0, opts: ["x = 3","x = 2.5","x = −9","x = 1"], hint: "Step 1: distribute: 2x − 6 = −4x + 12. Step 2: add 4x to both sides: 6x − 6 = 12. Step 3: add 6: 6x = 18. Step 4: x = 3. Check: 2(0) = 0 and −12 + 12 = 0. Trap: 2.5 comes from writing 2x − 3 (the 2 must multiply the 3 too)." },
      { q: "Solve −2(x + 5) = 4.", a: 0, opts: ["x = −7","x = 3","x = −3","x = 7"], hint: "Step 1: distribute the −2 to BOTH terms: −2x − 10 = 4. Step 2: add 10: −2x = 14. Step 3: divide by −2: x = −7. Check: −2(−7 + 5) = −2(−2) = 4. Trap: the big one is −2 × 5. It is −10, not +10. Writing −2x + 10 leads to x = 3." },
      { q: "How many solutions does 4(x + 2) = 4x + 5 have?", a: 0, opts: ["No solution","Exactly one solution","Infinitely many solutions","Exactly two solutions"], hint: "Step 1: distribute: 4x + 8 = 4x + 5. Step 2: subtract 4x: 8 = 5. That is FALSE, and the x's are gone, so no number can ever work: no solution. Trap: thinking every equation has exactly one answer." },
      { q: "How many solutions does 3(2x − 1) = 6x − 3 have?", a: 0, opts: ["Infinitely many solutions","No solution","Exactly one solution","Exactly two solutions"], hint: "Step 1: distribute: 6x − 3 = 6x − 3. Both sides are EXACTLY the same! Step 2: subtract 6x: −3 = −3. Always true, so every number works: infinitely many solutions. Try x = 10: 3(19) = 57 and 60 − 3 = 57. Yes!" },
      { q: "Theme Park A charges $30 to get in plus $2 per ride. Theme Park B charges $12 to get in plus $5 per ride. For how many rides r do they cost the same?", a: 0, opts: ["6 rides","14 rides","3 rides","18 rides"], hint: "Step 1: write each cost: A = 30 + 2r, B = 12 + 5r. Step 2: set them equal: 30 + 2r = 12 + 5r. Step 3: subtract 2r: 30 = 12 + 3r. Step 4: subtract 12: 18 = 3r, so r = 6. Check: 30 + 12 = 42 and 12 + 30 = 42. Trap: 18 forgets to divide by 3." },
      { q: "Solve (1/2)(8x − 6) + x = 2x + 18.", a: 0, opts: ["x = 7","x = 8","x = 21","x = 5"], hint: "Step 1: distribute the 1/2 to both terms: 4x − 3 + x = 2x + 18. Step 2: combine like terms: 5x − 3 = 2x + 18. Step 3: subtract 2x: 3x − 3 = 18. Step 4: add 3: 3x = 21, so x = 7. Trap: 8 comes from halving only the 8x and keeping −6. Every term inside gets multiplied." }
    ]
  },
  multi_ineq: {
    title: "Multi-Step Inequalities", emoji: "🚦", color: "#ef4444",
    questions: [
      { q: "In 5x + 3 < 2x + 12, x is on BOTH sides. What is a good first step?", a: 0, opts: ["Subtract 2x from both sides","Flip the inequality sign right away","Divide only the left side by 5","Add 5x and 2x together"], hint: "Solve it like an equation: get the x's on one side by subtracting 2x from both sides: 3x + 3 < 12. Trap: you only flip the sign when you multiply or divide by a NEGATIVE, not at the start of every problem." },
      { q: "The solution to an inequality is x ≥ −2. Which number is NOT a solution?", a: 0, opts: ["−3","−2","0","5"], hint: "x ≥ −2 means −2 or anything bigger. On a number line, −3 is to the LEFT of −2, so it is smaller and does not work. Trap: −2 IS a solution because of the \"or equal to\" line under the sign (closed circle)." },
      { q: "Solve 4(x − 2) > 12.", a: 0, opts: ["x > 5","x > 3.5","x > 1","x < 5"], hint: "Step 1: distribute: 4x − 8 > 12. Step 2: add 8: 4x > 20. Step 3: divide by 4 (positive, so no flip): x > 5. Trap: 3.5 comes from 4x − 2 (forgetting to multiply the 2), and x > 1 subtracts 8 instead of adding it." },
      { q: "Solve −3(x + 1) < 9.", a: 0, opts: ["x > −4","x < −4","x > −2","x < 4"], hint: "Step 1: distribute the −3: −3x − 3 < 9. Step 2: add 3: −3x < 12. Step 3: divide by −3 and FLIP the sign: x > −4. Trap: x < −4 forgets to flip, and x > −2 comes from −3 × 1 = +3 (it's −3)." },
      { q: "Solve 6x − 4 ≥ 2x + 8.", a: 0, opts: ["x ≥ 3","x ≥ 1","x ≥ 1.5","x ≤ 3"], hint: "Step 1: subtract 2x: 4x − 4 ≥ 8. Step 2: add 4: 4x ≥ 12. Step 3: divide by 4 (positive, no flip): x ≥ 3. Trap: x ≤ 3 flips when you didn't divide by a negative. 1.5 comes from adding 2x to both sides (8x ≥ 12)." },
      { q: "Solve 2x + 12 < 5x.", a: 0, opts: ["x > 4","x < 4","x > −4","x < −4"], hint: "Way 1: subtract 2x: 12 < 3x, then divide by 3: 4 < x, which is the same as x > 4. Way 2: subtract 5x: −3x + 12 < 0, so −3x < −12, divide by −3 and FLIP: x > 4. Same answer! Trap: x < 4 divides by −3 and forgets to flip." },
      { q: "Solve 2(x − 4) ≥ 5x + 1.", a: 0, opts: ["x ≤ −3","x ≥ −3","x ≤ 3","x ≥ 3"], hint: "Step 1: distribute: 2x − 8 ≥ 5x + 1. Step 2: subtract 5x: −3x − 8 ≥ 1. Step 3: add 8: −3x ≥ 9. Step 4: divide by −3 and FLIP: x ≤ −3. Check x = −4: 2(−8) = −16 and 5(−4) + 1 = −19, and −16 ≥ −19 is true. Trap: forgetting the flip gives x ≥ −3." },
      { q: "Which value of x is a solution of 3(x + 2) > 5x − 4?", a: 0, opts: ["4","5","6","10"], hint: "Solve first: 3x + 6 > 5x − 4. Subtract 3x: 6 > 2x − 4. Add 4: 10 > 2x. Divide by 2: 5 > x, so x < 5. Only 4 works. Check x = 5: 21 > 21 is false (they are equal, not greater). Trap: forgetting that > does not include the boundary number." },
      { q: "Julia has $45 and saves $5 a week. Her cousin has $75 and spends $5 a week. After how many weeks w will Julia have MORE money than her cousin?", a: 0, opts: ["w > 3","w < 3","w > 12","w > 6"], hint: "Step 1: Julia: 45 + 5w. Cousin: 75 − 5w. Step 2: Julia MORE: 45 + 5w > 75 − 5w. Step 3: add 5w: 45 + 10w > 75. Step 4: subtract 45: 10w > 30, so w > 3. Check w = 4: Julia 65, cousin 55. Trap: w > 6 forgets that BOTH amounts are changing (that's 10 a week apart, not 5)." },
      { q: "Softball League A costs $50 to join plus $8 per game. League B costs $20 to join plus $11 per game. For how many games g is League A CHEAPER?", a: 0, opts: ["g > 10","g < 10","g > 30","g < 3"], hint: "Step 1: A cheaper means 50 + 8g < 20 + 11g. Step 2: subtract 8g: 50 < 20 + 3g. Step 3: subtract 20: 30 < 3g. Step 4: divide by 3: 10 < g, so g > 10. Check g = 11: A = 138, B = 141. Trap: reading 10 < g backward as g < 10. The pointy end always points at the smaller side." }
    ]
  },
  slope: {
    title: "Slope & Rate of Change", emoji: "⛰️", color: "#14b8a6",
    questions: [
      { q: "What does the SLOPE of a line measure?", a: 0, opts: ["How steep it is (rise over run)","Where it crosses the y-axis","How long the line is","Where it crosses the x-axis"], hint: "Slope = rise ÷ run = how much y changes for each 1 step in x. A bigger number means a steeper line. Trap: where the line crosses the y-axis is the y-intercept, a different idea." },
      { q: "A line goes DOWN as you read it from left to right. What kind of slope does it have?", a: 0, opts: ["Negative","Positive","Zero","Undefined"], hint: "Read lines like words, left to right. Uphill = positive, downhill = negative, flat = zero, straight up and down = undefined. Downhill means negative." },
      { q: "What is the slope of the line through (1, 2) and (3, 8)?", a: 0, opts: ["3","1/3","−3","6"], hint: "Slope = (change in y) ÷ (change in x). Step 1: rise = 8 − 2 = 6. Step 2: run = 3 − 1 = 2. Step 3: 6 ÷ 2 = 3. Trap: 1/3 is run over rise (upside down). Remember: the y change (rise) always goes on TOP." },
      { q: "What is the slope of the line through (−2, 5) and (2, −3)?", a: 0, opts: ["−2","2","−1/2","1/2"], hint: "Step 1: rise = −3 − 5 = −8. Step 2: run = 2 − (−2) = 4. Step 3: −8 ÷ 4 = −2. Check: the line goes down as x increases, so it MUST be negative. Trap: 2 loses the negative sign, and −1/2 flips to run over rise." },
      { q: "A table shows x = 0, 2, 4, 6 and y = 1, 7, 13, 19. What is the rate of change?", a: 0, opts: ["3","6","1/3","1"], hint: "Step 1: y goes up by 6 each time (1, 7, 13, 19). Step 2: x goes up by 2 each time. Step 3: rate = 6 ÷ 2 = 3. Trap: 6 only looks at the y's. Always divide by how much x changed." },
      { q: "What is the slope of a horizontal line, like y = 4?", a: 0, opts: ["0","Undefined","4","1"], hint: "A horizontal line is flat: the rise is 0 no matter how far you run. 0 ÷ run = 0. Trap: mixing it up with a vertical line, which has undefined slope. Think: flat floor = zero, wall = undefined. 4 is where it crosses the y-axis, not the slope." },
      { q: "What is the slope of the vertical line through (5, 1) and (5, 9)?", a: 0, opts: ["Undefined","0","8","5"], hint: "Rise = 9 − 1 = 8, run = 5 − 5 = 0. Slope = 8 ÷ 0, and you can never divide by 0. So the slope is undefined. Trap: saying 0. A vertical line is the steepest possible line, so its slope can't be 0." },
      { q: "On a graph, a line passes through (0, 1) and goes UP 2 units for every 5 units it goes RIGHT. What is its slope?", a: 0, opts: ["2/5","5/2","2","−2/5"], hint: "Slope = rise ÷ run = 2 ÷ 5 = 2/5. It goes up, so the slope is positive. Trap: 5/2 is run over rise. Rise (up and down) always goes on top." },
      { q: "A rocket launched from Cape Canaveral is 1,200 feet high after 4 seconds and 3,000 feet high after 10 seconds. What is its average rate of change?", a: 0, opts: ["300 feet per second","1,800 feet per second","1/300 second per foot","3,000 feet per second"], hint: "Rate of change = change in height ÷ change in time. Step 1: 3,000 − 1,200 = 1,800 feet. Step 2: 10 − 4 = 6 seconds. Step 3: 1,800 ÷ 6 = 300 feet per second. Trap: 1,800 forgets to divide by the time, and 1/300 flips it upside down." },
      { q: "Which line is STEEPER: one with slope −5 or one with slope 3?", a: 0, opts: ["The line with slope −5","The line with slope 3","They are equally steep","You can't tell from the slopes"], hint: "Steepness is about the SIZE of the slope, not the sign. Ignore the negative: 5 is bigger than 3, so the slope −5 line is steeper (it just goes downhill). Trap: thinking negative numbers are always \"less steep.\"" }
    ]
  },
  linear: {
    title: "Linear Equations y = mx + b", emoji: "✏️", color: "#6366f1",
    questions: [
      { q: "In the equation y = mx + b, what does m stand for?", a: 0, opts: ["The slope","The y-intercept","The x-intercept","The y-value of a point"], hint: "In y = mx + b, m is the slope (the number multiplying x) and b is the y-intercept (the number added on). Memory trick: m is for \"move\" (how the line moves), b is for \"begin\" (where it starts on the y-axis)." },
      { q: "In y = mx + b, what does b tell you?", a: 0, opts: ["Where the line crosses the y-axis","Where the line crosses the x-axis","How steep the line is","The x-value of a point"], hint: "b is the y-intercept: the point (0, b) where the line crosses the y-axis. Trap: b is NOT where it crosses the x-axis. When x = 0, y = m(0) + b = b. That's on the y-axis." },
      { q: "What are the slope and y-intercept of y = −2x + 7?", a: 0, opts: ["Slope −2, y-intercept 7","Slope 7, y-intercept −2","Slope 2, y-intercept 7","Slope −2, y-intercept −7"], hint: "Match it to y = mx + b. The number stuck to x is m = −2 (keep the sign!). The number added on is b = 7. Trap: dropping the negative from −2, or swapping m and b." },
      { q: "Which equation has slope 4 and y-intercept −1?", a: 0, opts: ["y = 4x − 1","y = −x + 4","y = 4x + 1","y = −4x − 1"], hint: "Plug into y = mx + b: m = 4, b = −1. So y = 4x + (−1) = 4x − 1. Trap: y = −x + 4 swaps the slope and the y-intercept." },
      { q: "A line passes through (0, 3) and (2, 7). What is its equation?", a: 0, opts: ["y = 2x + 3","y = 3x + 2","y = (1/2)x + 3","y = 2x + 7"], hint: "Step 1: (0, 3) is on the y-axis, so b = 3. Step 2: slope = (7 − 3) ÷ (2 − 0) = 4 ÷ 2 = 2. Step 3: y = 2x + 3. Check (2, 7): 2(2) + 3 = 7. Trap: (1/2)x uses run over rise, and +7 uses the wrong point for b." },
      { q: "A table shows x = 0, 1, 2, 3 and y = 5, 8, 11, 14. Which equation fits the table?", a: 0, opts: ["y = 3x + 5","y = 5x + 3","y = x + 5","y = 3x"], hint: "Step 1: when x = 0, y = 5, so b = 5. Step 2: y goes up 3 each time x goes up 1, so m = 3. Step 3: y = 3x + 5. Check x = 3: 9 + 5 = 14. Trap: y = 5x + 3 swaps the slope and the start." },
      { q: "A kayak rental at Cocoa Beach costs $15 plus $10 per hour. Which equation gives the cost c for h hours?", a: 0, opts: ["c = 10h + 15","c = 15h + 10","c = 25h","c = 10h"], hint: "The amount that changes every hour ($10) is the slope, so it goes with h. The one-time fee ($15) is the starting amount b. So c = 10h + 15. Check 2 hours: 20 + 15 = $35. Trap: c = 15h + 10 charges the one-time fee every hour." },
      { q: "The cost of a theme park order is y = 45x + 20, where x is the number of tickets and y is the total in dollars. What does the 20 mean?", a: 0, opts: ["A $20 fee you pay no matter how many tickets you buy","Each ticket costs $20","You can buy 20 tickets","The total for 45 tickets"], hint: "20 is b, the y-intercept: the cost when x = 0 tickets. It is a one-time fee added to every order. The 45 is the slope, so each ticket costs $45. Trap: mixing up the per-ticket rate (slope) with the starting amount." },
      { q: "Julia's tablet battery is modeled by y = −5x + 100, where x is hours of gaming and y is the percent left. What does −5 mean?", a: 0, opts: ["The battery drops 5% each hour","The battery starts at 5%","The battery gains 5% each hour","The battery lasts 5 hours"], hint: "−5 is the slope: the change in y for each 1 hour. Negative means it goes DOWN 5% every hour. 100 is the start (a full battery). Trap: ignoring the negative sign. Check: it would last 100 ÷ 5 = 20 hours, not 5." },
      { q: "A line passes through (2, 5) and (4, 9). What is its equation?", a: 0, opts: ["y = 2x + 1","y = 2x + 5","y = (1/2)x + 4","y = 4x − 3"], hint: "Step 1: slope = (9 − 5) ÷ (4 − 2) = 4 ÷ 2 = 2. Step 2: plug a point into y = 2x + b: 5 = 2(2) + b, so 5 = 4 + b and b = 1. Step 3: y = 2x + 1. Check (4, 9): 8 + 1 = 9. Trap: b = 5 uses the point's y-value, but (2, 5) is not on the y-axis." }
    ]
  },
  systems: {
    title: "Systems of Linear Equations", emoji: "🔀", color: "#a855f7",
    questions: [
      { q: "On a graph, what is the solution to a system of two linear equations?", a: 0, opts: ["The point where the two lines cross","The y-intercept of the first line","The slope of both lines","Any point on either line"], hint: "A solution has to make BOTH equations true at the same time. The only points on BOTH lines are where they cross (intersect). Trap: a point on just one line only works for one equation." },
      { q: "Two lines have the SAME slope but DIFFERENT y-intercepts. How many solutions does the system have?", a: 0, opts: ["No solution","Exactly one","Infinitely many","Two"], hint: "Same slope means the lines are parallel, like train tracks. Different starting points means they never meet. No crossing point = no solution. If the y-intercepts were also the same, it would be the same line: infinitely many." },
      { q: "Is (2, 3) a solution of the system y = x + 1 and y = 2x − 1?", a: 0, opts: ["Yes, it makes both equations true","No, it works only in the first equation","No, it works only in the second equation","No, it works in neither equation"], hint: "Plug x = 2 and y = 3 into EACH equation. First: 3 = 2 + 1. True. Second: 3 = 2(2) − 1 = 3. True. Both true, so yes! Trap: stopping after checking only one equation." },
      { q: "Is (1, 4) a solution of the system y = 3x + 1 and y = −x + 6?", a: 0, opts: ["No, it works only in the first equation","Yes, it works in both equations","No, it works only in the second equation","No, it works in neither equation"], hint: "First: 4 = 3(1) + 1 = 4. True. Second: 4 = −1 + 6 = 5? False! It has to work in BOTH to be a solution, so no. Trap: checking the first equation, seeing it works, and calling it a solution." },
      { q: "Solve the system: y = 2x and x + y = 12.", a: 0, opts: ["(4, 8)","(8, 4)","(6, 6)","(2, 4)"], hint: "Substitution: y is already alone, so replace y with 2x in the second equation: x + 2x = 12, so 3x = 12 and x = 4. Then y = 2(4) = 8. Answer (4, 8). Check: 8 = 2(4) and 4 + 8 = 12. Trap: (8, 4) swaps x and y. (6, 6) only works in the second equation." },
      { q: "Solve the system: y = x + 3 and y = −x + 7.", a: 0, opts: ["(2, 5)","(5, 2)","(4, 7)","(2, 3)"], hint: "Both equal y, so set them equal: x + 3 = −x + 7. Add x: 2x + 3 = 7. Subtract 3: 2x = 4, so x = 2. Then y = 2 + 3 = 5. Check the other: −2 + 7 = 5. Trap: (4, 7) works in the first equation only, and (5, 2) swaps x and y." },
      { q: "How many solutions does the system y = 3x + 2 and y = 3x − 4 have?", a: 0, opts: ["No solution","Exactly one solution","Infinitely many solutions","Exactly two solutions"], hint: "Compare slopes and y-intercepts. Both slopes are 3 (parallel), but the y-intercepts are 2 and −4 (different). Parallel lines never cross: no solution. Try solving: 3x + 2 = 3x − 4 gives 2 = −4, which is false." },
      { q: "How many solutions does the system y = 2x + 1 and 2y = 4x + 2 have?", a: 0, opts: ["Infinitely many solutions","No solution","Exactly one solution","Exactly two solutions"], hint: "Divide the second equation by 2: y = 2x + 1. It's the SAME line as the first one! Every point on it works for both: infinitely many solutions. Trap: the second equation looks different, so always simplify it first." },
      { q: "How many solutions does the system y = 2x + 5 and y = −x + 5 have?", a: 0, opts: ["Exactly one solution","No solution","Infinitely many solutions","Exactly two solutions"], hint: "The slopes are DIFFERENT (2 and −1), so the lines cross exactly once. They cross at (0, 5), where both start. Trap: seeing the same y-intercept and thinking they are the same line. Same line needs the same slope AND the same y-intercept." },
      { q: "At a theme park, drinks cost $3 and pretzels cost $5. Julia buys 5 items and spends $19. How many of each did she buy?", a: 0, opts: ["2 pretzels and 3 drinks","3 pretzels and 2 drinks","1 pretzel and 4 drinks","4 pretzels and 1 drink"], hint: "Let d = drinks, p = pretzels. Equations: d + p = 5 and 3d + 5p = 19. Substitute d = 5 − p: 3(5 − p) + 5p = 19, so 15 + 2p = 19, 2p = 4, p = 2. Then d = 3. Check: 3(3) + 5(2) = 9 + 10 = 19. Trap: 3 pretzels and 2 drinks costs $21, so read carefully which is which." }

function tryEarn(set, newList, id) {
  if (!set.has(id)) {
    set.add(id);
    const t = TROPHIES.find(x => x.id === id);
    if (t) newList.push(t);
  }
}

function checkTrophiesAfterQuiz(ctx) {
  const earned = loadTrophies(); const newOnes = [];
  tryEarn(earned, newOnes, "first_quiz");
  if (ctx.pct === 100) tryEarn(earned, newOnes, "perfect");
  if (ctx.mode === "exam" && ctx.pct >= 90) tryEarn(earned, newOnes, "sharp_shooter");
  if (ctx.mode === "timed" && ctx.pct >= 80) tryEarn(earned, newOnes, "speed_demon");
  if (ctx.mode === "timed" && ctx.score === ctx.total) tryEarn(earned, newOnes, "lightning");
  if (ctx.mode === "subobj" && ctx.pct === 100) tryEarn(earned, newOnes, "sub_obj_pro");
  if (ctx.mode === "practice" && ctx.hintsUsed === 0) tryEarn(earned, newOnes, "no_hints");
  if (loadPlays() >= 10) tryEarn(earned, newOnes, "bookworm");
  if (loadPlays() >= 25) tryEarn(earned, newOnes, "scholar");
  if (loadCorrectTotal() >= 100) tryEarn(earned, newOnes, "centurion");
  const tried = new Set(loadHistory().map(h => h.mode));
  const allModes = ["practice","exam","timed","quick","trouble","subobj","category"];
  if (allModes.every(m => tried.has(m))) tryEarn(earned, newOnes, "all_modes");
  // Improving trend check
  const hist = loadHistory().slice().sort((a,b)=>a.date-b.date);
  if (hist.length >= 6) {
    const last3 = hist.slice(-3).map(h=>h.pct);
    const prior3 = hist.slice(-6,-3).map(h=>h.pct);
    const lAvg = last3.reduce((s,p)=>s+p,0)/3;
    const pAvg = prior3.reduce((s,p)=>s+p,0)/3;
    if (lAvg - pAvg >= 5) tryEarn(earned, newOnes, "improver");
  }
  saveTrophies(earned);
  return newOnes;
}

function topicAggregates() {
  const hist = loadHistory();
  const agg = {};
  for (const k of KEY_ORDER) agg[k] = { right: 0, total: 0, quizzes: 0 };
  for (const h of hist) {
    if (!h.categoryStats) continue;
    for (const k of KEY_ORDER) {
      const s = h.categoryStats[k];
      if (s && s.total > 0) {
        agg[k].right += s.right;
        agg[k].total += s.total;
        agg[k].quizzes++;
      }
    }
  }
  return agg;
}

function getTroubleTopics() {
  const stats = loadLastStats();
  if (!stats) return [];
  const trouble = [];
  for (const k of KEY_ORDER) {
    if (stats[k] && stats[k].total > 0 && (stats[k].right / stats[k].total) < 0.8) trouble.push(k);
  }
  return trouble;
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function shuffleOptions(q) {
  const idxs = q.opts.map((_, i) => i);
  const order = shuffle(idxs);
  return { ...q, opts: order.map(i => q.opts[i]), a: order.indexOf(q.a) };
}

function gatherQuestions(mode, key) {
  if (mode === "timed") {
    const all = [];
    for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).slice(0, TIMED_QS).map(shuffleOptions);
  }
  if (mode === "subobj") return shuffle(SUBOBJ.questions.map(q => ({ ...q, _cat: "pronouns", _sub: true }))).map(shuffleOptions);
  if (mode === "category") return shuffle(QUIZ[key].questions.map(q => ({ ...q, _cat: key }))).map(shuffleOptions);
  if (mode === "quick") {
    const all = [];
    for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).slice(0, 10).map(shuffleOptions);
  }
  if (mode === "trouble") {
    const trouble = getTroubleTopics();
    const all = [];
    for (const k of trouble) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
    return shuffle(all).map(shuffleOptions);
  }
  const all = [];
  for (const k of KEY_ORDER) for (const q of QUIZ[k].questions) all.push({ ...q, _cat: k });
  return shuffle(all).map(shuffleOptions);
}

function startQuiz(mode, key) {

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateOffset(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function isDailyDoneToday() { return loadDailyLast() === todayStr(); }

function stringHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function lcg(seed) {
  let s = seed || 1;
  return function() { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
function seededShuffle(arr, seed) {
  const rng = lcg(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getDailyQuestions(subjKey) {
  const subj = SUBJECTS[subjKey];
  const all = [];
  for (const k of subj.keyOrder) {
    for (const q of subj.topics[k].questions) all.push({...q, _cat: k});
  }
  const seed = stringHash(todayStr() + ":" + subjKey);
  return seededShuffle(all, seed).slice(0, 5).map(shuffleOptions);
}

function updateDailyStreak() {
  const today = todayStr(); const yest = dateOffset(-1);
  const last = loadDailyLast();
  let cur = loadDailyStreak();
  if (last === today) return cur;
  if (last === yest) cur = cur + 1;
  else cur = 1;
  lsSet(dailyStreakKey(), String(cur));
  lsSet(dailyLastKey(), today);
  return cur;
}

function makeMatchPairs(subjKey, topicKey, count) {
  count = count || 6;
  if (subjKey === "social" && SOCIAL_RAW[topicKey]) {
    return shuffle(SOCIAL_RAW[topicKey].terms).slice(0, count).map(t => ({ a: t.term, b: t.def }));
  }
  const topic = SUBJECTS[subjKey].topics[topicKey];
  const pairs = topic.questions.map(q => {
    let label = q.q;
    const m = label.match(/["""]([^"""]+)["""]/);
    if (m) label = m[1];
    else label = label.replace(/^(Which|What is|What|How many|How|Who is|Who|Identify).*?(:|\?\??)\s*/i, "").replace(/\?$/, "");
    if (!label) label = q.q.replace(/\?$/, "");
    return { a: q.opts[q.a], b: label.length > 70 ? label.slice(0, 67) + "..." : label };
  });
  return shuffle(pairs).slice(0, count);
}

function startMatch(topicKey) {
  clearTimer();
  state.matchTopic = topicKey;
  const pairs = makeMatchPairs(state.subject, topicKey, 6);
  const cards = [];
  pairs.forEach((p, i) => {
    cards.push({ type:"a", pairId:i, text:p.a });
    cards.push({ type:"b", pairId:i, text:p.b });
  });
  state.matchCards = shuffle(cards);
  state.matchFlipped = [];
  state.matchMatched = new Set();
  state.matchMoves = 0;
  state.matchStart = Date.now();
  state.matchPairs = pairs.length;
  state.screen = "match";
  chimeStart();
  render();
}

function flipMatchCard(idx) {
  if (state.matchFlipped.length >= 2) return;
  if (state.matchFlipped.indexOf(idx) !== -1) return;
  const card = state.matchCards[idx];
  if (state.matchMatched.has(card.pairId)) return;
  state.matchFlipped.push(idx);
  tapTick();
  if (state.matchFlipped.length === 2) {
    render();
    setTimeout(checkMatchResult, 850);
  } else {
    render();
  }
}

function checkMatchResult() {
  const [a, b] = state.matchFlipped;
  const cA = state.matchCards[a]; const cB = state.matchCards[b];
  state.matchMoves++;
  if (cA.pairId === cB.pairId && cA.type !== cB.type) {
    state.matchMatched.add(cA.pairId);
    chimeCorrect();
    smallConfetti();
    if (state.matchMatched.size === state.matchPairs) {
      state.matchFlipped = [];
      setTimeout(finishMatch, 450);
      render();
      return;
    }
  } else {
    toneWrong();
  }
  state.matchFlipped = [];
  render();
}

function finishMatch() {
  const elapsed = (Date.now() - state.matchStart) / 1000;
  state.matchElapsed = elapsed;
  const key = "g6_matchBest_" + state.subject + "_" + state.matchTopic;
  const best = parseFloat(lsGet(key, "9999"));
  if (elapsed < best) lsSet(key, String(elapsed));
  const earned = loadTrophies(); const newOnes = [];
  if (elapsed < 60) tryEarn(earned, newOnes, "match_master");
  saveTrophies(earned);
  if (newOnes.length) setTimeout(() => queueToasts(newOnes), 700);
  state.screen = "match-done";
  bigConfetti();
  chimeAchievement();
  render();
  historyChanged();
}

function termleWordOfDay() {
  const seed = stringHash(todayStr() + ":termle");
  return TERMLE_WORDS[seed % TERMLE_WORDS.length];
}
function loadTermleState() {
  try {
    const s = JSON.parse(lsGet("g6_termleState", "null"));
    if (s && s.date === todayStr()) return s;
    return null;
  } catch(e) { return null; }
}
function saveTermleState(s) { lsSet("g6_termleState", JSON.stringify(s)); }
function loadTermleStreak() { return parseInt(lsGet("g6_termleStreak", "0"), 10); }
function loadTermleLast() { return lsGet("g6_termleLast", ""); }
function updateTermleStreak(won) {
  const today = todayStr(); const yest = dateOffset(-1);
  const last = loadTermleLast();
  if (last === today) return loadTermleStreak();
  let cur = loadTermleStreak();
  if (last === yest && won) cur = cur + 1;
  else cur = won ? 1 : 0;
  lsSet("g6_termleStreak", String(cur));
  lsSet("g6_termleLast", today);
  return cur;
}

function startTermle() {
  clearTimer(); clearSpeedTimer();
  const saved = loadTermleState();
  if (saved) {
    state.termleWord = saved.word;
    state.termleGuesses = saved.guesses || [];
    state.termleStatuses = saved.statuses || [];
    state.termleCurrent = saved.current || "";
    state.termleStatus = saved.status || "playing";
  } else {
    state.termleWord = termleWordOfDay();
    state.termleGuesses = [];
    state.termleStatuses = [];
    state.termleCurrent = "";
    state.termleStatus = "playing";
  }
  state.screen = "termle";
  render();
}

function termleType(letter) {
  if (state.termleStatus !== "playing") return;
  if (state.termleCurrent.length >= 5) return;
  state.termleCurrent += letter.toUpperCase();
  tapTick();
  persistTermleState();
  render();
}
function termleBackspace() {
  if (state.termleStatus !== "playing") return;
  state.termleCurrent = state.termleCurrent.slice(0, -1);
  tapTick();
  persistTermleState();
  render();
}
function termleSubmit() {
  if (state.termleStatus !== "playing") return;
  if (state.termleCurrent.length !== 5) return;
  const guess = state.termleCurrent.toUpperCase();
  const statuses = checkTermleGuess(guess, state.termleWord);
  state.termleGuesses.push(guess);
  state.termleStatuses.push(statuses);
  state.termleCurrent = "";
  if (guess === state.termleWord) {
    state.termleStatus = "won";
    const streak = updateTermleStreak(true);
    bigConfetti(); chimeAchievement();
    const earned = loadTrophies(); const newOnes = [];
    tryEarn(earned, newOnes, "termle_first");
    if (streak >= 3) tryEarn(earned, newOnes, "termle_3");
    if (streak >= 7) tryEarn(earned, newOnes, "termle_7");
    saveTrophies(earned);
    if (newOnes.length) setTimeout(() => queueToasts(newOnes), 700);
  } else if (state.termleGuesses.length >= 6) {
    state.termleStatus = "lost";
    updateTermleStreak(false);
    toneTimeout();
  } else {
    chimePop();
  }
  persistTermleState();
  render();
}
function persistTermleState() {
  saveTermleState({
    date: todayStr(),
    word: state.termleWord,
    guesses: state.termleGuesses,
    statuses: state.termleStatuses,
    current: state.termleCurrent,
    status: state.termleStatus
  });
}
function checkTermleGuess(guess, word) {
  const result = ["absent","absent","absent","absent","absent"];
  const wordChars = word.split("");
  const used = [false,false,false,false,false];
  for (let i = 0; i < 5; i++) {
    if (guess[i] === wordChars[i]) { result[i] = "correct"; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === "correct") continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === wordChars[j]) {
        result[i] = "present"; used[j] = true; break;
      }
    }
  }
  return result;
}
function getKeyState(letter) {
  let best = null;
  for (let i = 0; i < (state.termleGuesses||[]).length; i++) {
    for (let j = 0; j < 5; j++) {
      if (state.termleGuesses[i][j] === letter) {
        const s = state.termleStatuses[i][j];
        if (s === "correct") return "correct";
        if (s === "present") best = "present";
        else if (!best) best = "absent";
      }
    }
  }
  return best;
}

function startTwoTruths() {

function getTopicTerms(subjKey, topicKey) {
  if (subjKey === "social" && SOCIAL_RAW[topicKey]) {
    return SOCIAL_RAW[topicKey].terms.slice();
  }
  const topic = SUBJECTS[subjKey].topics[topicKey];
  return topic.questions.map(q => {
    let def = q.q;
    const m = def.match(/["""]([^"""]+)["""]/);
    if (m) def = m[1];
    else def = def.replace(/^(Which|What is|What|How many|How|Who is|Who|Identify).*?(:|\?\??)\s*/i, "").replace(/\?$/, "");
    return { term: q.opts[q.a], def: def };
  });
}
function doNextTTL() {
  const subj = curSubject();
  const candidates = subj.keyOrder.filter(k => getTopicTerms(state.subject, k).length >= 4);
  if (candidates.length === 0) { alert("Not enough terms in this subject for Two Truths & a Lie."); state.screen = "home"; render(); return; }
  const topicKey = candidates[Math.floor(Math.random() * candidates.length)];
  const terms = getTopicTerms(state.subject, topicKey);
  const picks = shuffle(terms.slice()).slice(0, 3);
  const others = terms.filter(t => !picks.some(p => p.term === t.term));
  const lieIdx = Math.floor(Math.random() * 3);
  const wrongDef = others[Math.floor(Math.random() * others.length)].def;
  const statements = picks.map((p, i) => ({
    term: p.term,
    def: i === lieIdx ? wrongDef : p.def,
    isLie: i === lieIdx,
    realDef: p.def
  }));
  state.ttlStatements = shuffle(statements);
  state.ttlAnswered = false;
  state.ttlSelected = -1;
  state.ttlTopicKey = topicKey;
  state.screen = "ttl";
  render();
}
function answerTTL(i) {
  if (state.ttlAnswered) return;
  state.ttlAnswered = true;
  state.ttlSelected = i;
  state.ttlTotal++;
  if (state.ttlStatements[i].isLie) {
    state.ttlScore++;
    state.ttlStreak++;
    chimeCorrect(); smallConfetti();
    if (state.ttlStreak >= 10) {
      const earned = loadTrophies(); const newOnes = [];
      tryEarn(earned, newOnes, "truth_seeker");
      saveTrophies(earned);
      if (newOnes.length) setTimeout(() => queueToasts(newOnes), 700);
    }
  } else {
    state.ttlStreak = 0;
    toneWrong();
  }
  render();
}

function doSpinWheel() {
  if (state.spinSpinning) return;
  state.spinSpinning = true;
  state.spinResult = null;
  state.spinAnswered = false;
  const subjects = SUBJECT_ORDER;
  const targetIdx = Math.floor(Math.random() * subjects.length);
  const segDeg = 360 / subjects.length;
  // We want the pointer (top) to land in the middle of the target segment.
  // Pointer is at 0deg. After rotation, segment 0 starts at -rotation. We need the rotation to be -(targetIdx * segDeg) - segDeg/2 (mod 360), plus a few full spins.
  const finalDeg = 360 - (targetIdx * segDeg + segDeg / 2);
  const fullSpins = 5;
  const next = Math.floor(state.spinAngle / 360 + fullSpins) * 360 + finalDeg;
  state.spinAngle = next;
  render();
  setTimeout(() => {
    const subj = subjects[targetIdx];
    const topics = SUBJECTS[subj].keyOrder;
    const topic = topics[Math.floor(Math.random() * topics.length)];
    const qs = SUBJECTS[subj].topics[topic].questions;
    const q = shuffleOptions(qs[Math.floor(Math.random() * qs.length)]);
    state.spinResult = { subj, topic, question: q };
    state.spinSpinning = false;
    state.spinAnswered = false;
    state.spinSelected = -1;
    render();
  }, 2300);
}
function answerSpin(i) {
  if (state.spinAnswered) return;
  state.spinAnswered = true;
  state.spinSelected = i;
  state.spinTotal++;
  const q = state.spinResult.question;
  if (i === q.a) {
    state.spinScore++;

  }
  render();
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}

}
function tone(freq, dur, type, gain) {
  const ctx = getCtx(); if (!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = type || "sine"; o.frequency.value = freq;
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain || 0.15, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

/* ---------- Background music (self-contained, Web Audio) ---------- */
let musicOn = lsGet("g6_music", "off") === "on";
let musicTimer = null;
let musicStep = 0;
let musicMasterGain = null;

// A cheerful, bouncy Italian-tarantella-style loop in A minor / C major.
// Note frequencies (Hz). 0 = rest.
const NOTE = {
  0:0, A3:220.00, B3:246.94, C4:261.63, D4:293.66, E4:329.63, F4:349.23,
  G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00
};
// Lively melody (each entry = one eighth-note step)
const MUSIC_MELODY = [
  "A4","C5","E5","C5","A4","E5","D5","C5",
  "B4","D5","F5","D5","B4","G4","B4","D5",
  "C5","E5","G5","E5","C5","A4","C5","E5",
  "D5","B4","G4","B4","A4","0","A4","0",
  "E5","E5","F5","E5","D5","C5","B4","A4",
  "C5","C5","D5","C5","B4","A4","G4","E4",
  "A4","B4","C5","D5","E5","F5","E5","D5",
  "C5","B4","A4","B4","A4","0","0","0"
];
// Simple bass line (root notes, one per two steps)
const MUSIC_BASS = [
  "A3","A3","G4","G4","F4","F4","E4","E4",
  "A3","A3","G4","G4","F4","F4","E4","E4",
  "A3","A3","F4","F4","C4","C4","E4","E4",
  "A3","A3","E4","E4","A3","A3","A3","A3"
];
const MUSIC_STEP_MS = 175;

function musicNote(freq, dur, type, gain, dest) {
  const ctx = getCtx(); if (!ctx || !freq) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.connect(g); g.connect(dest || ctx.destination);
  o.type = type || "triangle"; o.frequency.value = freq;
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function musicTick() {
  const ctx = getCtx(); if (!ctx) return;
  const mIdx = musicStep % MUSIC_MELODY.length;
  const bIdx = Math.floor(musicStep / 2) % MUSIC_BASS.length;
  const mel = NOTE[MUSIC_MELODY[mIdx]] || 0;
  if (mel) musicNote(mel, 0.22, "triangle", 0.10, musicMasterGain);
  if (musicStep % 2 === 0) {
    const bass = NOTE[MUSIC_BASS[bIdx]] || 0;
    if (bass) musicNote(bass / 2, 0.34, "sine", 0.09, musicMasterGain);
  }
  // little tambourine-ish tick on the offbeat for that Italian bounce
  if (musicStep % 2 === 1) musicNote(2200, 0.03, "square", 0.015, musicMasterGain);
  musicStep++;
}
function startMusic() {
  const ctx = getCtx(); if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  if (!musicMasterGain) {
    musicMasterGain = ctx.createGain();
    musicMasterGain.gain.value = 0.55;
    musicMasterGain.connect(ctx.destination);
  }
  if (musicTimer) return;
  musicStep = 0;
  musicTick();
  musicTimer = setInterval(musicTick, MUSIC_STEP_MS);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}
function toggleMusic() {
  musicOn = !musicOn;
  lsSet("g6_music", musicOn ? "on" : "off");
  if (musicOn) startMusic(); else stopMusic();
  render();
}
function maybeAutoMusic() {
  // resume music on any user interaction if it was left on
  if (musicOn && !musicTimer) startMusic();
}

let timerInterval = null;
let lastBeepSec = 99;

function startTimer() {
  clearTimer();
  if (state.mode !== "timed" || state.answered) return;
  state.timeRemaining = TIMED_PER_Q;
  lastBeepSec = 99;
  updateTimerUI();
  timerInterval = setInterval(() => {
    state.timeRemaining -= 100;
    if (state.timeRemaining <= 0) {
      clearTimer();
      timeoutAnswer();
      return;
    }
    updateTimerUI();
    const sec = Math.ceil(state.timeRemaining / 1000);
    if (sec <= 3 && sec !== lastBeepSec) {
      lastBeepSec = sec;
      tone(900, 0.08, "square", 0.16);
    }
  }, 100);
}
function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerUI() {
  const ring = document.querySelector(".ring-pg");
  const num = document.querySelector(".timer-num");
  const wrap = document.querySelector(".timer-ring");
  if (!ring || !num) return;
  const pct = Math.max(0, state.timeRemaining / TIMED_PER_Q);
  ring.setAttribute("stroke-dashoffset", String((1 - pct) * RING_C));
  num.textContent = String(Math.max(0, Math.ceil(state.timeRemaining / 1000)));
  let color = "#10b981";
  if (pct < 0.45) color = "#f59e0b";
  if (pct < 0.3) color = "#ef4444";
  ring.setAttribute("stroke", color);
  if (wrap) wrap.classList.toggle("warn", pct < 0.45);
}
function timeoutAnswer() {
  if (state.answered) return;
  const q = state.questions[state.index];
  state.selected = -1;
  state.answered = true;
  state.categoryStats[q._cat].total++;
  state.streak = 0;

  render();
}
